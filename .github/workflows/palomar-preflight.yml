# Runs Palomar's mechanical verification for one package before it is submitted.
# Usage: gh workflow run palomar-preflight.yml -f commit=<40-hex> -f package=<ID> -f request_id=<12 chars>
name: Palomar preflight

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full 40-character commit to verify
        required: true
        type: string
      package:
        description: Package folder under FCPalomar/
        required: true
        type: string
      request_id:
        description: Exactly 12 lowercase alphanumeric characters
        required: true
        type: string

permissions:
  contents: read

jobs:
  palomar-preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@14aa8d6b3c2f14a8540605e37144560b9a00e7e7
    with:
      repository: ${{ github.repository }}
      commit: ${{ inputs.commit }}
      pipeline_commit: 14aa8d6b3c2f14a8540605e37144560b9a00e7e7
      request_id: ${{ inputs.request_id }}
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"comparator_config_path":"FCPalomar/${{ inputs.package }}/comparator.json","formalization_metadata_path":"FCPalomar/${{ inputs.package }}/formalization.yaml","authorization_relationship":"I am a responsible author or maintainer"}'
