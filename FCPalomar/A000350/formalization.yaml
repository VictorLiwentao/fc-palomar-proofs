version: "v0.4"

project:
  name: "OEIS A000350: Fibonacci numbers whose binary expansion ends with their index (Stephan's conjecture, Alekseyev 2009)"
  description: >-
    The binary expansion of F(m) ends with that of m only for m = 0, 1, 5. Conjectured
    by Ralf Stephan (2006), proved by Max Alekseyev (2009).
  authors:
    - "Wentao Li"
  responsible_maintainers:
    - "Wentao Li"
  license: "Apache-2.0"

sources:
  - title: "OEIS A000350"
    authors:
      - "Ralf Stephan"
      - "Max Alekseyev"
    id: "https://oeis.org/A000350"
    type: "web discussion"
    location: "comments (2006, 2009)"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      The Lean proof is Alekseyev's argument via F(3·2^k + n) ≡ F(n) (mod 2^(k+1)).

related_formalizations: []

classification:
  arxiv:
    - "math.NT"
  msc2020:
    - "11B39"

status:
  scope: >-
    The selected theorem is OeisA350.digits_prefix_fib_iff. The statement was written
    for this package; it is not copied from an existing formalization.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "OeisA350.digits_prefix_fib_iff"
      file: "FCPalomar/A000350/Solution.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      comparator_config: "FCPalomar/A000350/comparator.json"

automation:
  methods:
    - method: "agent"
      models:
        - "claude-opus-5-5"
      framework: "Claude Code"
      tool_setup: >-
        Claude Code (Anthropic) wrote the Lean proof and this package under the
        direction of Wentao Li, with independent agent review of the statement against
        its source. Wentao Li is the human author and maintainer.
  spend_usd: "not available"
  notes: >-
    AI assistance was material. The mathematics is credited to the original authors
    listed under sources.

fidelity:
  divergences: >-
    None. The statement is new: it was written for this package from the source and is
    proposed for Formal Conjectures as FormalConjectures/OEIS/350.lean with the same
    declarations; only the FormalConjecturesUtil import, attributes and docstrings
    differ.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    Agent checks only: strict build with no warnings, axiom check of the selected
    theorems, verbatim comparison of the copied definitions and statement, and an
    independent agent review of source fidelity. No human review beyond Wentao Li is
    claimed.

alignment:
  namespace: "OeisA350"
  statements:
    - source: >-
        F(m) ends with m in binary iff m ∈ {0, 1, 5}.
      lean: "OeisA350.digits_prefix_fib_iff"
      module: "FCPalomar.A000350.Solution"
      status: "proved"
