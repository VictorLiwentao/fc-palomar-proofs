version: "v0.4"

project:
  name: "Erdős–Rubin–Taylor: complete multipartite graphs with parts of size 2 are k-choosable"
  description: >-
    The complete k-partite graph K_{2,...,2} is k-choosable (Erdős, Rubin and Taylor
    1979). It is a case of Ohba's conjecture (2002) that ch(G) = χ(G) whenever G has at
    most 2χ(G)+1 vertices, which Noel, Reed and Wu proved in 2015. This package
    formalizes only the Erdős–Rubin–Taylor case, by a direct induction with Hall's
    theorem. The analogous question for parts of size three is harder: ch(K_{3*k}) =
    ⌈(4k−1)/3⌉ (Kierstead 2000).
  authors:
    - "Wentao Li"
  responsible_maintainers:
    - "Wentao Li"
  license: "Apache-2.0"

sources:
  - title: "Choosability in graphs"
    authors:
      - "Paul Erdős"
      - "Arthur L. Rubin"
      - "Herbert Taylor"
    id: "Congr. Numer. 26 (1980) 125-157"
    type: "paper"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Induction on parts of size at most two with Hall's theorem; the Lean proof proves
      a slightly more general lemma for lists at least as long as the number of parts.
  - title: "On chromatic-choosable graphs"
    authors:
      - "Kyoji Ohba"
    id: "doi:10.1002/jgt.10033"
    type: "paper"
    location: "J. Graph Theory 40 (2002) 130-135"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      States Ohba's conjecture, which contains this case.
  - title: "A Proof of a Conjecture of Ohba"
    authors:
      - "Jonathan A. Noel"
      - "Bruce A. Reed"
      - "Hehui Wu"
    id: "doi:10.1002/jgt.21819"
    type: "paper"
    location: "J. Graph Theory 79 (2015) 86-102; arXiv:1211.1999"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Proves Ohba's conjecture in general; not used in the Lean proof.
  - title: "On the choosability of complete multipartite graphs with part size three"
    authors:
      - "H. A. Kierstead"
    id: "doi:10.1016/S0012-365X(99)00157-0"
    type: "paper"
    location: "Discrete Math. 211 (2000) 255-259"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Shows that the choice number of K_{3*k} is ⌈(4k−1)/3⌉. Cited for context only.

related_formalizations:
  - title: "Formal Conjectures: FormalConjectures/Wikipedia/OhbaConjecture.lean"
    authors:
      - "The Formal Conjectures Authors"
    id: "https://github.com/google-deepmind/formal-conjectures/blob/691719db2653905d5fa0775408370fb058e4c59f/FormalConjectures/Wikipedia/OhbaConjecture.lean"
    relationship: "builds-on"
    note: >-
      The Challenge copies the statement and the definitions it uses verbatim from this
      file at commit 691719db. The upstream declaration is `sorry` at that commit.

