    None. The statement is new: it was written for this package from the source and is
    proposed for Formal Conjectures as FormalConjectures/OEIS/326097.lean with the same
    declarations. The Challenge leaves out only the FormalConjecturesUtil import,
    attributes, test lemmas and unrelated declarations of that file.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    Checks by AI agents only: a strict build with no warnings, an axiom check of the
    selected theorems, a check that the Challenge declarations appear verbatim in
    Solution, and a review of the statement against its source by a separate agent. No
    independent human review is claimed.

alignment:
  namespace: "OeisA326097"
  statements:
    - source: >-
        A326097: the e.g.f. A(x) satisfies 1 = Σ_{n≥0} ((1+x)^n − A(x))^n/n! (name
        line). The Lean statement says that exactly one power series over ℚ does.
      lean: "OeisA326097.a326097_existsUnique"
      module: "FCPalomar.OeisA326097.Solution"
      status: "proved"
    - source: >-
        a(4n+2) ≡ 1 (mod 2), otherwise the terms a(k) are even for k > 3 (conjecture,
        formula section). The Lean statement is the stronger 'if and only if' form,
        which also covers k = 0, 1, 3, and includes the integrality of a(k).
      lean: "OeisA326097.a326097_parity"
      module: "FCPalomar.OeisA326097.Solution"
      status: "proved"
    - source: >-
        A385907: the e.g.f. A(x) satisfies 1 = Σ_{n≥0} (1/(1−x)^n − A(x))^n/n! (name
        line). The Lean statement says that exactly one power series over ℚ does.
      lean: "OeisA326097.a385907_existsUnique"
      module: "FCPalomar.OeisA326097.Solution"
      status: "proved"
    - source: >-
        Not stated in A385907. The same parity pattern as for A326097: a(k) is an
        integer, and it is odd if and only if k ∈ {0, 1, 3} or k ≡ 2 (mod 4).
      lean: "OeisA326097.a385907_parity"
      module: "FCPalomar.OeisA326097.Solution"
      status: "proved"
