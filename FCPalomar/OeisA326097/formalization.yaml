version: "v0.4"

project:
  name: "OEIS A326097: the parity of a(k) (Hanna's conjecture)"
  description: >-
    The e.g.f. A(x) of OEIS A326097 satisfies 1 = Σ_{n≥0} ((1+x)^n − A(x))^n/n!. The
    package proves that this equation has exactly one solution in ℚ[[x]], that every
    a(k) = k! [x^k] A(x) is an integer, and that a(k) is odd if and only if k ∈ {0, 1,
    3} or k ≡ 2 (mod 4). This settles Paul D. Hanna's 2019 parity conjecture in a
    slightly stronger form. The same holds for OEIS A385907, where (1+x)^n is replaced
    by 1/(1−x)^n.
  authors:
    - "Wentao Li"
  responsible_maintainers:
    - "Wentao Li"
  license: "Apache-2.0"

sources:
  - title: "OEIS A326097"
    authors:
      - "Paul D. Hanna"
    id: "https://oeis.org/A326097"
    type: "web discussion"
    location: "entry of June 6, 2019, formula section"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Defines A(x) by the equation and conjectures that a(4n+2) is odd and that every
      other a(k) with k > 3 is even. Searches in November 2026 (the OEIS entry and its
      revision history, arXiv, Zenodo, GitHub issues and code, and public Lean result
      repositories) found no earlier written proof. The proof in this package is
      credited to Wentao Li.
  - title: "OEIS A385907"
    authors:
      - "Paul D. Hanna"
    id: "https://oeis.org/A385907"
    type: "web discussion"
    location: "entry of July 24, 2025, name line"
    relationship: "adapts"
    author_endorsement: "not-contacted"
    note: >-
      Defines the companion sequence with 1/(1−x)^n in place of (1+x)^n. The entry
      states no parity claim; the package adds the parity theorem, proved by the same
      argument.

