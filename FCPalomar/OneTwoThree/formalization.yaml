    The selected theorems are one_two_three_conjecture.variants.one_to_five and
    one_to_thirty, with weightedDegree, IsVertexColouringWeighting and NoIsolatedEdge
    copied verbatim.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "OneTwoThreeConjecture.one_two_three_conjecture.variants.one_to_five"
      file: "FCPalomar/OneTwoThree/Solution.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      comparator_config: "FCPalomar/OneTwoThree/comparator.json"
    - declaration: "OneTwoThreeConjecture.one_two_three_conjecture.variants.one_to_thirty"
      file: "FCPalomar/OneTwoThree/Solution.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      comparator_config: "FCPalomar/OneTwoThree/comparator.json"

automation:
  methods:
    - method: "agent"
      models:
        - "claude-opus-5-5"
      framework: "Claude Code"
      tool_setup: >-
        Claude Code (Anthropic) wrote the Lean proof and this package under the
        direction of Wentao Li, with independent agent review of the statement against
        its source. Wentao Li is the human author and maintainer.
  spend_usd: "not available"
  notes: >-
    AI assistance was material. The mathematics is credited to the original authors
    listed under sources.

fidelity:
  divergences: >-
    None. The Challenge copies the Formal Conjectures statement and definitions
    verbatim; only the FormalConjecturesUtil import, attributes, test lemmas and
    docstrings are omitted.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    Agent checks only: strict build with no warnings, axiom check of the selected
    theorems, verbatim comparison of the copied definitions and statement, and an
    independent agent review of source fidelity. No human review beyond Wentao Li is
    claimed.

alignment:
  namespace: "OneTwoThreeConjecture"
  statements:
    - source: >-
        Every finite graph without an isolated edge has a vertex-colouring edge-
        weighting with weights 1..5 (and hence 1..30).
      lean: "OneTwoThreeConjecture.one_two_three_conjecture.variants.one_to_five"
      module: "FCPalomar.OneTwoThree.Solution"
      status: "proved"
    - source: >-
        Every finite graph without an isolated edge has a vertex-colouring edge-
        weighting with weights 1..5 (and hence 1..30).
      lean: "OneTwoThreeConjecture.one_two_three_conjecture.variants.one_to_thirty"
      module: "FCPalomar.OneTwoThree.Solution"
      status: "proved"
