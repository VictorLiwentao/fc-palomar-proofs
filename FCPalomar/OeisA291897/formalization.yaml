version: "v0.4"

project:
  name: "OEIS A291897 and A292911: Shevelev's divisibility conjectures for Euler polynomials"
  description: >-
    Let E_m(x) be the Euler polynomials, Σ E_m(x)t^m/m! = 2e^(xt)/(e^t + 1), and E_k the
    Euler numbers, sech t = Σ E_k t^k/k!. OEIS A291897 is the numerator of E_(2n−1)(n),
    and A292911 is the set of n ≥ 1 with (2n − 1)³ dividing it. In September 2017
    Vladimir Shevelev conjectured that (2n − 1)² divides A291897(n) for every n ≥ 1, and
    that every prime p ≡ 1 (mod 4) has the form 2a − 1 with a in A292911. The package
    proves both conjectures and their sharp forms: (2n − 1)³ divides A291897(n) if and
    only if 2n − 1 divides E_(2n−2), and, for an odd prime p, (p + 1)/2 lies in A292911
    if and only if p ≡ 1 (mod 4). The Lean definitions of E_m(x) and E_k are
    recurrences, and the package checks them against the two e.g.f.s. With N = 2n − 1,
    the classical expansion of E_m(x) about 1/2 (DLMF 24.2.10) at x = n gives the first
    result and the criterion; the prime case then follows from Ely's congruence (1882):
    E_(p−1) ≡ 0 or 2 (mod p) as p ≡ 1 or 3 (mod 4). The package proves both ingredients
    in Lean. By the sharp form, the numbers 2a − 1 with a in A292911 are exactly the odd
    m with m | E_(m−1). The first composite one is 1105 = 5·13·17, at a = 553. Thomas
    Ordowski conjectured (OEIS A122045, 2020) that every odd composite m with m |
    E_(m−1) is a Carmichael number whose prime factors are all ≡ 1 (mod 4). The package
    does not treat that conjecture, or Shevelev's companion conjecture A292782. The
    audience is number theorists who study congruences of Euler numbers and Euler
    polynomials modulo primes and prime powers. No earlier proof of Shevelev's
    conjectures was found.
  authors:
    - "Wentao Li"
  responsible_maintainers:
    - "Wentao Li"
  license: "Apache-2.0"

sources:
  - title: "OEIS A291897"
    authors:
      - "Vladimir Shevelev"
    id: "https://oeis.org/A291897"
    type: "web discussion"
    location: "entry of September 22, 2017, comments"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Conjectures that a(n) is divisible by (2n − 1)², verified to 5000 by R. G. Wilson
      v. Searches in November 2026 (the OEIS entries, arXiv, Zenodo, OpenWitness, GitHub
      issues, pull requests and code, and public Lean and OEIS-proof result
      repositories) found no earlier proof. The proof in this package is credited to
      Wentao Li.
  - title: "OEIS A292911"
    authors:
      - "Vladimir Shevelev"
    id: "https://oeis.org/A292911"
    type: "web discussion"
    location: "entry of September 26, 2017, comments"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Conjectures that every prime of the form 4k + 1 is contained in {2a(n) − 1}. It
      replaced Shevelev's first conjecture, that for n ≥ 2 the numbers 2a(n) − 1 are the
      consecutive primes of the form 4k + 1, which Peter J. C. Moses disproved at n =
      553 (2·553 − 1 = 1105 = 5·13·17; Shevelev's comment of September 27, 2017).
  - title: "Digital Library of Mathematical Functions, §24.2"
    authors:
      - "NIST"
    id: "https://dlmf.nist.gov/24.2"
    type: "book"
    location: "equations 24.2.9–24.2.10"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      The expansion of E_m(x) in Euler numbers that the proof derives in Lean.
  - title: "Some notes on the numbers of Bernoulli and Euler"
    authors:
      - "George S. Ely"
    id: "https://doi.org/10.2307/2369547"
    type: "paper"
    location: "Amer. J. Math. 5 (1882), 337–341"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Ely's congruence: for an odd prime p, E_(p−1) ≡ 0 or 2 (mod p) according as p ≡ 1
      or 3 (mod 4). The OEIS records it in A000364 and, in the form p | E_(p−1) iff p ≡
      1 (mod 4), in A122045. The package proves it in Lean.
  - title: "OEIS A122045"
    authors:
      - "Roger L. Bagula"
    id: "https://oeis.org/A122045"
    type: "web discussion"
    location: "comments, Thomas Ordowski, February 6, 2020"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      The Euler numbers. Ordowski notes that the odd primes p with p | E(p − 1) are the
      primes p ≡ 1 (mod 4), and conjectures that every odd composite m with m | E(m − 1)
      is a Carmichael number whose prime factors are all ≡ 1 (mod 4) (A265237). By
      a291897_cube_dvd_iff these m are the composite numbers 2a − 1 with a in A292911.
      The conjecture is not treated here.

