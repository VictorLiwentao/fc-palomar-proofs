automation:
  methods:
    - method: "agent"
      models:
        - "claude-opus-5-5"
      framework: "Claude Code"
      tool_setup: >-
        Claude Code (Anthropic) developed the proof, wrote the Lean formalization and
        prepared this package under the direction of Wentao Li, with independent agent
        review of the statement against its source. Wentao Li is the human author and
        maintainer.
  spend_usd: "not available"
  notes: >-
    AI assistance was material, including in developing the proof. The conjectures are
    due to Vladimir Shevelev. The ingredients are classical (DLMF 24.2.10, Ely 1882);
    their combination for these conjectures is new as far as the searches found. Wentao
    Li is its human author.

fidelity:
  divergences: >-
    a291897_conjecture and a292911_conjecture state Shevelev's conjectures as written,
    with offset 1. The numerator is Rat.num of E_(2n−1)(n). Euler polynomials and
    numbers are defined by recurrences and checked against their standard e.g.f.s by
    eulerPoly_egf and eulerNum_egf. The three iff theorems are sharpenings not stated in
    the sources. The statements were written for this package from the OEIS entries and
    are proposed for Formal Conjectures as FormalConjectures/OEIS/291897.lean, which
    does not exist upstream yet.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    Checks by AI agents only: a strict build with no warnings, an axiom check of the
    selected theorems, a check that the Challenge declarations appear verbatim in
    Solution, and a review of the statement against its source by a separate agent. No
    independent human review is claimed.

alignment:
  namespace: "OeisA291897"
  statements:
    - source: >-
        The Euler polynomials E(n,x), with e.g.f. 2e^(xt)/(e^t + 1); the Lean definition
        is a recurrence, checked against this e.g.f.
      lean: "OeisA291897.eulerPoly_egf"
      module: "FCPalomar.OeisA291897.Solution"
      status: "proved"
    - source: >-
        The Euler numbers E(n) (A122045), with e.g.f. sech t; the Lean definition is a
        recurrence, checked against this e.g.f.
      lean: "OeisA291897.eulerNum_egf"
      module: "FCPalomar.OeisA291897.Solution"
      status: "proved"
    - source: >-
        Conjecture: a(n) is divisible by (2*n-1)^2 (A291897, comments), for the
        numerator a(n) of E(2n−1, n), n ≥ 1.
      lean: "OeisA291897.a291897_conjecture"
      module: "FCPalomar.OeisA291897.Solution"
      status: "proved"
    - source: >-
        Not in the source. A sharpening of the entry's note that a(n) is sometimes
        divisible by (2n−1)³: exactly when 2n − 1 divides E(2n − 2).
      lean: "OeisA291897.a291897_cube_dvd_iff"
      module: "FCPalomar.OeisA291897.Solution"
      status: "proved"
    - source: >-
        Conjecture: Every prime of the form 4*k+1 (A002144) is contained in the sequence
        {2*a(n)-1} (A292911, comments).
      lean: "OeisA291897.a292911_conjecture"
      module: "FCPalomar.OeisA291897.Solution"
      status: "proved"
    - source: >-
        Not in the sources. For an odd prime p, p³ divides the numerator of E(p,
        (p+1)/2) iff p ≡ 1 (mod 4).
      lean: "OeisA291897.prime_cube_dvd_num_iff"
      module: "FCPalomar.OeisA291897.Solution"
      status: "proved"
    - source: >-
        Not in the sources. For an odd prime p, (p + 1)/2 is a term of A292911 iff p ≡ 1
        (mod 4); the 'if' half is Shevelev's conjecture.
      lean: "OeisA291897.prime_mem_a292911_iff"
      module: "FCPalomar.OeisA291897.Solution"
      status: "proved"
