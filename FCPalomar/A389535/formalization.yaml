version: "v0.4"

project:
  name: "OEIS A389535: Hanna's formula (7), A(x)^5 ≡ A(x^5) (mod 5)"
  description: >-
    For the unique power series A with A(0) = 0, a(1) = 1 and A(x A(x)^4 + x A(x)^5) =
    A(x)^5, the coefficients are integers and A(x)^5 ≡ A(x^5) (mod 5). Formula (7) in
    OEIS A389535 is stated there as a conjecture by Paul D. Hanna.
  authors:
    - "Wentao Li"
  responsible_maintainers:
    - "Wentao Li"
  license: "Apache-2.0"

sources:
  - title: "OEIS A389535"
    authors:
      - "Paul D. Hanna"
    id: "https://oeis.org/A389535"
    type: "web discussion"
    location: "formula (7), labelled conjecture"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      States the functional equation and formula (7) as a conjecture of Paul D. Hanna
      (2025). The congruence step of the proof is the standard Frobenius identity B(x)^5
      ≡ B(x^5) (mod 5) for integer power series; the main work is integrality, existence
      and uniqueness.

related_formalizations: []

