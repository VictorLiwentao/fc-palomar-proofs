version: "v0.4"

project:
  name: "OEIS A396843: integral construction and oddness (Hanna's conjecture)"
  description: >-
    The ordinary generating function A(x) of OEIS A396843, with A(0) = 0 and A'(0) = 1,
    satisfies A(x A(x) − 3x A(x)^2) = x^2. The package proves that this equation has
    exactly one integer power-series solution and that every term a(n) with n ≥ 1 is
    odd, as conjectured by Paul D. Hanna (OEIS A396843, 2026). An earlier Lean proof of
    the oddness is in the-omega-institute/trureturing PR #6773.
  authors:
    - "Wentao Li"
  responsible_maintainers:
    - "Wentao Li"
  license: "Apache-2.0"

sources:
  - title: "OEIS A396843"
    authors:
      - "Paul D. Hanna"
    id: "https://oeis.org/A396843"
    type: "web discussion"
    location: "entry of July 1, 2026"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      States the generating-function equation and conjectures that all terms are odd.
      The separate modulo-nine conjecture was refuted by Danial Asaria and is not part
      of this package.

related_formalizations:
  - title: "VictorLiwentao/lean-oeis-proofs: LeanOeisProofs/IndependentFormalization/A396843.lean"
    authors:
      - "Wentao Li"
    id: "https://github.com/VictorLiwentao/lean-oeis-proofs/blob/1cc54d7f3ecfdcea49625ce31c8df3e22d4c6146/LeanOeisProofs/IndependentFormalization/A396843.lean"
    relationship: "builds-on"
    note: >-
      The earlier Lean 4.33/4.34 version of this proof, linked from google-
      deepmind/formal-conjectures PR #7673. This package ports it to Lean 4.35.
  - title: "the-omega-institute/trureturing PR #6773"
    authors:
      - "ElonSG"
    id: "https://github.com/the-omega-institute/trureturing/pull/6773"
    relationship: "other"
    note: >-
      An earlier Lean proof of positive-index oddness at commit 7062f8c5, using
      characteristic-two uniqueness. This package also constructs the integral solution,
      proves uniqueness over every commutative ring, and identifies every normalized
      rational solution with it.

