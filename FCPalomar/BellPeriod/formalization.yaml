version: "v0.4"

project:
  name: "Bell numbers modulo a prime are periodic with period (p^p−1)/(p−1) (Touchard, Hall)"
  description: >-
    For a prime p, B(n + (p^p − 1)/(p − 1)) ≡ B(n) (mod p) (Touchard 1933, Hall 1934,
    Williams 1945). The periods conjectured by G. C. Greubel in OEIS A146107, A146109,
    A146113, A146119 and A146121 (p = 17, 19, 23, 29, 31) are instances; OEIS already
    marks them correct. Minimality is not claimed.
  authors:
    - "Wentao Li"
  responsible_maintainers:
    - "Wentao Li"
  license: "Apache-2.0"

sources:
  - title: "Propriétés arithmétiques de certains nombres récurrents"
    authors:
      - "Jacques Touchard"
    id: "Ann. Soc. Sci. Bruxelles A 53 (1933) 21-31"
    type: "paper"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Touchard's congruence B(n+p) ≡ B(n) + B(n+1) (mod p).
  - title: "Arithmetic properties of a partition function"
    authors:
      - "Marshall Hall"
    id: "Bull. Amer. Math. Soc. 40 (1934) 387"
    type: "paper"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      The period (p^p − 1)/(p − 1).
  - title: "Numbers generated by the function e^(e^x − 1)"
    authors:
      - "G. T. Williams"
    id: "Amer. Math. Monthly 52 (1945) 323-327"
    type: "paper"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      A published proof that (p^p − 1)/(p − 1) is a period of B(n) mod p.
  - title: "OEIS A146107, A146109, A146113, A146119, A146121 (Bell numbers mod 17, 19, 23, 29, 31)"
    id: "https://oeis.org/A146107"
    type: "web discussion"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      G. C. Greubel conjectured the periods for p = 17, 19, 23, 29, 31 in these entries.
      The five instance theorems state them.

related_formalizations:
  - title: "karlesmarin/formalizations: Formalizations/Combinatorics/Enumerative/Touchard.lean"
    authors:
      - "Carles Marín"
    id: "https://github.com/karlesmarin/formalizations/blob/1d089e08101adad7789f713473274d6d98fafc33/Formalizations/Combinatorics/Enumerative/Touchard.lean"
    relationship: "adapts"
    note: >-
      The section Touchard of Solution.lean (from L to bell_add_prime, Touchard's
      congruence) is adapted from this Apache-2.0 file: private modifiers removed, lines
      rewrapped and one docstring shortened. The copyright line is kept in
      Solution.lean. The period argument (g = X^p − X − 1 in AdjoinRoot,
      bell_add_period) and the five instances are new in this package.

