version: "v0.4"

project:
  name: "Bell numbers modulo a prime are periodic with period (p^p−1)/(p−1) (Touchard, Hall)"
  description: >-
    For a prime p, B(n + (p^p − 1)/(p − 1)) ≡ B(n) (mod p) (Touchard 1933, Hall 1934).
    This settles G. C. Greubel's conjectured periods in OEIS A146107, A146109, A146113,
    A146119 and A146121 (p = 17, 19, 23, 29, 31). Minimality is not claimed.
  authors:
    - "Wentao Li"
  responsible_maintainers:
    - "Wentao Li"
  license: "Apache-2.0"

sources:
  - title: "Propriétés arithmétiques de certains nombres récurrents"
    authors:
      - "Jacques Touchard"
    id: "Ann. Soc. Sci. Bruxelles A 53 (1933) 21-31"
    type: "paper"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Touchard's congruence B(n+p) ≡ B(n) + B(n+1) (mod p).
  - title: "Arithmetic properties of a partition function"
    authors:
      - "Marshall Hall"
    id: "Bull. Amer. Math. Soc. 40 (1934) 387"
    type: "paper"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      The period (p^p − 1)/(p − 1).

