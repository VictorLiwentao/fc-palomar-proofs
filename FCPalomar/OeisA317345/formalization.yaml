automation:
  methods:
    - method: "agent"
      models:
        - "claude-opus-5-5"
      framework: "Claude Code"
      tool_setup: >-
        Claude Code (Anthropic) developed the proof, wrote the Lean formalization and
        prepared this package under the direction of Wentao Li, with independent agent
        review of the statement against its source. Wentao Li is the human author and
        maintainer.
  spend_usd: "not available"
  notes: >-
    AI assistance was material, including in developing the proof. The conjecture is due
    to Paul D. Hanna (OEIS A317345). The general theorem and the A317343 pattern are new
    in this package as far as the searches found. Wentao Li is its human author.

fidelity:
  divergences: >-
    a317345_mod_ten states Hanna's conjecture as written. exists_unique_solution,
    padic_congruence and integer_coefficients are stated for general a and b, which
    include both entries; the normalization A(0) = 1 is taken from the data.
    a317343_mod_ten is not stated in A317343. A^(−n^b) is the power of the inverse
    series, which exists because A(0) = 1. The statements were written for this package
    from the OEIS entries and are proposed for Formal Conjectures as
    FormalConjectures/OEIS/317345.lean, which does not exist upstream yet.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    Checks by AI agents only: a strict build with no warnings, an axiom check of the
    selected theorems, a check that the Challenge declarations appear verbatim in
    Solution, and a review of the statement against its source by a separate agent. No
    independent human review is claimed.

alignment:
  namespace: "OeisA317345"
  statements:
    - source: >-
        A317345: E.g.f. A(x) satisfies: [x^n] exp(n^3*x) / A(x)^(n^2) = 0 for n >= 1
        (name line); A317343: the same with exp(n^2*x) / A(x)^n. The Lean statement is
        for general a, b and says that exactly one A with A(0) = 1 does; a(0) = 1 is the
        normalization of the data, since the condition is invariant under A ↦ cA.
      lean: "OeisA317345.exists_unique_solution"
      module: "FCPalomar.OeisA317345.Solution"
      status: "proved"
    - source: >-
        Not in the sources. For a prime p with 1 ≤ b < p·a, every a(n) is p-integral and
        a(n) ≡ a(n mod p) (mod p).
      lean: "OeisA317345.padic_congruence"
      module: "FCPalomar.OeisA317345.Solution"
      status: "proved"
    - source: >-
        Implicit in the OEIS data (integer sequences). The Lean statement proves a(n) ∈
        ℤ when 1 ≤ b < 2a, which covers A317345 and A317343.
      lean: "OeisA317345.integer_coefficients"
      module: "FCPalomar.OeisA317345.Solution"
      status: "proved"
    - source: >-
        Periodic modulo 10: a(5*n+k) = [1,1,5,5,5](k) (mod 10), for n>=0 and k = 0..4
        (A317345, comments, conjecture).
      lean: "OeisA317345.a317345_mod_ten"
      module: "FCPalomar.OeisA317345.Solution"
      status: "proved"
    - source: >-
        Not stated in A317343. The analogous pattern a(5n + k) ≡ [1, 1, 3, 3, 5](k) (mod
        10) for its terms.
      lean: "OeisA317345.a317343_mod_ten"
      module: "FCPalomar.OeisA317345.Solution"
      status: "proved"
