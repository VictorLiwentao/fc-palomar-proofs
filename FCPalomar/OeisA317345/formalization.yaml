version: "v0.4"

project:
  name: "OEIS A317345: Hanna's mod-10 periodicity, with a general p-adic theorem"
  description: >-
    For natural numbers a, b let A(x) = Σ a(n)xⁿ/n! with A(0) = 1 satisfy [xⁿ] exp(n^a
    x)/A(x)^(n^b) = 0 for every n ≥ 1. The package proves that A exists and is unique;
    that for every prime p with 1 ≤ b < pa each a(n) is p-integral and a(n) ≡ a(n mod p)
    (mod p); and so that a(n) is an integer when 1 ≤ b < 2a. For OEIS A317345 (a = 3, b
    = 2) this gives Paul D. Hanna's 2018 conjecture a(5n + k) ≡ [1, 1, 5, 5, 5](k) (mod
    10), and for OEIS A317343 (a = 2, b = 1) the pattern [1, 1, 3, 3, 5]. In both cases
    Lean checks the residues of a(0), …, a(4) modulo 2 and 5 by kernel computation.
    Hanna's remark that log A(x) has integer coefficients is not proved here. Context:
    the known route to Hanna's claim is conditional. Bala's theorem (2017 note on OEIS
    A047974) gives a(n + k) ≡ a(n) (mod k) for every k when log A(x) has integer
    coefficients. Hanna observed that integrality numerically for A317345 and A317343,
    whose logarithms are A317346 and A317344, but it is unproved. The theorem here needs
    no such input. With 1 ≤ b < a it applies to exp(F) for every o.g.f. F in Hanna's
    family [x^n] exp(n^a x − n^b F(x)) = 0 (A317344, A317346, A317347, A319941–A319944,
    and the entries for a ≤ 8 that Hanna added in March 2026, such as A393854 and
    A393861). For each of them it gives integer e.g.f. coefficients and a(n) ≡ a(n mod
    p) (mod p) for every prime p.
  authors:
    - "Wentao Li"
  responsible_maintainers:
    - "Wentao Li"
  license: "Apache-2.0"

sources:
  - title: "OEIS A317345"
    authors:
      - "Paul D. Hanna"
    id: "https://oeis.org/A317345"
    type: "web discussion"
    location: "entry of July 26, 2018; the mod-10 comment was added on July 29, 2018 (revision 8)"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Defines A(x) by [xⁿ] exp(n³x)/A(x)^(n²) = 0 for n ≥ 1 and conjectures a(5n + k) ≡
      [1, 1, 5, 5, 5](k) (mod 10). Searches in November 2026 (the OEIS entries, arXiv,
      Zenodo, OpenWitness, GitHub issues, pull requests and code, and public Lean and
      OEIS-proof result repositories) found no earlier proof. The proof in this package
      is credited to Wentao Li.
  - title: "OEIS A317343"
    authors:
      - "Paul D. Hanna"
    id: "https://oeis.org/A317343"
    type: "web discussion"
    location: "entry of July 26, 2018, name line"
    relationship: "adapts"
    author_endorsement: "not-contacted"
    note: >-
      Defines the companion series by [xⁿ] exp(n²x)/A(x)^n = 0 for n ≥ 1. The entry
      states no congruence; the package adds the mod-10 pattern [1, 1, 3, 3, 5].
  - title: "Integer sequences that become periodic on reduction modulo k for all k"
    authors:
      - "Peter Bala"
    id: "https://oeis.org/A047974/a047974_1.pdf"
    type: "web discussion"
    location: "note linked from OEIS A047974 (December 3, 2017), Theorem 1"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Theorem 1 of the note: if A(x) = F(x)exp(xG(x)) with F, G ∈ ℤ[[x]] and G(0) = 1,
      then a(n + k) ≡ a(n) (mod k) for all n and k. If log A(x) had integer
      coefficients, as Hanna remarks in A317345 and A317343 (the logarithms are A317346
      and A317344), this would give the congruence for every k, and Hanna's mod-10 claim
      with k = 2 and 5. That integrality is unproved as far as the searches found. This
      package does not use the note.

