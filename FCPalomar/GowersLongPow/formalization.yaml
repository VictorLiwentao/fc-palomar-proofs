version: "v0.4"

project:
  name: "Gowers–Long: F(n) = n^α implies F(m) >= m^β eventually for β < α"
  description: >-
    Let F(n) be the maximal length of a 2-increasing sequence of triples in {1..n}^3. If
    F(n) = n^α for some n > 1, then F(m) >= m^β for every β < α and all large m
    (Gowers–Long, remark after Lemma 1.7).
  authors:
    - "Wentao Li"
  responsible_maintainers:
    - "Wentao Li"
  license: "Apache-2.0"

sources:
  - title: "The length of an s-increasing sequence of r-tuples"
    authors:
      - "W. T. Gowers"
      - "Jason Long"
    id: "arXiv:1609.08688"
    type: "paper"
    location: "Combin. Probab. Comput. 30 (2021) 686-721, remark after Lemma 1.7"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Supermultiplicativity F(ab) >= F(a)F(b) plus monotonicity give F(n^j) >= F(n)^j
      and the eventual bound.

related_formalizations:
  - title: "Formal Conjectures: FormalConjectures/Arxiv/1609.08688/sIncreasingrTuples.lean"
    authors:
      - "The Formal Conjectures Authors"
    id: "https://github.com/google-deepmind/formal-conjectures/blob/691719db2653905d5fa0775408370fb058e4c59f/FormalConjectures/Arxiv/1609.08688/sIncreasingrTuples.lean"
    relationship: "builds-on"
    note: >-
      The Challenge copies the statement and the definitions it uses verbatim from this
      file at commit 691719db. The upstream declaration is `sorry` at that commit.
  - title: "erdos-lean-formalization: proofs/triplespow/Solution.lean"
    authors:
      - "Daniel Puri"
    id: "https://github.com/danielpuri1901/erdos-lean-formalization/blob/c838d73/proofs/triplespow/Solution.lean"
    relationship: "adapts"
    note: >-
      The section 'Products of sequences' (supermultiplicativity) is adapted from this
      MIT-licensed proof; the MIT notice is kept in Solution.lean.

