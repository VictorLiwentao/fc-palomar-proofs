    The namespace Arxiv.«1609.08688» is renamed Arxiv1609_08688, because Palomar
    requires plain identifier components in declaration names. Otherwise none: the
    Challenge copies the Formal Conjectures statement and definitions verbatim; only the
    FormalConjecturesUtil import, attributes, test lemmas and docstrings are omitted.

