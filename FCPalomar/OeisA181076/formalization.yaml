automation:
  methods:
    - method: "agent"
      models:
        - "claude-opus-5-5"
      framework: "Claude Code"
      tool_setup: >-
        Claude Code (Anthropic) developed the proof, wrote the Lean formalization and
        prepared this package under the direction of Wentao Li, with independent agent
        review of the statement against its source. Wentao Li is the human author and
        maintainer.
  spend_usd: "not available"
  notes: >-
    AI assistance was material, including in developing the proof. The conjectures and
    the non-integrality notes are due to Paul D. Hanna. The integrality criterion is
    Dold's. The congruence [z^(pk)]U^(pn) ≡ [z^k]U^n, the pairing of the terms (pn, pk)
    and (n, k), and their use with Dold's criterion for the exponent k + 1 are from
    trureturing issues #22220–#22222 (filed in October 2026, closed on November 5,
    2026). trureturing's pull request #26761 (November 5, 2026) states the resulting
    criterion in Lean as integralGeneric: exp(Σ_n [Σ_k F(n,k)x^k] xⁿ/n) is integral when
    n | k·F(n,k) and p^(v_p(n)+1) | F(pn,pk) − F(n,k); trureturing later proved A181076,
    A181078, A181082 and A181084 from it in Lean (November 13, 2026), checking those
    congruences case by case. This package was developed without reading that code. Its
    criterion integral_of_criterion states conditions (E1) and (E2) on the exponent e
    that give those congruences for F = B(n,k)^e(n,k) and every U ∈ 1 + zℤ[[z]]. Each
    non-integrality note is settled by one exact coefficient, a(6) = 153254825495/2,
    19140157244799/2 and 45/2, computed in Lean; issue #22220 already reports a(6) =
    45/2 for A181070. As far as we found, A183128, A183129, the exponent conditions (E1)
    and (E2), and the obstruction at k = 1 (not_integral_of_exponent) are new. Wentao Li
    is the human author of this package's proof.

fidelity:
  divergences: >-
    Each OEIS sequence is the coefficient sequence of its g.f., stated as rational
    coefficients of subst L (exp ℚ) with an integrality claim. Inner sums over k = 0..n
    are written with an indicator k ≤ n. In the A183129 note the exponent k²+k−1 is
    computed in ℕ, so it is 0 at k = 0 where the source has −1; both give the term 1.
    The theorem numbers in the Challenge (Theorem 1, Corollary 2, Theorem 4) and its
    phrase 'the source states Theorem 1 for the bivariate series' refer to the authors'
    unpublished informal write-up (November 2026). It proves the criterion for A_e(x, y)
    = exp(Σ_{n≥1, k≥0} B(n,k)^(e(n,k)) xⁿ y^k/n), whose diagonal y = x is the series
    stated here; the bivariate series, its coefficient triangle and A_e(x, 1) are not
    formalized. The three notes are proved by computing a(6) exactly;
    not_integral_of_exponent is not used for them. It covers the exponents k and k², but
    its hypothesis that e agrees with a polynomial also at k = 0 excludes the ℕ-valued
    exponent k²+k−1. The statements were written for this package.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    Checks by AI agents only: a strict build with no warnings, an axiom check of the
    selected theorems, a check that the Challenge declarations appear verbatim in
