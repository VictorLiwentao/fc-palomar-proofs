    authors:
      - "Paul D. Hanna"
    id: "https://oeis.org/A181070"
    type: "web discussion"
    location: "entry of October 2, 2010, name line and comments"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Conjectures integrality for B = C(n,k), e = k+1 (proved in Lean in trureturing
      pull request #26761) and notes that e = k does not give an integer series; the
      package proves that note (a(6) = 45/2).
  - title: "Hanna binomial-power exponential integrality (issues #22220, #22221, #22222)"
    authors:
      - "The Omega Institute trureturing contributors"
    id: "https://github.com/the-omega-institute/trureturing/issues/22220"
    type: "web discussion"
    location: "issues filed in October 2026 and closed on November 5, 2026"
    relationship: "adapts"
    author_endorsement: "not-contacted"
    note: >-
      Proof outlines for the exponent k + 1 (A181070, A181074, A181080): the congruence
      [z^(pk)]U^(pn) ≡ [z^k]U^n and n | k[z^k]U^n for any U ∈ 1 + zℤ[[z]], the pairing
      of the terms (pn, pk) and (n, k), and Dold's criterion. The package's criterion
      extends this argument to general exponents. The issues also report a(6) = 45/2 for
      Hanna's A181070 note, name A181076, A181082 and A183128 as neighbours that keep
      their own conjectures, and mention A183129 as a neighbouring exponent.
  - title: "Fixed point indices of iterated maps"
    authors:
      - "Albrecht Dold"
    id: "https://doi.org/10.1007/BF01394243"
    type: "paper"
    location: "Invent. Math. 74 (1983), no. 3, 419–435"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      The integrality criterion for exp(Σ b(n)xⁿ/n) in terms of the congruences b(pM) ≡
      b(M) (mod p^(v_p(pM))).
  - title: "Enumerative Combinatorics, Volume 2"
    authors:
      - "Richard P. Stanley"
    type: "book"
    location: "Cambridge University Press, 1999, Exercise 5.2(a)"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      States the integrality criterion for exp(Σ b(n)xⁿ/n) used in the proof.
  - title: "Dold sequences, periodic points, and dynamics"
    authors:
      - "Jakub Byszewski"
      - "Grzegorz Graff"
      - "Thomas Ward"
    id: "https://doi.org/10.1112/blms.12531"
    type: "paper"
    location: "Bull. London Math. Soc. 53 (2021), 1263–1298; arXiv:2007.04031"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      A survey of the Dold congruences and their role in topology and in counting
      periodic points. It does not treat Hanna's series.
  - title: "Gauss congruences for rational functions in several variables"
    authors:
      - "Frits Beukers"
      - "Marc Houben"
      - "Armin Straub"
    id: "https://doi.org/10.4064/aa170614-13-7"
    type: "paper"
    location: "Acta Arith. 184 (2018), 341–362; arXiv:1710.00423"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Gives necessary and sufficient conditions for the Laurent coefficients of a
      multivariate rational function to satisfy the Gauss congruences. It does not treat
      Hanna's series.

