version: "v0.4"

project:
  name: "OEIS A183128, A183129 and four siblings: Hanna's binomial-power exponential conjectures, with his non-integrality notes"
  description: >-
    For U ∈ 1 + zℤ[[z]] put B(n,k) = [z^k] U(z)^n. Paul D. Hanna conjectured in 2010
    that exp(Σ_{n≥1} [Σ_k B(n,k)^(e(n,k)) x^k] xⁿ/n) has integer coefficients for six
    choices of U and e: B = C(n+k−1,k) with e = k²+1 (A183128), k²+k (A183129), n
    (A181076) and n+k−1 (A181078), and B = C(n,k) with e = n+k (A181082) and n+k+1
    (A181084). The package proves all six, and Hanna's notes that the exponents k² and
    k²+k−1 (in A183128, A183129) and k (in A181070, with B = C(n,k)) do not give integer
    series. The six conjectures follow from a general criterion on e, in the style of
    Dold's congruences along the rays (n,k) → (pn,pk), proved here for the diagonal
    series and any U; its corollaries cover constant exponents and polynomial exponents
    under a divisibility condition. A converse shows the non-integrality for a class of
    exponents. Integrality of exp(Σ c(n)xⁿ/n) is governed by Dold's congruences, which
    arise in topology and dynamics (see the survey of Byszewski, Graff and Ward, Bull.
    London Math. Soc. 53 (2021)). The congruence B(pn,pk) ≡ B(n,k) used here is a Gauss
    congruence for the coefficients of the rational function 1/(1 − yU(z)) when U is
    rational, in the sense studied by Beukers, Houben and Straub (Acta Arith. 184
    (2018)).
  authors:
    - "Wentao Li"
  responsible_maintainers:
    - "Wentao Li"
  license: "Apache-2.0"

sources:
  - title: "OEIS A183128"
    authors:
      - "Paul D. Hanna"
    id: "https://oeis.org/A183128"
    type: "web discussion"
    location: "entry of December 25, 2010, name line and comments"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      States the conjecture that the series with B = C(n+k−1,k) and e = k²+1 has integer
      coefficients, and notes that e = k² does not give an integer series. The entry
      gives no proof. Searches in November 2026 (the OEIS entries and their revision
      histories, arXiv, Zenodo, OpenWitness, GitHub issues, pull requests and code, and
      public Lean and OEIS-proof result repositories) found no proof of A183128 or
      A183129. The three non-integrality notes follow from one computed coefficient
      each; trureturing issue #22220 reports the A181070 coefficient a(6) = 45/2. The
      proof in this package is credited to Wentao Li.
