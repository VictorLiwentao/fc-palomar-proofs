version: "v0.4"

project:
  name: "OEIS A014442: each Pythagorean prime p is the largest prime factor of n^2+1 for exactly two n <= p (Kaltman's conjecture)"
  description: >-
    Every prime p ≡ 1 (mod 4) equals a(n), the largest prime factor of n^2+1, for
    exactly two n in [1, p], and two such distinct n below p add to p and multiply to 1
    mod p. Conjectured by Michael Kaltman, proved by Robert Israel (2015).
  authors:
    - "Wentao Li"
  responsible_maintainers:
    - "Wentao Li"
  license: "Apache-2.0"

sources:
  - title: "OEIS A014442"
    authors:
      - "Michael Kaltman"
      - "Robert Israel"
    id: "https://oeis.org/A014442"
    type: "web discussion"
    location: "comments (2015)"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Israel's proof: −1 has exactly two square roots modulo p.

related_formalizations: []

classification:
  arxiv:
    - "math.NT"
  msc2020:
    - "11A15"
    - "11A41"

status:
