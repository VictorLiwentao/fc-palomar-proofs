version: "v0.4"

project:
  name: "OEIS A002454: the odd-order permanent identity (She–Sun–Xia)"
  description: >-
    For every n and every primitive complex (2n+1)-th root of unity ζ, the permanent of
    the 2n × 2n matrix with entries 1 on the diagonal and (1 + ζ^(j−k))/(1 − ζ^(j−k))
    off it equals 4^n (n!)^2/(2n+1). Zhi-Wei Sun posed the identity in OEIS A002454
    (2022), and She, Sun and Xia proved it (arXiv:2208.12167, Theorem 1.3(ii)). The
    proof formalizes the determinant approach of Guo, Li, Tao and Wei.
  authors:
    - "Wentao Li"
  responsible_maintainers:
    - "Wentao Li"
  license: "Apache-2.0"

sources:
  - title: "A novel permanent identity with applications"
    authors:
      - "Yue-Feng She"
      - "Zhi-Wei Sun"
      - "Wei Xia"
    id: "arXiv:2208.12167"
    type: "paper"
    location: "Theorem 1.3(ii)"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      The odd-order permanent identity. Take m = 2n+1; translating both indices leaves j
      − k unchanged.
  - title: "The eigenvectors-eigenvalues identity and Sun's conjectures on determinants and permanents"
    authors:
      - "Xuejun Guo"
      - "Xin Li"
      - "Zhengyu Tao"
      - "Tao Wei"
    id: "arXiv:2206.02592"
    type: "paper"
    location: "equation (1.3)"
    relationship: "other"
    author_endorsement: "not-contacted"
    note: >-
      The proof follows this determinant calculation. Its Fourier eigenvalue identity is
      due to F. Calogero and A. M. Perelomov (Linear Algebra Appl. 25, 1979).
  - title: "OEIS A002454"
    authors:
      - "Zhi-Wei Sun"
    id: "https://oeis.org/A002454"
    type: "web discussion"
    location: "comment of June 26, 2022"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Poses the permanent identity.

