fidelity:
  divergences: >-
    The definition uses the name-line form A^(N+1) = 1/(1 − z)·(BINOMIAL(BINOMIAL(A)))^N
    with only A(0) = 1 assumed. The equation forces a(1) = 2N + 1, which matches the
    data and A145901's A(k, z) = exp(Σ R(n, k)zⁿ/n). The comment in A258377 writes the
    form 1 + N·z + ⋯, which fits neither. 'Period 2^(k−1)' is read as least period
    exactly 2^(k−1), and 'period length a divisor of 2^(k−1)' as the least period
    dividing 2^(k−1), with Function.minimalPeriod. The statements are proved for every
    natural number N, which includes the five entries. Bala's comments allow any integer
    N; negative N is not formalized. His remarks on residues modulo 3 and 5 are not
    formalized. The statements were written for this package from the OEIS entries and
    are proposed for Formal Conjectures as FormalConjectures/OEIS/258377.lean, which
    does not exist upstream yet.

