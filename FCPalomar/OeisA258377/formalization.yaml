  - title: "OEIS A258381"
    authors:
      - "Peter Bala"
    id: "https://oeis.org/A258381"
    type: "web discussion"
    location: "entry of May 28, 2015; comments of December 6, 2017"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      N = 5: a(n) is odd, and a(n) mod 2^k has period 2^(k−1); worked examples modulo 4
      and 8. His mod-5 example is not formalized.
  - title: "OEIS A145901"
    authors:
      - "Peter Bala"
    id: "https://oeis.org/A145901"
    type: "web discussion"
    location: "formula section: Peter Bala, May 28, 2015 and January 12, 2018"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Bala's formulas for the type-B triangle. The formula of May 28, 2015 states,
      without proof, that A(k, z) = exp(Σ R(n, k)zⁿ/n) has integer coefficients and
      satisfies the type-B equation for every integer k. With the logarithmic-derivative
      formulas in A258377's comments, the formula of January 12, 2018, R(n, x) = Σ C(n,
      k)2^k F(k, x), implies the identity A_N(z) = (1 − z)^(−1)·B_N(2z/(1 − z)). Here
      B_N is Hanna's type-A series, B^(N+1) = BINOMIAL(B)^N with B(0) = 1. The Solution
      proves this identity directly and uses it for the 2-adic theorems.

