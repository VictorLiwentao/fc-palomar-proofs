    type: "web discussion"
    location: "entry of May 28, 2015; comments of December 6, 2017"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Defines the case N = 1. Bala's comments of December 6, 2017 observe that a(n) is
      always odd and that a(n) mod 2^k is purely periodic with period 2^(k−1), with
      worked examples modulo 4 and 8. Searches in November 2026 (the OEIS entries,
      arXiv, Zenodo, OpenWitness, GitHub issues, pull requests and code, and public Lean
      and OEIS-proof result repositories) found no earlier proof. The proof in this
