alignment:
  namespace: "OeisA258377"
  statements:
    - source: >-
        A^(N+1)(z) = 1/(1 - z) * ( BINOMIAL(BINOMIAL(A(z))) )^N; equivalently A^(N+1)(z)
        = 1/(1 - z)* 1/(1 - 2*z)^N*A^N(z/(1 - 2*z)), where BINOMIAL(F(z)) = 1/(1 -
        z)*F(z/(1 - z)) is the binomial transform (A258377, comments). The Lean
        statement says that the two forms agree for every A with A(0) = 1.
      lean: "OeisA258377.isSolution_iff"
      module: "FCPalomar.OeisA258377.Solution"
      status: "proved"
    - source: >-
        For a fixed integer k, the expansion of the function A(k,z) := exp( Sum_{n >= 1}
        R(n,k)*z^n/n ) has integer coefficients and satisfies the functional equation
        A(k,z)^(k + 1) = 1/(1 - z)*( BINOMIAL(BINOMIAL(A(k,z))) )^k (A145901, Peter
        Bala, May 28 2015). The Lean statement says that for every natural number N
        exactly one A with A(0) = 1 satisfies the equation. Only A(0) = 1 is assumed:
        the equation forces a(1) = 2N + 1, as in the data.
      lean: "OeisA258377.existsUnique"
      module: "FCPalomar.OeisA258377.Solution"
      status: "proved"
    - source: >-
        The expansion of A(k,z) has integer coefficients (A145901, Peter Bala, May 28
        2015). The Lean statement says that the coefficients of the solution are
        integers, for every natural number N.
      lean: "OeisA258377.exists_int_coeff"
      module: "FCPalomar.OeisA258377.Solution"
      status: "proved"
    - source: >-
        a(n) appears to be always odd (A258377, A258379 and A258381, Peter Bala, Dec 06
        2017). The Lean statement is for every natural number N.
      lean: "OeisA258377.odd"
      module: "FCPalomar.OeisA258377.Solution"
      status: "proved"
    - source: >-
        Calculation suggests that for k = 1,2,3,..., the sequence a(n) (mod 2^k) is
        purely periodic with period length a divisor of 2^(k-1) (A258378, A258379 and
        A258380, Peter Bala, Dec 06 2017). The Lean statement gives a(n + 2^(k-1)) ≡
        a(n) (mod 2^k) for all n ≥ 0 and every natural number N.
      lean: "OeisA258377.periodic"
      module: "FCPalomar.OeisA258377.Solution"
      status: "proved"
    - source: >-
        Calculation suggests that for k = 1,2,3,..., the sequence a(n) (mod 2^k) is
        purely periodic with period length a divisor of 2^(k-1) (A258378, A258379 and
        A258380, Peter Bala, Dec 06 2017). The Lean statement is for every natural
        number N; the period is the least period.
      lean: "OeisA258377.leastPeriodMod_dvd"
      module: "FCPalomar.OeisA258377.Solution"
      status: "proved"
    - source: >-
        Not in the sources. For k ≥ 3 and all n ≥ 0, a(n + 2^(k-2)) - a(n) ≡
        2^(k-2)·3N(N+1) (mod 2^k).
      lean: "OeisA258377.shift_sub"
      module: "FCPalomar.OeisA258377.Solution"
      status: "proved"
    - source: >-
        Not in the sources. For k ≥ 3, the least period of a(n) mod 2^k is exactly
        2^(k-1) if and only if N ≡ 1 or 2 (mod 4). It decides between Bala's 'period
        2^(k-1)' (A258377, A258381) and 'period length a divisor of 2^(k-1)'
        (A258378–A258380).
      lean: "OeisA258377.leastPeriodMod_eq_iff"
      module: "FCPalomar.OeisA258377.Solution"
      status: "proved"
    - source: >-
        a(n) appears to be always odd. Calculation suggests that for k = 1,2,3,..., the
