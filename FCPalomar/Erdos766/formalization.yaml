version: "v0.4"

project:
  name: "Erdős Problem 766: the Dirac–Erdős bound"
  description: >-
    Every graph on n vertices with floor(n^2/4)+1 edges contains, for each 3 <= k <= n,
    a subgraph on k vertices with floor(k^2/4)+1 edges (Dirac; Erdős, independently).
  authors:
    - "Wentao Li"
  responsible_maintainers:
    - "Wentao Li"
  license: "Apache-2.0"

sources:
  - title: "Extremal problems in graph theory"
    authors:
      - "Paul Erdős"
    id: "Theory of Graphs and its Applications (Smolenice 1963), 1964, 29-36"
    type: "paper"
    location: "p. 34"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      The vertex-deletion averaging argument: removing a suitable vertex keeps the edge
      density above the Turán threshold.
  - title: "Erdős Problem 766"
    authors:
      - "Thomas Bloom"
    id: "https://www.erdosproblems.com/766"
    type: "web discussion"
    location: "Problem 766"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Records the Dirac–Erdős bound.

related_formalizations:
  - title: "Formal Conjectures: FormalConjectures/ErdosProblems/766.lean"
    authors:
      - "The Formal Conjectures Authors"
    id: "https://github.com/google-deepmind/formal-conjectures/blob/691719db2653905d5fa0775408370fb058e4c59f/FormalConjectures/ErdosProblems/766.lean"
    relationship: "builds-on"
    note: >-
      The Challenge copies the statement and the definitions it uses verbatim from this
      file at commit 691719db. The upstream declaration is `sorry` at that commit.

classification:
  arxiv:
    - "math.CO"
  msc2020:
    - "05C35"

status:
  scope: >-
    The selected theorem is erdos_766.variants.dirac_erdos with forcingNumber copied
    verbatim.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "Erdos766.erdos_766.variants.dirac_erdos"
      file: "FCPalomar/Erdos766/Solution.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      comparator_config: "FCPalomar/Erdos766/comparator.json"

automation:
  methods:
    - method: "agent"
      models:
        - "claude-opus-5-5"
      framework: "Claude Code"
      tool_setup: >-
        Claude Code (Anthropic) wrote the Lean proof and this package under the
        direction of Wentao Li, with independent agent review of the statement against
        its source. Wentao Li is the human author and maintainer.
  spend_usd: "not available"
  notes: >-
    AI assistance was material. The mathematics is credited to the original authors
    listed under sources.

fidelity:
  divergences: >-
    None. The Challenge copies the Formal Conjectures statement and definitions
    verbatim; only the FormalConjecturesUtil import, attributes, test lemmas and
    docstrings are omitted.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    Agent checks only: strict build with no warnings, axiom check of the selected
    theorems, verbatim comparison of the copied definitions and statement, and an
    independent agent review of source fidelity. No human review beyond Wentao Li is
    claimed.

alignment:
  namespace: "Erdos766"
  statements:
    - source: >-
        For 3 <= k <= n, forcingNumber n k (floor(k^2/4)+1) <= floor(n^2/4)+1.
      lean: "Erdos766.erdos_766.variants.dirac_erdos"
      module: "FCPalomar.Erdos766.Solution"
      status: "proved"
