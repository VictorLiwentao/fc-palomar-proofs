version: "v0.4"

project:
  name: "OEIS A395839: parity and residues mod 3 of 10C(x)^2 − C(x) (Hanna's conjectures)"
  description: >-
    For the g.f. 10C(x)^2 − C(x) with C the Catalan g.f., a(n) is odd iff n = 2^k − 1,
    and a(3n+1) ≡ C_n, a(3n) ≡ a(3n+2) ≡ 0 (mod 3). Conjectured by Paul D. Hanna (2026).
  authors:
    - "Wentao Li"
  responsible_maintainers:
    - "Wentao Li"
  license: "Apache-2.0"

sources:
  - title: "OEIS A395839"
    authors:
      - "Paul D. Hanna"
    id: "https://oeis.org/A395839"
    type: "web discussion"
    location: "two conjectures (2026)"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      States the parity and mod-3 conjectures.
  - title: "Congruences for Catalan and Motzkin numbers and related sequences"
    authors:
      - "Emeric Deutsch"
      - "Bruce E. Sagan"
    id: "arXiv:math/0407326"
    type: "paper"
    location: "J. Number Theory 117 (2006), Theorem 2.1"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      The 2-adic valuation of Catalan numbers gives the parity clause directly.

