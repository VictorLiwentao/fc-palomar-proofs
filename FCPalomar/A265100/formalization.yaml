      models:
        - "claude-opus-5-5"
      framework: "Claude Code"
      tool_setup: >-
        Claude Code (Anthropic) wrote the Lean proof and this package under the
        direction of Wentao Li, with independent agent review of the statement against
        its source. Wentao Li is the human author and maintainer.
  spend_usd: "not available"
  notes: >-
    AI assistance was material. The mathematics is credited to the original authors
    listed under sources.

fidelity:
  divergences: >-
    None. The statement is new: it was written for this package from the source and is
    proposed for Formal Conjectures as FormalConjectures/OEIS/265100.lean with the same
    declarations. The Challenge leaves out only the FormalConjecturesUtil import,
    attributes, test lemmas and unrelated declarations of that file.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    Checks by AI agents only: a strict build with no warnings, an axiom check of the
    selected theorems, a check that the Challenge declarations appear verbatim in
    Solution, and a review of the statement against its source by a separate agent. No
    independent human review is claimed.

alignment:
  namespace: "OeisA265100"
  statements:
    - source: >-
        Conjecture 5: C(n) ≡ 0 (mod 3) iff the base-3 representations of n and n + 1
        both contain at least one 2.
      lean: "OeisA265100.conjecture5"
      module: "FCPalomar.A265100.Solution"
      status: "proved"
    - source: >-
        Conjecture 1: the sequence contains all block numbers, that is, all n with C(n)
        ≡ 0 and C(n − 1) ≢ 0 (mod 3).
      lean: "OeisA265100.conjecture1"
      module: "FCPalomar.A265100.Solution"
      status: "proved"
    - source: >-
        Conjecture 2: if m is a block number, then 3m − 1 is a block number.
      lean: "OeisA265100.conjecture2"
      module: "FCPalomar.A265100.Solution"
      status: "proved"
    - source: >-
        Conjecture 3: if C(n) ≡ 0 (mod 3), then C(3n − 1) ≡ 0 (mod 3).
      lean: "OeisA265100.conjecture3"
      module: "FCPalomar.A265100.Solution"
      status: "proved"
