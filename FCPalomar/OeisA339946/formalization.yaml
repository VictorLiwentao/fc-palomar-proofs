  namespace: "OeisA339946"
  statements:
    - source: >-
        For m a positive integer, define a_m(n) = [x^(m*n)] 1/Legendre_P(n,(1 - x)/(1 +
        x)). We conjecture that the supercongruence a_m(p) == a_m(1) ( mod p^5 ) holds
        for all primes p >= 7 (Peter Bala, Mar 10 2022).
      lean: "OeisA339946.am_congr"
      module: "FCPalomar.OeisA339946.Solution"
      status: "proved"
    - source: >-
        Calculation suggests that, for the present sequence, we have stronger
        congruences for prime p >= 7, namely a(p) == a(1) ( mod p^5 ) (A339946, Dec 23
        2020).
      lean: "OeisA339946.a339946_congr"
      module: "FCPalomar.OeisA339946.Solution"
      status: "proved"
    - source: >-
        Conjecture 2: the supercongruence a(p-1) == 1 - 2*p - p^2 (mod p^3) holds for
        all primes except p = 3 (A361717, Mar 26 2023).
      lean: "OeisA339946.a361717_conj2"
      module: "FCPalomar.OeisA339946.Solution"
      status: "proved"
    - source: >-
        Not in the source. a_m(5) ≡ 2 + 625m² (mod 5^5) for every m ≥ 1.
      lean: "OeisA339946.am_five"
      module: "FCPalomar.OeisA339946.Solution"
      status: "proved"
    - source: >-
        Not in the source. a_m(5) ≡ a_m(1) (mod 5^5) exactly when 5 divides m, so p ≥ 7
        is the optimal uniform range.
      lean: "OeisA339946.am_five_congr_iff"
      module: "FCPalomar.OeisA339946.Solution"
      status: "proved"
