automation:
  methods:
    - method: "agent"
      models:
        - "claude-opus-5-5"
      framework: "Claude Code"
      tool_setup: >-
        Claude Code (Anthropic) developed the proof, wrote the Lean formalization and
        prepared this package under the direction of Wentao Li, with independent agent
        review of the proof and of the statement against its source. Wentao Li is the
        human author and maintainer.
  spend_usd: "not available"
  notes: >-
    AI assistance was material, including in developing the proof. The conjectures are
    due to Peter Bala (OEIS A339946 and A361717). For A339946, Rodrigues' formula gives
    1/P_n((1−x)/(1+x)) = (1+x)^n/Q_n(−x) with Q_n(x) = Σ_k C(n,k)² x^k. For odd p,
    1/Q_p(−x) is expanded modulo p^5; at multiples of p the first-order term vanishes by
    the symmetry Σ_k (−1)^k C(p,k)³ = 0, and the second-order term by Σ_{0<k<p} k^(−4) ≡
    0 (mod p) for p ≥ 7. At p = 5 that sum is −1, which gives a_m(5) ≡ 2 + 625m² (mod
    5^5). For A361717 the tools are Wolstenholme-type congruences for harmonic sums
    modulo p^3. The Solution proves these steps, and its module docstring gives the full
    account. Wentao Li is the human author of this package's proof.

fidelity:
  divergences: >-
    The Legendre polynomial is P_n(t) = P̃_n((1−t)/2), where P̃_n is Mathlib's
    shiftedLegendre n; the Solution checks P_1 = t and P_2 = (3t² − 1)/2. P_n is
    evaluated at the power series (1−x)/(1+x) and inverted in ℚ[[x]]; the constant term
    is P_n(1) = 1. The values a_m(n) are therefore rationals by definition, and a
    congruence u ≡ v (mod p^5) is stated as u − v = p^5 z for an integer z; the Solution
    also proves that every a_m(n) is an integer. a339946 is defined for every n, while
    the entry has offset 1. The statements at p = 5 are added. The statements were
    written for this package from the OEIS entries and are proposed for Formal
    Conjectures as FormalConjectures/OEIS/339946.lean (and
    FormalConjectures/OEIS/361717.lean for A361717), which do not exist upstream yet.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    Checks by AI agents only: a strict build with no warnings, an axiom check of the
    selected theorems, a check that the Challenge declarations appear verbatim in
    Solution, and a review of the statement against its source by a separate agent. No
    independent human review is claimed.

