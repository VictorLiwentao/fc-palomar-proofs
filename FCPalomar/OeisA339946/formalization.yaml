version: "v0.4"

project:
  name: "OEIS A339946 and A361717: Bala's prime-level supercongruences"
  description: >-
    Let a_m(n) = [x^(mn)] 1/P_n((1−x)/(1+x)), where P_n is the Legendre polynomial; OEIS
    A339946 is the case m = 1. The package proves Peter Bala's 2022 conjecture that
    a_m(p) ≡ a_m(1) = 2 (mod p^5) for every m ≥ 1 and every prime p ≥ 7, and with it his
    2020 conjecture a(p) ≡ a(1) (mod p^5) for A339946. It shows that the range p ≥ 7 is
    optimal: a_m(5) ≡ 2 + 625m² (mod 5^5), so the congruence at p = 5 holds exactly when
    5 divides m. It also proves Bala's Conjecture 2 for OEIS A361717: Σ_{k=0}^{p−2}
    C(p−2, k)² C(p−1+k, k) ≡ 1 − 2p − p² (mod p³) for every prime p ≠ 3. Bala's entry
    lists A103882 and the Apéry numbers A005258 and A005259 as coefficients of similar
    Legendre-polynomial expressions that satisfy supercongruences u(np^k) ≡ u(np^(k−1))
    (mod p^(3k)), and it presents a(p) ≡ a(1) (mod p^5) as a stronger congruence.
    A361717 is of the same type: A005258(n) = [x^n] (1−x)^(−1) P_n((1+x)/(1−x)) and
    A361717(n+1) = [x^n] (1−x)^(−2) P_n((1+x)/(1−x)) (Bala, December 2020 and August
    2026). Supercongruences of Apéry-like sequences are a research topic; see Straub
    (Algebra & Number Theory, 2014) and the references there.
  authors:
    - "Wentao Li"
  responsible_maintainers:
    - "Wentao Li"
  license: "Apache-2.0"

sources:
  - title: "OEIS A339946"
    authors:
      - "Peter Bala"
    id: "https://oeis.org/A339946"
    type: "web discussion"
    location: "entry of December 23, 2020 (a(p) ≡ a(1) mod p^5 for p ≥ 7), and comment of March 10, 2022 (a_m for every m ≥ 1)"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Bala conjectures a_m(p) ≡ a_m(1) (mod p^5) for all primes p ≥ 7. The entry records
      Robert Israel's check of a(p) ≡ 2 (mod p^5) for 7 ≤ p ≤ 401 and no proof. Its
      other conjecture, a(np^k) ≡ a(np^(k−1)) (mod p^(3k)) for p ≥ 5, is not part of
      this package. Searches in November 2026 (the OEIS entries, arXiv, Zenodo,
      OpenWitness, GitHub issues, pull requests and code, and public Lean and OEIS-proof
      result repositories) found no earlier proof. A zbMATH Open search on November 15,
      2026 found no record of either entry; MathSciNet was not searched. The proof in
      this package is credited to Wentao Li.
  - title: "OEIS A361717"
    authors:
      - "Peter Bala"
    id: "https://oeis.org/A361717"
    type: "web discussion"
    location: "entry of March 26, 2023, Conjecture 2"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Conjecture 2: a(p−1) ≡ 1 − 2p − p² (mod p³) for all primes p ≠ 3, checked to p =
      199. No earlier proof was found. Conjecture 1 of the entry, a(p) ≡ 0 (mod p^4) for
      p ≥ 5, is not part of this package. The proof in this package is credited to
      Wentao Li.
  - title: "Multivariate Apéry numbers and supercongruences of rational functions"
    authors:
      - "Armin Straub"
    id: "https://doi.org/10.2140/ant.2014.8.1985"
    type: "paper"
    location: "Algebra & Number Theory 8 (2014), no. 8, 1985–2008; arXiv:1401.0854; Introduction"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      States the supercongruences A(p^r m) ≡ A(p^(r−1) m) (mod p^(3r)) of the Apéry
      numbers for p ≥ 5 and says that similar congruences are conjectured for all Apéry-
      like sequences. It does not treat A339946 or A361717.
  - title: "Prime-power congruences for odd-exponent binomial sums (TheSil/A357513_conjecture)"
    authors:
      - "Ondrej Kutal"
    id: "https://github.com/TheSil/A357513_conjecture"
    type: "other"
    location: "README.md and proof.tex, July 2026; linked from OEIS A357513"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      A proof, with a Lean formalization, of the generalized A357513 conjecture: p^4
      divides the numerator of Σ_{k=1}^{p−1} k^(−2m−1) C(p−1, k)² C(p−1+k, k)² except at
      an explicit set of primes. It reduces the binomial products to harmonic sums
      modulo p^4; the Solution's A357511 lemma does the same, and its A361717 proof does
      so modulo p^3. Its case m = 0 is the A357511 congruence, which the Solution re-
      proves as an unselected lemma. It does not treat A339946 or A361717.
  - title: "An Explicit Eventual p4-Divisibility Theorem for an Apéry-Type Numerator Family"
    authors:
      - "Zhipeng Chen"
      - "Qisheng Wang"
      - "Yan Feng"
    id: "https://doi.org/10.3390/math14152832"
    type: "paper"
    location: "Mathematics 14 (2026), article 2832"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Proves the A357513 family for p > 2m + 6, with a supplementary Lean package; for m
      = 0 this is the A357511 congruence that the Solution re-proves as an unselected
      lemma. It does not treat A339946 or A361717.

