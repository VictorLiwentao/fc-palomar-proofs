version: "v0.4"

project:
  name: "OEIS A318008: the parity of the compositional square root (Hanna's conjecture)"
  description: >-
    The o.g.f. A(x) of OEIS A318008 satisfies A(A(x − x²)) = x + x². The package proves
    that exactly one A ∈ ℚ[[x]] with A(0) = 0 does, that every coefficient a(n) is an
    integer, and that a(n) is odd if and only if n = 2^k − 1 or n = 2^(k+1) − 2 for some
    k ≥ 1, as conjectured by Paul D. Hanna (2018). It also proves the companion facts
    for OEIS A277292: its series is unique and odd, its coefficients are the odd-indexed
    a(n), and they are odd exactly at the powers of 2.
  authors:
    - "Wentao Li"
  responsible_maintainers:
    - "Wentao Li"
  license: "Apache-2.0"

sources:
  - title: "OEIS A318008"
    authors:
      - "Paul D. Hanna"
    id: "https://oeis.org/A318008"
    type: "web discussion"
    location: "entry of September 6, 2018; parity conjecture in the comments (added September 7, 2018)"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Defines A(x) by A(A(x − x²)) = x + x² and conjectures that a(2^k − 1) and
      a(2^(k+1) − 2) are odd for k ≥ 1 and that a(n) is even elsewhere. An earlier proof
      by the same route was posted on OpenWitness on October 25, 2026 (see below).
      Searches in November 2026 (the OEIS entry and its revision history, arXiv, Zenodo,
      OpenWitness, GitHub issues and code, and public Lean result repositories) found no
      other proof.
  - title: "OEIS A277292"
    authors:
      - "Paul D. Hanna"
    id: "https://oeis.org/A277292"
    type: "web discussion"
    location: "entry of October 12, 2016, name line"
    relationship: "adapts"
    author_endorsement: "not-contacted"
    note: >-
      Defines the series G(x) by Series_Reversion(G + G²) = G − G². The entry states no
      parity claim; the package adds one, proved by the same argument.
  - title: "Fourteen open OEIS parity conjectures proved where the mod-2 reduction is degenerate"
    authors:
      - "hilbert-clavius"
    id: "https://www.openwitness.net/p/10125"
    type: "web discussion"
    location: "post of October 25, 2026, item 6"
    relationship: "independently-proves"
    author_endorsement: "not-contacted"
    note: >-
      An AI-agent post that proves the A318008 parity pattern by the same route: the odd
      part O = φ⁻¹∘A with O∘φ∘O = C, the odd pivot n + 2, and the solution Σ x^(2^k − 1)
      over GF(2). It is a hand proof, checked numerically and not machine-checked;
      integrality is only implicit, and A277292 is not mentioned. The proof in this
      package was found independently.

