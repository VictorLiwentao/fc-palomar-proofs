automation:
  methods:
    - method: "agent"
      models:
        - "claude-opus-5-5"
      framework: "Claude Code"
      tool_setup: >-
        Claude Code (Anthropic) developed the proof, wrote the Lean formalization and
        prepared this package under the direction of Wentao Li, with independent agent
        review of the statement against its source. Wentao Li is the human author and
        maintainer.
  spend_usd: "not available"
  notes: >-
    AI assistance was material, including in developing the proof. The conjecture is due
    to Paul D. Hanna (OEIS A318008). An earlier proof by the same route was posted on
    OpenWitness on October 25, 2026; the proof here was found independently. This
    package adds a machine-checked proof, the integrality of every coefficient, the
    forced value a(1) = 1, and the A277292 statements. Wentao Li is its human author.

fidelity:
  divergences: >-
    The parity theorem also states that every a(n) is an integer, which the source takes
    for granted. The A277292 equation Series_Reversion(G + G²) = G − G² is stated one-
    sided, as (G + G²)∘(G − G²) = x with G(0) = 0; this is equivalent, because the
    equation forces a unit linear coefficient, so a one-sided compositional inverse is
    two-sided. The A277292 parity statement is not in that entry. The statements were
    written for this package and are proposed for Formal Conjectures as
    FormalConjectures/OEIS/318008.lean with the same declarations. The Challenge leaves
    out only the FormalConjecturesUtil import, attributes, test lemmas and unrelated
    declarations of that file.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    Checks by AI agents only: a strict build with no warnings, an axiom check of the
    selected theorems, a check that the Challenge declarations appear verbatim in
    Solution, and a review of the statement against its source by a separate agent. No
    independent human review is claimed.

alignment:
  namespace: "OeisA318008"
  statements:
    - source: >-
        A318008: the g.f. A(x) satisfies A(A(x − x²)) = x + x² (name line). The Lean
        statement says that exactly one power series over ℚ with A(0) = 0 does; a(1) = 1
        is derived, not assumed.
      lean: "OeisA318008.exists_unique_solution"
      module: "FCPalomar.OeisA318008.Solution"
      status: "proved"
    - source: >-
        a(2^k-1) = 1 (mod 2) and a(2^(k+1)-2) = 1 (mod 2) for k >= 1, and a(n) is even
        elsewhere (conjecture, comments). The Lean statement also includes the
        integrality of a(n).
      lean: "OeisA318008.parity_conjecture"
      module: "FCPalomar.OeisA318008.Solution"
      status: "proved"
    - source: >-
        A277292: the g.f. G(x) satisfies Series_Reversion(G(x) + G(x)^2) = G(x) − G(x)^2
        (name line), read as (G + G²)∘(G − G²) = x with G(0) = 0. The Lean statement
        says that exactly one power series over ℚ does.
      lean: "OeisA318008.a277292_existsUnique"
      module: "FCPalomar.OeisA318008.Solution"
      status: "proved"
    - source: >-
        G(x) = Sum_{n>=1} a(n) x^(2n−1) (formula section): the even coefficients of G
        vanish.
      lean: "OeisA318008.a277292_odd"
      module: "FCPalomar.OeisA318008.Solution"
      status: "proved"
    - source: >-
        a(2n−1) = A277292(n) (A318008, comments).
      lean: "OeisA318008.a318008_odd_bisection"
      module: "FCPalomar.OeisA318008.Solution"
      status: "proved"
    - source: >-
        Not stated in A277292. Every A277292(n) is an integer, and it is odd if and only
        if n is a power of 2.
      lean: "OeisA318008.a277292_parity"
      module: "FCPalomar.OeisA318008.Solution"
      status: "proved"
