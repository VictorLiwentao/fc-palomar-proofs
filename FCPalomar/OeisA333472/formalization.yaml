automation:
  methods:
    - method: "agent"
      models:
        - "claude-opus-5-5"
      framework: "Claude Code"
      tool_setup: >-
        Claude Code (Anthropic) developed the proof, wrote the Lean formalization and
        prepared this package under the direction of Wentao Li, with independent agent
        review of the statement against its source. Wentao Li is the human author and
        maintainer.
  spend_usd: "not available"
  notes: >-
    AI assistance was material, including in developing the proof. The conjectures are
    due to Peter Bala (OEIS A333472). The methods are Lagrange inversion and the
    exponential and Cartier extraction of Dwork-type congruences, as in Blanco Gómez's
    Theorem A, which the research lane had read. For v_p(r) ≤ v_p(s), and so for A333472
    itself, the result also follows from Pan and Sun's theorem through that transfer
    theorem. The cases v_p(r) > v_p(s) and the single direct proof are new as far as the
    searches found. Wentao Li is the human author of this package's proof.

fidelity:
  divergences: >-
    Both theorems state Bala's conjectures as written. The congruence is stated as
    divisibility of the difference by p^(2k) in ℤ. For s < 0, F^m is the power of the
    inverse series of F, which exists because F(0) = 1. The statements were written for
    this package from the OEIS entry and are proposed for Formal Conjectures as
    FormalConjectures/OEIS/333472.lean, which does not exist upstream yet.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    Checks by AI agents only: a strict build with no warnings, an axiom check of the
    selected theorems, a check that the Challenge declarations appear verbatim in
    Solution, and a review of the statement against its source by a separate agent. No
    independent human review is claimed.

alignment:
  namespace: "OeisA333472"
  statements:
    - source: >-
        More generally, we conjecture that for any positive integer r and any integer s
        the sequence a(r,s;n) := [x^(r*n)] ( c(x/(1 + x)) )^(s*n) also satisfies the
        above congruences, a(n*p^k) == a(n*p^(k-1)) ( mod p^(2*k) ) for prime p >= 5 and
        positive integers n and k (A333472, comments).
      lean: "OeisA333472.a_tower"
      module: "FCPalomar.OeisA333472.Solution"
      status: "proved"
    - source: >-
        a(n) = [x^n] ( c(x/(1 + x)) )^n satisfies the supercongruences a(n*p^k) ==
