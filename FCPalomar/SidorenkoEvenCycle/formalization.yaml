version: "v0.4"

project:
  name: "Sidorenko's inequality for even cycles"
  description: >-
    For every k >= 2 and every finite graph G on a nonempty vertex set, t(K_2, G)^{2k}
    <= t(C_{2k}, G): even cycles have Sidorenko's property (Sidorenko 1993). The Lean
    proof avoids eigenvalues; it uses Cauchy–Schwarz and log-convexity of the walk
    counts ||A^j 1||^2.
  authors:
    - "Wentao Li"
  responsible_maintainers:
    - "Wentao Li"
  license: "Apache-2.0"

sources:
  - title: "A correlation inequality for bipartite graphs"
    authors:
      - "Alexander Sidorenko"
    id: "doi:10.1007/BF02988307"
    type: "paper"
    location: "Graphs Combin. 9 (1993) 201-204"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      States the conjecture and proves it for several families, including even cycles.
      The usual proof is spectral: hom(C_{2k}, G) = tr A^{2k} >= λ_max^{2k} >=
      (2m/n)^{2k}. The Lean proof replaces the eigenvalue bound by Cauchy–Schwarz and
      log-convexity of ||A^j 1||^2.
  - title: "Inequalities for functionals generated by bipartite graphs"
    authors:
      - "Alexander Sidorenko"
    id: "Diskret. Mat. 3 (1991) 50-65; Discrete Math. Appl. 2 (1992) 489-504"
    type: "paper"
    location: "Discrete Math. Appl. 2 (1992) 489-504"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      The earlier paper on the same functionals.

related_formalizations:
  - title: "Formal Conjectures: FormalConjectures/Wikipedia/SidorenkoConjecture.lean"
    authors:
      - "The Formal Conjectures Authors"
    id: "https://github.com/google-deepmind/formal-conjectures/blob/691719db2653905d5fa0775408370fb058e4c59f/FormalConjectures/Wikipedia/SidorenkoConjecture.lean"
    relationship: "builds-on"
    note: >-
      The Challenge copies the statement and the definitions it uses verbatim from this
      file at commit 691719db. The upstream declaration is `sorry` at that commit.
  - title: "Formal Conjectures: FormalConjecturesForMathlib/Combinatorics/SimpleGraph/HomDensity.lean"
    authors:
      - "The Formal Conjectures Authors"
    id: "https://github.com/google-deepmind/formal-conjectures/blob/691719db2653905d5fa0775408370fb058e4c59f/FormalConjecturesForMathlib/Combinatorics/SimpleGraph/HomDensity.lean"
    relationship: "builds-on"
    note: >-
      The Challenge copies the definitions homCount and homDensity verbatim from this
      file at commit 691719db.

