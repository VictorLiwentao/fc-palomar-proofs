automation:
  methods:
    - method: "agent"
      models:
        - "claude-opus-5-5"
      framework: "Claude Code"
      tool_setup: >-
        Claude Code (Anthropic) developed the proof, wrote the Lean formalization and
        prepared this package under the direction of Wentao Li, with independent agent
        review of the statement against its source. Wentao Li is the human author and
        maintainer.
  spend_usd: "not available"
  notes: >-
    AI assistance was material, including in developing the proof. The conjectures are
    due to Paul D. Hanna. The integrality criterion is Dold's. An independent Lean proof
    of Hanna's conjecture for q > 1, by the same route, was merged in trureturing on
    November 14, 2026 (pull request #30261). The cases q ≤ 0, the sharp form and the
    general exponent theorem are not in that proof, and the searches found them nowhere
    else. Wentao Li is the human author of this package's proof.

fidelity:
  divergences: >-
    OeisA181316.conjecture states Hanna's A181316 conjecture as written, and
    a181316_integral and a180606_integral state the name lines of A181316 and A180606.
    The other theorems go beyond the sources: hannaSeries_integral allows every integer
    q ≠ 1; integral_iff and integral_iff_of_exponent add other multipliers c, other
    exponents and the converse; a155206_integral excludes m = 1, where Hanna's
    expression is 0/0. The statements were written for this package from the OEIS
    entries. They are proposed for Formal Conjectures as
    FormalConjectures/OEIS/181316.lean, which does not exist upstream yet.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    Checks by AI agents only: a strict build with no warnings, an axiom check of the
    selected theorems, a check that the Challenge declarations appear verbatim in
    Solution, and a review of the statement against its source by a separate agent. No
    independent human review is claimed.

alignment:
  namespace: "OeisA181316"
  statements:
    - source: >-
        Conjecture: exp( Sum_{n>=1} (q-1)*((q^n-1)/(q-1))^(n-1)*x^n/n ) is an integer
        series for all integer q>1 (A181316, comments).
      lean: "OeisA181316.conjecture"
      module: "FCPalomar.OeisA181316.Solution"
      status: "proved"
    - source: >-
        Extension of the A181316 conjecture to every integer q ≠ 1; not in the source.
        At q = 1 the quotient (q^n-1)/(q-1) is 0/0.
      lean: "OeisA181316.hannaSeries_integral"
      module: "FCPalomar.OeisA181316.Solution"
      status: "proved"
    - source: >-
        A181316: G.f.: A(x) = exp( Sum_{n>=1} 2*((3^n-1)/2)^(n-1)*x^n/n ) (name line),
        the case q = 3.
      lean: "OeisA181316.a181316_integral"
      module: "FCPalomar.OeisA181316.Solution"
      status: "proved"
    - source: >-
        A180606: G.f.: A(x) = exp( Sum_{n>=1} (2^n-1)^(n-1)*x^n/n ) (name line), the
        case q = 2.
      lean: "OeisA181316.a180606_integral"
      module: "FCPalomar.OeisA181316.Solution"
      status: "proved"
    - source: >-
        Not in the sources. For integers q and c, exp( Sum_{n>=1} c*[n]_q^(n-1)*x^n/n )
        is an integer series if and only if every prime dividing q - 1 divides c.
        Hanna's conjecture is the case c = q - 1. For q = 1 the condition means c = 0.
      lean: "OeisA181316.integral_iff"
      module: "FCPalomar.OeisA181316.Solution"
      status: "proved"
    - source: >-
        Not in the sources. The same criterion for c*[n]_q^e(n), when e(pM) ≡ e(M) (mod
        φ(p^k)) whenever p is prime and p^k divides pM, and e(n) >= 1 for n >= 2. The
        exponents n - 1 (A181316, A180606) and n (A155206, A155210) qualify.
      lean: "OeisA181316.integral_iff_of_exponent"
      module: "FCPalomar.OeisA181316.Solution"
      status: "proved"
    - source: >-
        More generally, for m integer, exp( Sum_{n>=1} (m^n - 1)^n/(m-1)^(n-1) * x^n/n )
        is a power series in x with integer coefficients (A155206 and A155210,
        comments). The Lean statement excludes m = 1, where the expression is 0/0.
      lean: "OeisA181316.a155206_integral"
      module: "FCPalomar.OeisA181316.Solution"
      status: "proved"
