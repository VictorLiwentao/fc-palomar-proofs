version: "v0.4"

project:
  name: "OEIS A113052 and A113047: Fuss–Catalan numbers modulo p (Barry's conjecture, Israel 2018)"
  description: >-
    For every prime p, C(pn, n)/((p−1)n+1) modulo p is 1 when n = (p^k−1)/(p−1) and 0
    otherwise. Conjectured by Paul Barry (2005); proved by Robert Israel (2018), with
    Kevin Ryde's proof of the p = 3 case (A113047).
  authors:
    - "Wentao Li"
  responsible_maintainers:
    - "Wentao Li"
  license: "Apache-2.0"

sources:
  - title: "Proof of conjecture (A113052)"
    authors:
      - "Robert Israel"
    id: "https://oeis.org/A113052/a113052.pdf"
    type: "other"
    location: "June 11 2018"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Lucas-type argument for the Fuss–Catalan numbers modulo p.
  - title: "Proof of characteristic function of the ternary repunits (A113047)"
    authors:
      - "Kevin Ryde"
    id: "https://oeis.org/A113047/a113047.txt"
    type: "other"
    location: "June 23 2021"
    relationship: "independently-proves"
    author_endorsement: "not-contacted"
    note: >-
      The p = 3 case.

related_formalizations: []

classification:
  arxiv:
    - "math.NT"
    - "math.CO"
  msc2020:
    - "11B65"
    - "05A10"

