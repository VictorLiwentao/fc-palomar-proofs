        sequence with period dividing phi(k). The Lean statement is its negation.
      lean: "OeisA000464.not_conjecture1"
      module: "FCPalomar.OeisA000464.Solution"
      status: "proved"
    - source: >-
        Not in the source. For every multiple k of 81, (a(n))_{n≥1} modulo k is not
        purely periodic with any period.
      lean: "OeisA000464.not_periodic_of_eighty_one_dvd"
      module: "FCPalomar.OeisA000464.Solution"
      status: "proved"
    - source: >-
        Not in the source. The witness: a(1) = 11 and a(55) ≡ 65 (mod 81).
      lean: "OeisA000464.a_fifty_five"
      module: "FCPalomar.OeisA000464.Solution"
      status: "proved"
    - source: >-
        Not in the source. a(n + 2^(e−1)) ≡ a(n) (mod 2^e) for every e ≥ 1 and every n.
      lean: "OeisA000464.period_two_pow"
      module: "FCPalomar.OeisA000464.Solution"
      status: "proved"
    - source: >-
