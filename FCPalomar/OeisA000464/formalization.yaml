version: "v0.4"

project:
  name: "OEIS A000464: Bala's conjectures for sin x / cos 2x"
  description: >-
    Let a(n) = (2n+1)! [x^(2n+1)] sin x / cos 2x (OEIS A000464: 1, 11, 361, 24611, …;
    Glaisher, 1914). Peter Bala made four conjectures on it in 2021. The package refutes
    the first as stated: modulo every multiple of 81, (a(n))_{n≥1} is not purely
    periodic with any period, because a(55) ≡ 65 ≢ 11 = a(1) (mod 81). It proves the
    corrected form, a(n + φ(k)) ≡ a(n) (mod k) whenever 2n + 1 is at least the exponent
    of every odd prime in k, so the conjecture holds eventually for every k and from n =
    1 when no odd prime exponent of k exceeds 3. It proves the other three conjectures:
    the Gauss congruences a(np^k + i) ≡ a(np^(k−1) + i) (mod p^k) for every shift i,
    with the integrality of exp(Σ a(n+i) x^n/n); a(mn) ≡ a(m)^n (mod 2^(2v₂(m)+4)); and
    a(2mn) ≡ a(n)^(2m), a((2m+1)n) ≡ a(n)^(2m+1) (mod 2^(v₂(m)+4)). Behind them are a(n
    + 2^(e−1)) ≡ a(n) (mod 2^e) for every n, and a(n + (p−1)p^(e−1)/2) ≡ (−1)^((p−1)/2)
    a(n) (mod p^e) for odd primes p and 2n + 1 ≥ e. The period can be sharpened from
    φ(k) to the Carmichael function λ(k): a(n + 2^(e−2)) ≡ a(n) (mod 2^e) for e ≥ 3, so
    a(n + λ(k)) ≡ a(n) (mod k) under the same condition on n, and λ(8) = 2 cannot be
    lowered, since a(1) ≢ a(0) (mod 8). Bala's congruence conjectures for exponential
    generating functions are recent targets in the study of congruences for Euler-type
    numbers: Kallat proved Bala's conjectures for A158690 (arXiv:2609.07238), and Blanco
    Gómez refuted the same pure-periodicity wording for the Euler numbers A000364 and
    proved its eventual form (Zenodo 23150466, Theorem 2.2). The odd-prime congruence is
    known (Blanco Gómez, Zenodo 23407292, Theorem 1), and the 2-adic period follows
    quickly from Nishibuchi's criterion (arXiv:2610.11648, Prop. 3.4). No earlier
    treatment of the failure modulo 81 or of the power congruences 3) and 4) was found.
  authors:
    - "Wentao Li"
  responsible_maintainers:
    - "Wentao Li"
  license: "Apache-2.0"

sources:
  - title: "OEIS A000464"
    authors:
      - "N. J. A. Sloane"
      - "Peter Bala"
    id: "https://oeis.org/A000464"
    type: "web discussion"
    location: "entry by N. J. A. Sloane; conjectures 1)–4) in Peter Bala's comment of December 22, 2021"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Bala's conjectures: 1) (a(n))_{n≥1} modulo every k is purely periodic with period
      dividing φ(k); 2) Gauss congruences for every shift, with the exp-integrality
      consequence; 3) and 4) power congruences modulo powers of 2. Searches in November
      2026 (the OEIS entry, arXiv, Zenodo, OpenWitness, GitHub issues, pull requests and
      code, and public Lean and OEIS-proof result repositories) found no earlier proof
      or refutation for this entry. The odd-prime congruence is known (see Blanco
      Gómez), and the 2-adic period follows quickly from Nishibuchi's criterion. The
      refutation and the proofs in this package are credited to Wentao Li; the tools for
      the prime-power congruences are known (see the other sources). Bala's FORMULA
      congruences (for example a(n) ≡ 11^n mod 240) are not part of this package.
  - title: "Kummer congruences for the values b^r E_r(a/b) of the Euler polynomials at rational points, and the towers a(np^k) ≡ ±a(np^(k-1)) (mod p^k) for the tangent, Euler, zigzag and Springer numbers"
    authors:
      - "Roberto Blanco Gómez"
    id: "https://zenodo.org/records/23407292"
    type: "paper"
    location: "Theorem 1 at a/b = 1/4 (§3(e), Springer numbers); first posted as Zenodo 23404924 (October 15, 2026)"
    relationship: "independently-proves"
    author_endorsement: "not-contacted"
    note: >-
      Its Theorem 1: for an odd prime p ∤ b, the numbers s_r = b^r E_r(a/b) satisfy s_r
      ≡ s_r' (mod p^k) whenever r ≡ r' (mod (p − 1)p^(k−1)) and r, r' ≥ k. With the
      entry's formula a(n) = (−1)^(n+1) 4^(2n+1) E_(2n+1)(1/4), r = 2n + 1 and k = e,
      this is exactly antiperiod_odd_prime_pow, including the bound 2n + 1 ≥ e. So it
      also gives period_odd_prime_pow and the odd-prime parts of period_totient,
      conjecture1_eventual and conjecture2. Its Remark 5 notes that Theorem 1 is a
      special case of the theory of p-adic measures attached to Dirichlet characters;
      the entry also writes a(n) = (−1)^n B_(2n+2)(χ)/(2n+2) for the character χ modulo
      8. Its Theorem 2(e) gives the towers S(np^k) ≡ ±S(np^(k−1)) (mod p^k) for the
      Springer numbers A001586, of which a(n) = S(2n + 1) is a bisection; they do not
      give conjecture2 directly. It does not mention A000464 and does not treat p = 2,
      the refutation, or conjectures 3) and 4).
  - title: "Open statements in core entries of the OEIS, II: further proofs and three refutations"
    authors:
      - "Roberto Blanco Gómez"
    id: "https://zenodo.org/records/23150466"
    type: "paper"
    location: "Theorem 2.2"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Its Theorem 2.2(i) proves the eventual form of the same pure-periodicity wording
      of Bala for the Euler numbers A000364, and Theorem 2.2(ii) shows that pure
      periodicity holds exactly when no cube of an odd prime divides k, so the wording
      fails at k = 27. The mechanism is the one used here: the odd-prime congruence
      holds only from an index that depends on the exponent. It does not treat A000464.
  - title: "A Unified Framework for $p$-adic Congruences and $p$-adic Interpolations of Sequences"
    authors:
      - "Yuta Nishibuchi"
    id: "https://arxiv.org/abs/2610.11648"
    type: "paper"
    location: "Prop. 3.4(1) (arXiv v2, October 21, 2026)"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Prop. 3.4(1) shows that c(n + p^k) ≡ α^(p^k) c(n) (mod p^(k+r)) for all n and k
      exactly when the l-th Hurwitz coefficient of e^(−αx)F has p-adic valuation at
      least ⌊log_p l⌋ + r for every l. With p = 2, α = 1 and r = 0 it gives
      period_two_pow at once for the hyperbolic form G = sinh x · sech 2x, since a(n) =
      (−1)^n G_(2n+1) and e^(−x)G = ((e^(2x) − 1)/2) · (2/(1 + e^(4x))) has its l-th
      coefficient divisible by 2^(l−1). The paper does not mention A000464. The Lean
      proof proves directly the sufficient form of the criterion that it needs (the
      lemma mahler).
  - title: "A Proof of Bala's Congruence Conjectures for A158690"
    authors:
      - "Ahaan Kallat"
    id: "https://arxiv.org/abs/2609.07238"
    type: "paper"
    location: "Theorem 2.6 (arXiv v1, September 7, 2026)"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Its Theorem 2.6 shows that the coefficients of G(e^x − 1) with G ∈ ℤ[[y]] have
      eventual period λ(k) modulo every k ≥ 2, and it proves Bala's conjectures for
      A158690 with it. It does not apply to A000464 as stated: writing Σ a(n) x^n/n! =
      G(e^x − 1), the coefficient of y^8 in G has 2 in its denominator. The odd-prime
      step of this package uses the p-local form of its method: over ℤ/p^e, where 2 is a
      unit, a series that agrees up to each index with a polynomial in e^x − 1 has
      coefficients with period φ(p^e) from index e.
  - title: "Fixed point indices of iterated maps"
    authors:
      - "Albrecht Dold"
    id: "https://doi.org/10.1007/BF01394243"
    type: "paper"
    location: "Invent. Math. 74 (1983), no. 3, 419–435"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Dold's integrality criterion, in the direction from the Gauss congruences to
      integer coefficients of exp(Σ b(n) x^n/n), used for conjecture2_exp_integral.

