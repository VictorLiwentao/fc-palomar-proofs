      lean: "OeisA000464.period_two_pow_of_three_le"
      module: "FCPalomar.OeisA000464.Solution"
      status: "proved"
    - source: >-
        Not in the source. a(n + (p−1)p^(e−1)/2) ≡ (−1)^((p−1)/2) a(n) (mod p^e) for odd
        primes p, e ≥ 1 and 2n + 1 ≥ e; known from Blanco Gómez (Zenodo 23407292,
        Theorem 1).
      lean: "OeisA000464.antiperiod_odd_prime_pow"
      module: "FCPalomar.OeisA000464.Solution"
      status: "proved"
    - source: >-
