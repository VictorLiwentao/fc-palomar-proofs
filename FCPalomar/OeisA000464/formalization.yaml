automation:
  methods:
    - method: "agent"
      models:
        - "claude-opus-5-5"
      framework: "Claude Code"
      tool_setup: >-
        Claude Code (Anthropic) developed the proof, wrote the Lean formalization and
        prepared this package under the direction of Wentao Li, with independent agent
        review of the proof and of the statement against its source. Wentao Li is the
        human author and maintainer.
  spend_usd: "not available"
  notes: >-
    AI assistance was material, including in developing the proof. The conjectures are
    due to Peter Bala (OEIS A000464). Over ℂ, x ↦ ix turns the e.g.f. into G = sinh x ·
    sech 2x up to signs. At p = 2, G = c·e^x with 2^⌊l/2⌋ dividing c_l, and a
    binomial-shift lemma (the sufficient direction of Nishibuchi's criterion) gives the
    period 2^(e−1) modulo 2^e; treating the terms l = 1, 2 separately (c_1 = 1, c_2 =
    −2) sharpens it to 2^(e−2) for e ≥ 3, which gives the Carmichael period λ(k). At odd
    p, G agrees modulo p^e with a polynomial in e^x up to each index (the p-local form
    of Kallat's method), which gives the odd-prime congruence, known from Blanco Gómez.
    The Chinese remainder theorem assembles the corrected conjecture 1); an exact
    integer recurrence checked by the kernel gives a(55) mod 81 for the refutation.
    Conjecture 2) follows from the periods and Dold's criterion. For conjectures 3) and
    4), b(n) = a(n)/11^n in ℤ₂ satisfies 2^(k+2) | Δ^k b(0) for k ≥ 1; with the power
    map z ↦ z^(2^K) and the divisibility of l!(C(xy, l) − y·C(x, l)) by x²y(y−1) this
    gives a(xy) ≡ a(x)^y (mod 2^(K+3)) when 2^K divides x²y(y−1). The Solution's module
    docstring gives the full account. Wentao Li is the human author of this package's
    proof.

fidelity:
  divergences: >-
    Conjecture 1) is read literally: a pure period T ≥ 1 with T dividing φ(k), from n =
    1; not_conjecture1 negates exactly that. Conjectures 3) and 4) do not state the
    range of m and n; the package takes m, n ≥ 1: v₂(0) is undefined, and n = 0 is
    trivial since a(0) = 1. v₂(m) is written m.factorization 2. a(n) is defined through
    power series over ℚ with cos 2x as rescale 2 (cos ℚ); the Solution checks a(0..3) =
    1, 11, 361, 24611 against the OEIS data. The exponential of a series L with zero
    constant term is subst L (exp ℚ). Integrality, the prime-power congruences, the
    corrected and eventual forms of 1), their sharpening to the Carmichael function λ(k)
    (ArithmeticFunction.carmichael) and the strengthenings of the refutation are added.
    The statements were written for this package from the OEIS entry. The package does
    not determine exactly which k make the pure form of 1) hold: it proves it when every
    odd prime exponent of k is at most 3 and refutes it for every multiple of 81.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    Checks by AI agents only: a strict build with no warnings, an axiom check of the
    selected theorems, a check that the Challenge declarations appear verbatim in
    Solution, and a review of the statement against its source by a separate agent. No
    independent human review is claimed.

