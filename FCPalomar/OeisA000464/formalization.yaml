        + 1 ≥ e.
      lean: "OeisA000464.period_odd_prime_pow"
      module: "FCPalomar.OeisA000464.Solution"
      status: "proved"
    - source: >-
        Not in the source. Conjecture 1) corrected: a(n + φ(k)) ≡ a(n) (mod k) for k ≥ 1
        whenever 2n + 1 is at least the exponent of every odd prime in k.
      lean: "OeisA000464.period_totient"
      module: "FCPalomar.OeisA000464.Solution"
