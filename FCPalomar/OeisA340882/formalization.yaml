  namespace: "OeisA340882"
  statements:
    - source: >-
        A340882: For fixed integers q and N, the sequence mod(R(n,q),N)n>=1 is either
        purely periodic or periodic with a pre-period 1. The Lean statement is its
        negation.
      lean: "OeisA340882.not_conjecture_A340882"
      module: "FCPalomar.OeisA340882.Solution"
      status: "proved"
    - source: >-
        Not in the source. The A340882 conjecture holds for a given q and every N ≥ 1 if
        and only if q ∈ {−2, −1, 0}.
      lean: "OeisA340882.conjecture_A340882_iff"
      module: "FCPalomar.OeisA340882.Solution"
      status: "proved"
    - source: >-
        Not in the source. For q ≠ −1 and every prime p dividing 1 + q, the A340882
        conjecture fails at N = p^(5 v_p(1+q) + 1).
      lean: "OeisA340882.conjecture_A340882_fails"
      module: "FCPalomar.OeisA340882.Solution"
      status: "proved"
    - source: >-
        Not in the source. The exact pre-period of R(n, q) mod N for every q and N ≥ 1.
      lean: "OeisA340882.prePeriod_spec"
      module: "FCPalomar.OeisA340882.Solution"
      status: "proved"
    - source: >-
        Not in the source. The A340882 conjecture holds for (q, N) if and only if 1 + q
        = 0 or v_p(N) ≤ 5 v_p(1 + q) for every prime p dividing N and 1 + q.
      lean: "OeisA340882.conjecture_A340882_iff_local"
      module: "FCPalomar.OeisA340882.Solution"
      status: "proved"
    - source: >-
        A340883 1): The sequence taken modulo n becomes periodic with a pre-period of
        length either 0 or 1, and with the minimum period dividing phi(n). The Lean
        statement is its negation.
      lean: "OeisA340882.not_conjecture1_A340883"
      module: "FCPalomar.OeisA340882.Solution"
      status: "proved"
    - source: >-
        Not in the source. The witness: modulo 64, a(2) = 5, and a(n) ≡ 27 for odd n ≥ 3
        and a(n) ≡ 37 for even n ≥ 4.
      lean: "OeisA340882.a_mod_64"
      module: "FCPalomar.OeisA340882.Solution"
      status: "proved"
    - source: >-
        Not in the source. The pre-period part of A340883 1): the pre-period modulo m is
        at most 1 if and only if 64 ∤ m.
      lean: "OeisA340882.conjecture1_A340883_prePeriod_iff"
      module: "FCPalomar.OeisA340882.Solution"
      status: "proved"
    - source: >-
        Not in the source as stated. The period part of A340883 1): a(n + φ(m)) ≡ a(n)
