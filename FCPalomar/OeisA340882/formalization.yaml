      lean: "OeisA340882.a_period_totient"
      module: "FCPalomar.OeisA340882.Solution"
      status: "proved"
    - source: >-
        Not in the source. A340883 1) holds for the modulus m if and only if 64 ∤ m.
      lean: "OeisA340882.conjecture1_A340883_iff"
      module: "FCPalomar.OeisA340882.Solution"
      status: "proved"
    - source: >-
        A340883 2): If n and m are coprime then the period of the sequence taken modulo
        n*m equals the l.c.m. of the periods of the sequence taken modulo n and taken
