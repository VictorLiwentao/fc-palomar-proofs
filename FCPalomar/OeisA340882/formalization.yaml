version: "v0.4"

project:
  name: "OEIS A340882 and A340883: Bala's pre-period conjectures, refuted, with the exact pre-period"
  description: >-
    Peter Bala (OEIS, February 2021) defined the polynomials R(n, q) = Σ_{k<n} x^(k²)
    Π_{j=k+1}^{n−1} (x^(2j) − 1), x = 1 + q, as the rows of a q-series (OEIS A340882);
    their values a(n) = R(n, 1) are A340883 (1, 5, 91, 6245, …). He noted that,
    q-adically, R(2n + 1, q − 1) and −R(2n, q − 1) tend to Euler's product Π(1 − q^n).
    He conjectured that for all integers q and N the sequence R(n, q) mod N is purely
    periodic or periodic after one term (A340882), and that A340883 modulo m has
    pre-period 0 or 1 and least period dividing φ(m) (A340883, conjecture 1). The
    package refutes both conjectures and gives the exact answer. For every q and N ≥ 1
    it determines the pre-period of R(n, q) mod N: the maximum, over the primes p
    dividing both N and 1 + q, of an explicit function of v_p(N) and v_p(1 + q). So
    A340882 holds for (q, N) exactly when 1 + q = 0 or v_p(N) ≤ 5 v_p(1 + q) for every
    such prime, and it holds for every N exactly when q ∈ {−2, −1, 0}. For A340883 the
    pre-period is at most 1 exactly when 64 ∤ m (modulo 64 the sequence is 1, 5, 27, 37,
    27, 37, …), while the period part, a(n + φ(m)) ≡ a(n) (mod m) after the pre-period,
    holds for every m. The proof starts from the recurrence R(n + 1) = (x^(2n) − 1) R(n)
    + x^(n²). For a prime p ∤ x and x^o ≡ 1 (mod p^e), the first o terms of the sum for
    R(n + o) vanish modulo p^e and the others match those of R(n). For p ∣ x, the exact
    valuations v_p(R(n + 2) − R(n)) = c(n) v_p(x), with c(1) = 1, c(2) = 5 and c(n) = 2n
    for n ≥ 3, give the pre-period modulo p^e, and the Chinese remainder theorem gives
    it modulo N. For completeness the package also proves Bala's conjecture 2) for
    A340883: for coprime m₁ and m₂ the period modulo m₁m₂ is the lcm of the two periods.
    This is the Chinese remainder theorem for sequences that are eventually periodic
    modulo every m, and it is not claimed as new. The audience is number theorists who
    study congruences and periodicity modulo m of sequences defined by q-series. Bala's
    periodicity conjecture for A158690, whose e.g.f. 1 + Σ_{m≥1} Π_{j=1}^{m} (1 −
    e^(−(2j−1)t)) uses the same products Π(1 − x^(2j−1)), was proved in a recent note
    (Kallat, arXiv:2609.07238): the sequence is eventually periodic modulo every k with
    period dividing φ(k). That note gives a pre-period bound that it does not claim to
    be sharp; for A340882 this package determines the pre-period exactly. Bala's
    companion conjectures for A340881 were proved in 2026
    (umaia1234/agentic-conjectures), and those for A340880 are not part of this package.
    No earlier treatment of A340882 or of A340883's conjecture 1) was found.
  authors:
    - "Wentao Li"
  responsible_maintainers:
    - "Wentao Li"
  license: "Apache-2.0"

sources:
  - title: "OEIS A340882"
    authors:
      - "Peter Bala"
    id: "https://oeis.org/A340882"
    type: "web discussion"
    location: "entry by Peter Bala, February 16, 2021; the conjecture was added by Bala on February 21, 2021 (revision #5); COMMENTS and FORMULA"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Bala's conjecture: for fixed integers q and N, R(n, q) mod N (n ≥ 1) is purely
      periodic or periodic with pre-period 1. R is defined by the FORMULA line. The
      entry's name and first comment write the series with the exponent nk + n²; the
      data and the FORMULA line need 2nk + n². Searches in November 2026 (the OEIS
      entry, arXiv, Zenodo, GitHub issues, pull requests and code, and public Lean and
      OEIS-proof result repositories) found no earlier proof or refutation. The
      refutation and the exact pre-period are credited to Wentao Li.
  - title: "OEIS A340883"
    authors:
      - "Peter Bala"
    id: "https://oeis.org/A340883"
    type: "web discussion"
    location: "entry and conjectures 1) and 2) by Peter Bala, February 16, 2021 (COMMENTS and FORMULA)"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Bala's conjectures: 1) the sequence modulo n has pre-period 0 or 1 and least
      period dividing φ(n); 2) for coprime n and m the period modulo nm is the lcm of
      the periods modulo n and modulo m. Conjecture 1) is refuted at modulus 64 and
      corrected here. Conjecture 2) is proved; it is the Chinese remainder theorem for
      sequences that are eventually periodic modulo every modulus. The refutation and
      the corrected form are credited to Wentao Li.
  - title: "A Proof of Bala's Congruence Conjectures for A158690"
    authors:
      - "Ahaan Kallat"
    id: "https://arxiv.org/abs/2609.07238"
    type: "paper"
    location: "Theorem 1.1 and Remark 2.2 (v1, September 7, 2026)"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Proves Bala's conjecture that A158690, with e.g.f. 1 + Σ_{m≥1} Π_{j=1}^{m} (1 −
      e^(−(2j−1)t)), is eventually periodic modulo every k with period dividing φ(k), in
      the stronger form that the Carmichael function λ(k) is an eventual period,
      together with his shifted Gauss congruences. Remark 2.2 gives an explicit
      pre-period bound that it does not claim to be sharp. It does not treat A340882 or
      A340883 and is cited for context only.
  - title: "umaia1234/agentic-conjectures: problems/oeis-a340881/PROOF.md"
    authors:
      - "umaia1234"
    id: "https://github.com/umaia1234/agentic-conjectures/blob/724761392945889c114aef4e802a5669379a4deb/problems/oeis-a340881/PROOF.md"
    type: "other"
    location: "Theorems 1.3 and 1.6 (August 11, 2026)"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Proves Bala's two conjectures for the companion entry A340881, the row sums of the
      related rows R′(n) = Σ_k x^(k(k+1)/2) Π (x^j − 1) at x = 2: pure periodicity
      modulo primes with period dividing 2(p − 1), and eventual periodicity modulo
      composite n. It does not treat A340882 or A340883, and no code from it is used.

