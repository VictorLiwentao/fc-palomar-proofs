automation:
  methods:
    - method: "agent"
      models:
        - "claude-opus-5-5"
      framework: "Claude Code"
      tool_setup: >-
        Claude Code (Anthropic) developed the proof, wrote the Lean formalization and
        prepared this package under the direction of Wentao Li, with independent agent
        review of the proof and of the statement against its source. Wentao Li is the
        human author and maintainer.
  spend_usd: "not available"
  notes: >-
    AI assistance was material, including in developing the proof. The conjectures are
    due to Peter Bala (OEIS A340882, A340883). The proof uses the recurrence R(n + 1) =
    (x^(2n) − 1) R(n) + x^(n²). For a prime p ∤ x and o with x^o ≡ 1 (mod p^e), the sum
    for R(n + o) agrees term by term with the sum for R(n) modulo p^e, and its extra
    terms contain the factor x^(2o) − 1; so R is purely periodic modulo p^e. For p ∣ x
    with x ≠ 0 and v = v_p(x), R(n) ≡ (−1)^(n−1) (mod p), and an explicit identity gives
    v_p(R(n + 2) − R(n)) = v, 5v and 2nv for n = 1, n = 2 and n ≥ 3; with period 2 this
    gives the local pre-period. A lemma that the start of periodicity does not depend on
    the period, together with the Chinese remainder theorem over the prime-power factors
    of N, gives the global pre-period. The A340883 statements are the case q = 1; modulo
    64, 4^n ≡ 2^(n²) ≡ 0 for n ≥ 3, so a(n + 1) ≡ −a(n). The Solution's module docstring
    gives the full account. Wentao Li is the human author of this package's proof.

fidelity:
  divergences: >-
    Both sequences are indexed from n = 1, as in the OEIS; the value at 0 is not used.
    Bala's N and his modulus n for A340883 (here m) are taken to be at least 1: a
    negative modulus gives the same congruences as its absolute value, and modulo 0 the
    statements are about equality. "Pre-period at most n₀" means that some L ≥ 1 has s(n
    + L) ≡ s(n) for every n > n₀; Bala's "purely periodic or pre-period 1" is then
    exactly periodicity from n = 2, and his A340883 clause 1) is exactly periodicity
    from n = 2 with some period L dividing φ(m), since the start of periodicity does not
    depend on the period and every eventual period is a multiple of the least one. "The
    period" in A340883 2) is the least eventual period (period). R is defined by the
    FORMULA line; the series in the entry's name, which has a typo in its exponent, is
    not formalized. The Solution checks R(1, q), R(2, q) and R(3, q) against the entry's
    comment for every q, and a(1..6) against the A340883 data. The statements at p ∣ 1 +
    q, the exact pre-period and the corrected forms are added. The statements were
    written for this package from the OEIS entries.

