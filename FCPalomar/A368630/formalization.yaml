automation:
  methods:
    - method: "agent"
      models:
        - "gpt-6.1-sol"
      framework: "OpenAI Codex"
      tool_setup: >-
        OpenAI Codex (GPT-6.1 Sol) developed the original Lean proof under the direction
        of Wentao Li, published in VictorLiwentao/lean-oeis-proofs at commit
        e0e499973c33.
    - method: "agent"
      models:
        - "claude-opus-5-5"
      framework: "Claude Code"
      tool_setup: >-
        Claude Code (Anthropic) ported the earlier development to Lean v4.35.0 and
        Mathlib ccbef15e, adjusted it to the current Formal Conjectures statement, and
        wrote this package, under the direction of Wentao Li. Wentao Li is the human
        author and maintainer.
  spend_usd: "not available"
  notes: >-
    AI assistance was material. The mathematics is credited to the original authors
    listed under sources.

fidelity:
  divergences: >-
    None. The statement is new: it was written for this package from the source and is
    proposed for Formal Conjectures as FormalConjectures/OEIS/368630.lean with the same
    declarations; only the FormalConjecturesUtil import, attributes and docstrings
    differ.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    Agent checks only: strict build with no warnings, axiom check of the selected
    theorems, verbatim comparison of the copied definitions and statement, and an
    independent agent review of source fidelity. No human review beyond Wentao Li is
    claimed.

alignment:
  namespace: "OeisA368630"
  statements:
    - source: >-
        With A(0) = 1 and A(x/A(x)^2) = exp(x A(x)): a(n) ≡ 1 (mod 3); a(2n) ≡ 1 (mod
        2); a(2n+1) ≡ 0 (mod 2) for n ≥ 1.
      lean: "OeisA368630.exists_unique_sequence"
      module: "FCPalomar.A368630.Solution"
      status: "proved"
    - source: >-
        With A(0) = 1 and A(x/A(x)^2) = exp(x A(x)): a(n) ≡ 1 (mod 3); a(2n) ≡ 1 (mod
        2); a(2n+1) ≡ 0 (mod 2) for n ≥ 1.
      lean: "OeisA368630.conjecture_mod_three"
