automation:
  methods:
    - method: "agent"
      models:
        - "gpt-6.1-sol"
      framework: "OpenAI Codex"
      tool_setup: >-
        OpenAI Codex (GPT-6.1 Sol) developed the original Lean proof under the direction
        of Wentao Li, published in VictorLiwentao/lean-oeis-proofs at commit
        e0e499973c33.
    - method: "agent"
      models:
        - "claude-opus-5-5"
      framework: "Claude Code"
      tool_setup: >-
        Claude Code (Anthropic) ported the earlier development to Lean v4.35.0 and
        Mathlib ccbef15e, adjusted it to the current Formal Conjectures statement, and
        wrote this package, under the direction of Wentao Li. Wentao Li is the human
        author and maintainer.
  spend_usd: "not available"
  notes: >-
    AI assistance was material. The mathematics is credited to the original authors
    listed under sources.

fidelity:
  divergences: >-
    None. The statement was written for this package from the OEIS entry, not copied
    from an existing formalization. The same declarations are proposed for Formal
    Conjectures as FormalConjectures/OEIS/368630.lean (google-deepmind/formal-
    conjectures PR #7674). The Challenge leaves out only the FormalConjecturesUtil
    import, attributes, test lemmas and unrelated declarations of that file.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    Checks by AI agents only: a strict build with no warnings, an axiom check of the
    selected theorems, a check that the Challenge declarations appear verbatim in
    Solution, and a review of the statement against its source by a separate agent. No
    independent human review is claimed.

