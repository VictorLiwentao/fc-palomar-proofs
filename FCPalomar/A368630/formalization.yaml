version: "v0.4"

project:
  name: "OEIS A368630: three congruences (Hanna's conjectures)"
  description: >-
    The exponential generating function A(x) of OEIS A368630 satisfies A(0) = 1 and
    A(x/A(x)^2) = exp(x A(x)). The package proves that this equation determines a unique
    integer coefficient sequence, and that a(n) ≡ 1 (mod 3) for every n, a(2n) is odd
    for every n, and a(2n+1) is even for n ≥ 1, as conjectured by Paul D. Hanna (OEIS
    A368630, 2024).
  authors:
    - "Wentao Li"
  responsible_maintainers:
    - "Wentao Li"
  license: "Apache-2.0"

sources:
  - title: "OEIS A368630"
    authors:
      - "Paul D. Hanna"
    id: "https://oeis.org/A368630"
    type: "web discussion"
    location: "entry of January 2, 2024"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      States the equation and the three congruences as conjectures. Searches on
      2026-10-28 found no earlier written proof. The proof here, by Wentao Li, works in
      an integral Hurwitz-series algebra; it was first made public on October 29, 2026
      at 02:56 UTC. L.-H. Su posted an independent proof of all three congruences later
      the same day (see below).
  - title: "Parity and Asymptotic Laws for Implicit and Reflected Integer Sequences"
    authors:
      - "Lien-Hung Su"
    id: "https://doi.org/10.5281/zenodo.23760779"
    type: "paper"
    location: "Zenodo record 23760779, version v1 (created October 29, 2026, 09:55 UTC), Theorem 6.2 and Corollary 6.3"
    relationship: "independently-proves"
    author_endorsement: "not-contacted"
    note: >-
      An unrefereed preprint. Theorem 6.2 proves, for integer d ≥ 2 and 0 ≤ r ≤ d, that
      the e.g.f.s with A(x/A(x)^r) = exp(x A(x)^(d−r)) have integer coefficients a(n) ≡
      1 (mod d), and for odd d ≥ 3 the parity pattern a(n) odd iff n = 0, 1 or n even.
      Corollary 6.3 applies it to A368630 (d, r, s) = (3, 2, 1) and A368631, which gives
      all three of Hanna's congruences. It uses a labelled-partition argument and
      contains no Lean. It appeared about seven hours after this package's proof was
      made public, and the two proofs are independent.

