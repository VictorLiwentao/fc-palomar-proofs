      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      comparator_config: "FCPalomar/A368630/comparator.json"
    - declaration: "OeisA368630.conjecture_mod_three"
      file: "FCPalomar/A368630/Solution.lean"
      sorry_count: 0
