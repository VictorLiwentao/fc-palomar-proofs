version: "v0.4"

project:
  name: "OEIS A368630: three congruences (Hanna's conjectures)"
  description: >-
    The exponential generating function A(x) of OEIS A368630 satisfies A(0) = 1 and
    A(x/A(x)^2) = exp(x A(x)). The package proves that this equation determines a unique
    integer coefficient sequence, and that a(n) ≡ 1 (mod 3) for every n, a(2n) is odd
    for every n, and a(2n+1) is even for n ≥ 1, as conjectured by Paul D. Hanna (OEIS
    A368630, 2024).
  authors:
    - "Wentao Li"
  responsible_maintainers:
    - "Wentao Li"
  license: "Apache-2.0"

sources:
  - title: "OEIS A368630"
    authors:
      - "Paul D. Hanna"
    id: "https://oeis.org/A368630"
    type: "web discussion"
    location: "entry of January 2, 2024"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      States the equation and the three congruences as conjectures. Searches on
      2026-10-28 found no earlier written proof. The proof here, by Wentao Li, works in
      an integral Hurwitz-series algebra.

related_formalizations:
  - title: "VictorLiwentao/lean-oeis-proofs: LeanOeisProofs/NewProofs/A368630.lean"
    authors:
      - "Wentao Li"
    id: "https://github.com/VictorLiwentao/lean-oeis-proofs/blob/e0e499973c3398f08ed91b39618f1948fe1804a5/LeanOeisProofs/NewProofs/A368630.lean"
    relationship: "builds-on"
    note: >-
      The earlier Lean 4.33/4.34 version of this proof, linked from google-
      deepmind/formal-conjectures PR #7674. This package ports it to Lean 4.35.

