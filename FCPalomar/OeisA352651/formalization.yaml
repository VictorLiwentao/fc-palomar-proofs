automation:
  methods:
    - method: "agent"
      models:
        - "claude-opus-5-5"
      framework: "Claude Code"
      tool_setup: >-
        Claude Code (Anthropic) developed the proof, wrote the Lean formalization and
        prepared this package under the direction of Wentao Li, with independent agent
        review of the statement against its source. Wentao Li is the human author and
        maintainer.
  spend_usd: "not available"
  notes: >-
    AI assistance was material, including in developing the proof. The conjecture is due
    to Peter Bala, and the open status of N ≤ −1 is recorded by R. Blanco Gómez. An
    unpublished informal proof (November 2026) used Legendre's formula and a
    step-function inequality; the Lean proof is a shorter elementary route through two
    ascending factorials. Wentao Li is the human author of this package's proof.

fidelity:
  divergences: >-
    The binomials are read as C(x,k) = x(x−1)⋯(x−k+1)/k! for rational x, the limit in
    the top argument with the lower index fixed, as Bala's formulas for A275652 and
    A275654 require; the Gamma quotient continued in n gives other values (u₋₃(1) =
    100/3). The statement takes N ≤ −1, equivalent to M ≥ 1 with N = −M. Bala's
    supercongruences are not stated. The statements were written for this package.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    Checks by AI agents only: a strict build with no warnings, an axiom check of the
    selected theorems, a check that the Challenge declarations appear verbatim in
    Solution, and a review of the statement against its source by a separate agent. No
    independent human review is claimed.

alignment:
  namespace: "OeisA352651"
  statements:
    - source: >-
        Not in the source. The denominator binomial(N*n/2,n) is nonzero for N ≤ −1, so
        u_N(n) is a genuine quotient.
      lean: "OeisA352651.denominator_ne_zero"
      module: "FCPalomar.OeisA352651.Solution"
      status: "proved"
    - source: >-
        u_N(n) =
        binomial(N*n,2*n)*binomial(N*n/2,2*n)*binomial(2*n,n)^2/binomial(N*n/2,n)^2 is
        conjectured to be integral, for integers N other than 0 or 1 (A352651,
        comments); here N ≤ −1.
      lean: "OeisA352651.u_integral"
      module: "FCPalomar.OeisA352651.Solution"
      status: "proved"
