automation:
  methods:
    - method: "agent"
      models:
        - "claude-opus-5-5"
      framework: "Claude Code"
      tool_setup: >-
        Claude Code (Anthropic) developed the proof, wrote the Lean formalization and
        prepared this package under the direction of Wentao Li, with independent agent
        review of the statement against its source. Wentao Li is the human author and
        maintainer.
  spend_usd: "not available"
  notes: >-
    AI assistance was material, including in developing the proof. The conjectures are
    due to Peter Bala; the recurrence is Robinson's (Stanley gives the equivalent
    generating function), and the ordered-set-partition expansion at q = 2 is Jovovic's
    formula. The integrality criterion is Dold's (Stanley EC2, Exercise 5.2(a)). The
    informal proof (November 2026) counted orbits of a cyclic action on ordered set
    partitions; the Lean proof replaces that step by a Frobenius congruence in the
    monoid algebra ℤ[ℕ^l] and a divisibility of multinomial coefficients. Wentao Li is
    the human author of this package's proof.

fidelity:
  divergences: >-
    The Challenge defines a_q by the recurrence (R) for every integer q instead of as a
    count of digraphs. (R) with q = 2 is A003024's formula line, and (R) with q = 3
    follows from A188457's defining g.f.; the docstring explains both. gauss_congruence
    and exp_integral go beyond the sources by allowing every integer q. Integer
    coefficients are stated as ∀ n, ∃ z : ℤ, coeff n F = z, and exp of a series L with
    zero constant term as subst L (exp ℚ). The statements were written for this package.
    They are proposed for Formal Conjectures as FormalConjectures/OEIS/3024.lean, which
    does not exist upstream yet.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    Checks by AI agents only: a strict build with no warnings, an axiom check of the
    selected theorems, a check that the Challenge declarations appear verbatim in
    Solution, and a review of the statement against its source by a separate agent. No
    independent human review is claimed.

alignment:
  namespace: "OeisA003024"
  statements:
    - source: >-
        Not stated in the sources. For every integer q, every prime p and all n, r ≥ 1:
        a_q(np^r) ≡ a_q(np^(r−1)) (mod p^r), where a_q is defined by the recurrence (R).
        By Stanley EC2, Exercise 5.2(a), this is equivalent to the integrality
        statement.
      lean: "OeisA003024.gauss_congruence"
      module: "FCPalomar.OeisA003024.Solution"
      status: "proved"
    - source: >-
        Not stated in the sources. exp(Sum_{n>=1} a_q(n)*x^n/n) has integer coefficients
        for every integer q; Bala's two conjectures are the cases q = 2 and q = 3.
      lean: "OeisA003024.exp_integral"
      module: "FCPalomar.OeisA003024.Solution"
      status: "proved"
    - source: >-
        exp( Sum_{n >= 1} a(n)*x^n/n ) = 1 + x + 2*x^2 + 10*x^3 + 146*x^4 + 6010*x^5 +
        ... appears to have integer coefficients (cf. A188490) (A003024, formula
        section, Bala, Jan 14 2016). A188490 is this series.
      lean: "OeisA003024.a003024_exp_integral"
      module: "FCPalomar.OeisA003024.Solution"
      status: "proved"
    - source: >-
        exp( Sum_{n >= 1} a(n)*x^n/n ) = 1 + x + 3*x^2 + 39*x^3 + 2403*x^4 + 616131*x^5
        + ... appears to have integer coefficients (A188457, formula section, Bala, Jan
        14 2016).
      lean: "OeisA003024.a188457_exp_integral"
      module: "FCPalomar.OeisA003024.Solution"
      status: "proved"
