version: "v0.4"

project:
  name: "Erdős Problem 983: the Erdős–Straus upper bound f(π(n)+1, n) <= 2π(√n)+1"
  description: >-
    Let f(k,n) be the least r such that every k-subset A of {1..n} has a set S of r
    primes with more than r elements of A divisible only by primes in S. Erdős and
    Straus proved f(π(n)+1, n) <= 2π(n^{1/2})+1.
  authors:
    - "Wentao Li"
  responsible_maintainers:
    - "Wentao Li"
  license: "Apache-2.0"

sources:
  - title: "Some applications of graph theory to number theory"
    authors:
      - "Paul Erdős"
    id: "Proc. Second Chapel Hill Conf. on Combinatorial Mathematics and its Applications (1970) 136-145"
    type: "paper"
    location: "pp. 138-139, (14)"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      The argument of Erdős and Straus: an element has at most one prime factor above
      sqrt(n).

related_formalizations:
  - title: "Formal Conjectures: FormalConjectures/ErdosProblems/983.lean"
    authors:
      - "The Formal Conjectures Authors"
    id: "https://github.com/google-deepmind/formal-conjectures/blob/691719db2653905d5fa0775408370fb058e4c59f/FormalConjectures/ErdosProblems/983.lean"
    relationship: "builds-on"
    note: >-
      The Challenge copies the statement and the definitions it uses verbatim from this
      file at commit 691719db. The upstream declaration is `sorry` at that commit.

