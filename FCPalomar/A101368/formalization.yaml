      - "Max Alekseyev"
    id: "https://oeis.org/A101368"
    type: "web discussion"
    location: "name and formula (2005, 2006)"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      States the problem and the g.f.
  - title: "Congruence Jumping in Polynomial Divisibility Systems"
    authors:
      - "Max A. Alekseyev"
      - "D. I. Khomovsky"
    id: "arXiv:2610.00808"
    type: "paper"
    location: "Example 7.1"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Vieta-jumping treatment of this system.

