version: "v0.4"

project:
  name: "OEIS A101368: pairs with i | 1+j+j^2 and j | 1+i+i^2 (Stephan's g.f., Alekseyev 2006)"
  description: >-
    The positive solutions of i | 1 + j + j^2, j | 1 + i + i^2 are exactly the pairs
    (c(n), c(n+1)), n >= 1, in either order, where c(n) are the coefficients of x(1 − 5x
    + 3x^2)/((1 − x)(1 − 5x + x^2)). Stephan's g.f. conjecture (2005), proved by Max
    Alekseyev (2006); the problem is W. W. Chao's Crux problem 2981.
  authors:
    - "Wentao Li"
  responsible_maintainers:
    - "Wentao Li"
  license: "Apache-2.0"

