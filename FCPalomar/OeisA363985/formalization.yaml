automation:
  methods:
    - method: "agent"
      models:
        - "claude-opus-5-5"
      framework: "Claude Code"
      tool_setup: >-
        Claude Code (Anthropic) developed the proof, wrote the Lean formalization and
        prepared this package under the direction of Wentao Li, with independent agent
        review of the statement against its source. Wentao Li is the human author and
        maintainer.
  spend_usd: "not available"
  notes: >-
    AI assistance was material, including in developing the proof. The conjectures are
    due to Peter Bala (OEIS A363985 and siblings). The methods are Coster's, Straub's
    and Osburn–Sahu–Straub's; their application to Bala's u_m family is new in this
    package. Wentao Li is its human author.

fidelity:
  divergences: >-
    None. The statement is new: it was written for this package from the source and is
    proposed for Formal Conjectures as FormalConjectures/OEIS/363985.lean with the same
    declarations. The Challenge leaves out only the FormalConjecturesUtil import,
    attributes, test lemmas and unrelated declarations of that file.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    Checks by AI agents only: a strict build with no warnings, an axiom check of the
    selected theorems, a check that the Challenge declarations appear verbatim in
    Solution, and a review of the statement against its source by a separate agent. No
    independent human review is claimed.

alignment:
  namespace: "OeisA363985"
  statements:
    - source: >-
        We conjecture that, for all m in Z, the sequences u_m and v_m satisfy the
        supercongruences u(n*p^r) == u(n*p^(r-1)) (mod p^(3*r)) for all primes p >= 5
        and positive integers n and r (A363985, comments). The Lean statement is the u_m
        half, for every integer m.
      lean: "OeisA363985.u_tower"
      module: "FCPalomar.OeisA363985.Solution"
      status: "proved"
    - source: >-
        A363985: the supercongruences for a(n) = Sum_{k = 0..n}
        (-4)^(n-k)*binomial(n,k)*binomial(2*n+k,k)*binomial(2*k,k) (conjecture,
        comments).
      lean: "OeisA363985.a363985_tower"
      module: "FCPalomar.OeisA363985.Solution"
      status: "proved"
    - source: >-
        A363987: the supercongruences for a(n) = Sum_{k = 0..n}
        (-4)^(n-k)*binomial(n,k)*binomial(3*n+k,k)*binomial(2*k,k) (conjecture,
        comments).
      lean: "OeisA363985.a363987_tower"
      module: "FCPalomar.OeisA363985.Solution"
      status: "proved"
    - source: >-
        A363989: the supercongruences for a(n) = Sum_{k = 0..n}
        (-4)^(n-k)*binomial(n,k)*binomial(4*n+k,k)*binomial(2*k,k) (conjecture,
        comments).
      lean: "OeisA363985.a363989_tower"
      module: "FCPalomar.OeisA363985.Solution"
      status: "proved"
    - source: >-
        A362676: the supercongruences for a(n) = Sum_{k = 0..n}
        4^(n-k)*binomial(n,k)*binomial(n-1,k)*binomial(2*k,k) (conjecture, comments).
      lean: "OeisA363985.a362676_tower"
      module: "FCPalomar.OeisA363985.Solution"
      status: "proved"

known_gaps:
  - >-
    Bala's conjecture also covers the second family v_m(n) = Σ (−4)^{n−k} C(n,k)
    C(mn+2k, 2k) C(2k,k) (A363986, A363988, A363990). That half is not proved here.
