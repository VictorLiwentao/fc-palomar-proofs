version: "v0.4"

project:
  name: "McCarthy–Osburn–Straub Conjecture 1.3 for σ₈, with a shifted companion"
  description: >-
    Let A(n) be the sum, over k ∈ [0, n]^4 with k₁ + k₂ = k₃ + k₄, of the products Π
    C(n, k_i) C(n + k_i, k_i). The package proves A(mp^r) ≡ A(mp^{r−1}) (mod p^{3r}) and
    A(mp^r − 1) ≡ A(mp^{r−1} − 1) (mod p^{3r}) for every prime p ≥ 5 and all m, r ≥ 1.
    By McCarthy, Osburn and Straub's Proposition 3.1, A(n) is the leading coefficient of
    Brown's cellular integral for σ₈ = (8, 3, 6, 1, 4, 7, 2, 5), so the first congruence
    is their Conjecture 1.3 for σ₈. That link is not formalized. The second congruence
    is a companion that no source states. σ₈ is the self-dual configuration that MOS
    single out: their Theorem 1.2 relates A_σ₈((p − 1)/2) to the weight-6 newform
    η¹²(2z) modulo p².
  authors:
    - "Wentao Li"
  responsible_maintainers:
    - "Wentao Li"
  license: "Apache-2.0"

sources:
  - title: "Sequences, modular forms and cellular integrals"
    authors:
      - "Dermot McCarthy"
      - "Robert Osburn"
      - "Armin Straub"
    id: "https://arxiv.org/abs/1705.05586"
    type: "paper"
    location: "Math. Proc. Cambridge Philos. Soc. 168 (2020), no. 2, 379–404; doi:10.1017/S0305004118000774. Proposition 3.1 and Conjecture 1.3 (numbering of arXiv v2)."
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Conjecture 1.3 states the p^(3r) tower for the leading coefficients of Brown's
      cellular integrals, from numerical evidence; it extends Coster's supercongruences
      for the Apéry numbers (N = 5, 6). Proposition 3.1, proved with computer algebra,
      identifies the σ₈ coefficients with the sum A(n) used here. Searches in November
      2026 (arXiv, the works that cite MOS in OpenAlex, Zenodo through DataCite, OEIS
      and GitHub) found no proof of the σ₈ case. The closest work proves the N = 7 cases
      (see below). The proof in this package is credited to Wentao Li.
  - title: "On sporadic sequences"
    authors:
      - "Brendan Alinquant"
      - "Robert Osburn"
    id: "https://arxiv.org/abs/2312.07134"
    type: "paper"
    location: "Monatsh. Math. 205 (2024), no. 2, 217–234; end of Section 1"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      States that no general framework explains MOS Conjecture 1.3.
  - title: "The McCarthy–Osburn–Straub conjecture for N = 7: resonance and the cellular integrals 243 and 27"
    authors:
      - "Roberto Blanco Gómez"
    id: "https://doi.org/10.5281/zenodo.24157263"
    type: "paper"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Unrefereed preprint (Zenodo, 12 November 2026). With the same author's
      doi:10.5281/zenodo.24135489 (11 November 2026), it proves Conjecture 1.3 and the
      shifted tower for the five N = 7 sequences. It does not treat N = 8 or σ₈.

