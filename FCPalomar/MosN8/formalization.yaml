  spend_usd: "not available"
  notes: >-
    AI assistance was material, including in developing the proof. The conjecture is due
    to McCarthy, Osburn and Straub. The proof is new in this package; Wentao Li is its
    human author.

fidelity:
  divergences: >-
    The source states Conjecture 1.3 for the leading coefficients A_σ₈(n) of Brown's
    cellular integral. The Lean statements use the explicit four-fold sum A(n) instead.
    The identity A(n) = A_σ₈(n) is MOS Proposition 3.1, which is not formalized (see
    known_gaps). The shifted companion is not in the source. The statement was written
    for this package and is proposed for Formal Conjectures as
    FormalConjectures/Arxiv/1705.05586/CellularIntegrals.lean with the same
    declarations. The Challenge leaves out only the FormalConjecturesUtil import,
    attributes, test lemmas and unrelated declarations of that file.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    Checks by AI agents only: a strict build with no warnings, an axiom check of the
    selected theorems, a check that the Challenge declarations appear verbatim in
    Solution, and a review of the statement against its source by a separate agent. No
    independent human review is claimed.

alignment:
  namespace: "MosN8"
  statements:
    - source: >-
        MOS Conjecture 1.3 for σ₈: A(mp^r) ≡ A(mp^{r−1}) (mod p^{3r}) for all primes p ≥
        5 and m, r ≥ 1, for the coefficients A(n), which equal the four-fold sum by MOS
        Proposition 3.1. The Lean statement is about the four-fold sum.
      lean: "MosN8.tower"
      module: "FCPalomar.MosN8.Solution"
      status: "proved"
    - source: >-
        Not stated in the source. The shifted companion A(mp^r − 1) ≡ A(mp^{r−1} − 1)
        (mod p^{3r}) for all primes p ≥ 5 and m, r ≥ 1.
      lean: "MosN8.shifted_tower"
      module: "FCPalomar.MosN8.Solution"
      status: "proved"

known_gaps:
  - >-
    The Lean statements are about the explicit sum A(n). MOS define A_σ₈(n) as the
    coefficient of the weight-5 cell-zeta value ζ_σ(5) in the cellular integral I_σ(n).
    This coefficient is well defined unconditionally only for motivic multiple zeta
    values, or under the open linear independence of multiple zeta values of different
    weights (MOS, Section 1), so a direct formalization would need motivic periods,
    which Mathlib does not have. The identity A(n) = A_σ₈(n) is MOS Proposition 3.1. Its
    proof is computer-assisted (HyperInt, Lairez's Griffiths–Dwork method in Magma, and
    creative telescoping with HolonomicFunctions) and is not formalized here.
