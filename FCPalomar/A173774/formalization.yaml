version: "v0.4"

project:
  name: "OEIS A173774: Sun's integrality conjecture (Andersen 2010)"
  description: >-
    a(n) = (1/n) Σ_{k<n} (21k+8) C(2k,k)^3 is an integer divisible by 4 C(2n,n). Zhi-Wei
    Sun conjectured this in February 2010. Kasper Andersen confirmed it in a reply on
    the NMBRTHRY list by identifying a(n)/(4 C(2n,n)) with A112029(n−1). Sun records
    Andersen's identity in his paper Super congruences and Euler numbers (Sci. China
    Math. 2011).
  authors:
    - "Wentao Li"
  responsible_maintainers:
    - "Wentao Li"
  license: "Apache-2.0"

sources:
  - title: "OEIS A173774"
    authors:
      - "Zhi-Wei Sun"
    id: "https://oeis.org/A173774"
    type: "web discussion"
    location: "Sun's conjecture and the comment on Andersen's confirmation"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      States the conjecture. A comment records Andersen's confirmation and dates it Feb
      11 2011; Sun's paper listed below dates it Feb. 11, 2010.
  - title: "Re: A somewhat surprising conjecture"
    authors:
      - "Kasper Andersen"
    type: "web discussion"
    location: "NMBRTHRY mailing list, February 2010; linked from OEIS A173774"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Identifies a(n)/(4 C(2n,n)) with A112029(n−1). The Lean proof proves this identity
      by a creative-telescoping certificate.
  - title: "Super congruences and Euler numbers"
    authors:
      - "Zhi-Wei Sun"
    id: "doi:10.1007/s11425-011-4302-x"
    type: "paper"
    location: "Sci. China Math. 54 (2011) 2509-2535; Lemma 4.1 and the paragraph after Remark 1.4 in arXiv:1001.4453"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      States Andersen's identity as Lemma 4.1 (Kasper Andersen) and describes his proof:
      a recurrence for a(n)/(4 C(2n,n)) and Zeilberger's algorithm.

