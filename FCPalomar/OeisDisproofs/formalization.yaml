version: "v0.4"

project:
  name: "Counterexamples to five OEIS conjectures (A333564, A034171, A298799, A382407, A399793)"
  description: >-
    Five conjectures from OEIS comments are stated and refuted, each by an explicit
    witness that Lean's kernel evaluates. (1) Peter Bala (December 2019) conjectured
    that c(pn) ≡ c(n) (mod p²) for c(n) = A034171(n − 1) = 3^(n−1) Π_{k<n} (3k + 1)/n!
    and primes p ≡ 1 (mod 3), and for the coefficients a(n) of (1 − 27x)^(−1/9)
    (A298799) and primes p ≡ 1 (mod 9), for all n ≥ 1 outside an explicit set of n = mp
    + k with 0 ≤ m ≤ (p − 1)/d and 1 ≤ k ≤ (p − 1)/d (d = 3 or 9). Every exception lies
    below p². The package shows that both congruences fail at n = p² + 1: for A034171 at
    p = 7, n = 50, and for A298799 at p = 19, n = 362, where a(6878) has 9841 digits. So
    the exception sets are incomplete. (Outside the Lean, a search over n < 400 finds n
    = p² + 1 as the first failure for A034171 at p = 7, 13 and 19.) The package also
    proves that (1 − 27x)^(−1/9) is the unique power series over ℚ with constant term 1
    and A^9(1 − 27x) = 1. (2) Bala's general clause on A333564 (April 2020) says that
    a(r,s;n) = 2^(rn) Σ_{j<sn} (−1)^(sn−1+j) C(n+j,j)^r satisfies a(np^k) ≡ a(np^(k−1))
    (mod p^(3k)), with the prime range p ≥ 3 read from the entry's revision history. It
    fails at (r,s,p,n,k) = (2,1,3,1,1). The entry's own case r = s = 1 is not refuted.
    (3) Felix Huber's conjecture that a(k) = 0 exactly for k in {2, 4, 8, 13} ∪ {3^j} ∪
    {5·3^j} (A382407) fails at k = 10; the package also proves a(k) = 0 for every k in
    the amended set, by a mod 3 descent adapted from Huang and Sun. (4) The conjecture
    on A399793 that the largest bad subset of {1, …, n} has the size ℓ(n) of the entry's
    lower bound for n ≥ 13 fails for 13 ≤ n ≤ 17, by explicit bad sets of size ℓ(n) + 1.
    The failures in (3) and (4) are visible in the entries' own data, and (4) was noted
    publicly in September 2026. A399793 concerns balanced signings of sets of integers,
    a topic studied for dense sets by Károlyi (Integers, 2009); the entry records
    equality for n ≥ 564 and links B. Wang's note on large n. The audience is number
    theorists who study Dwork- and Lucas-type congruences for hypergeometric terms and
    Bala's congruence conjectures, several of which have been proved in recent notes
    (for example Kallat, arXiv:2607.18313 and arXiv:2609.07238), and combinatorial
    number theorists who work on balanced subset sums. Searches in November 2026 found
    no earlier refutation of (1) or (2).
  authors:
    - "Wentao Li"
  responsible_maintainers:
    - "Wentao Li"
  license: "Apache-2.0"

sources:
  - title: "OEIS A333564"
    authors:
      - "Peter Bala"
    id: "https://oeis.org/A333564"
    type: "web discussion"
    location: "entry of April 7, 2020, comments; revisions 2, 3 and 24"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      States the conjecture for a(n) = [x^n](c(x)/c(−x))^n and, more generally, for
      a(r,s;n) with integer r and positive integer s, 'the same congruences'. The
      revision history fixes the modulus as p^(3k) and the primes as p ≥ 3. The package
      refutes the general clause with the witness r = 2, s = 1, p = 3, n = k = 1 (5436 ≢
      0 mod 27); it does not refute a Gauss-congruence reading mod p^k. Searches in
      November 2026 found no earlier refutation.
  - title: "OEIS A034171"
    authors:
      - "Peter Bala"
    id: "https://oeis.org/A034171"
    type: "web discussion"
    location: "comment of December 23, 2019"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Conjectures c(pn) ≡ c(n) (mod p²) for primes p ≡ 1 (mod 3) and n ≥ 1 outside an
      explicit finite exception set, with c(n) = A034171(n − 1). The package refutes it
      at p = 7, n = 50. Searches in November 2026 found no earlier refutation.
  - title: "OEIS A298799"
    authors:
      - "Peter Bala"
    id: "https://oeis.org/A298799"
    type: "web discussion"
    location: "comment of December 23, 2019"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      The same conjecture for the expansion of (1 − 27x)^(−1/9) with primes p ≡ 1 (mod
      9). The package refutes it at p = 19, n = 362.
  - title: "OEIS A382407"
    authors:
      - "Felix Huber"
    id: "https://oeis.org/A382407"
    type: "web discussion"
    location: "entry of April 4, 2025, comments"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Conjectures that a(k) = 0 iff k ∈ {2, 4, 8, 13} ∪ A000244 ∪ A005030. The entry's
      own data show a(10) = 0, which refutes it; the package proves this and the 'if'
      direction for the set with 10 added.
  - title: "OEIS A399793"
    authors:
      - "Yifan Xie"
    id: "https://oeis.org/A399793"
    type: "web discussion"
    location: "entry of September 12, 2026"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Defines a(n), the largest size of a bad subset of {1, …, n}. It gives the lower
      bound ℓ(n), states that equality holds for n ≥ 564, and conjectures equality for n
      ≥ 13. Its data give a(13), …, a(17) = 7, 7, 7, 8, 8, while ℓ(n) = 6, 6, 6, 7, 7.
      The package proves a(n) > ℓ(n) for 13 ≤ n ≤ 17 with explicit bad sets of size ℓ(n)
      + 1; it does not prove a(n) ≤ ℓ(n) + 1. The failure was also noted publicly,
      without witnesses, in a research log of September 18, 2026
      (github.com/farev/Matematica, log/2026-09-18-leech-tree-labelling.md).
  - title: "The best possible result of 2021 China National High School Mathematics League Second Round Problem 4 for sufficiently large n (in Chinese)"
    authors:
      - "Bingyuan Wang"
    id: "http://www.nsmath.cn/filedownload/539123"
    type: "other"
    location: "New Star Students' Column; linked from OEIS A399793"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Linked from A399793, which records that equality a(n) = ℓ(n) holds for n ≥ 564.
      Cited for context; the package does not use it.
  - title: "Balanced Subset Sums in Dense Sets of Integers"
    authors:
      - "Gyula Károlyi"
    id: "https://doi.org/10.1515/integ.2009.047"
    type: "paper"
    location: "Integers 9 (2009), no. 5"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Studies balanced subset sums in dense sets of integers, the setting of A399793's
      good and bad sets. Cited for context; the package does not use it.
  - title: "On partitions of integers with restrictions involving squares"
    authors:
      - "Chao Huang"
      - "Zhi-Wei Sun"
    id: "https://arxiv.org/abs/2105.03416"
    type: "paper"
    location: "arXiv:2105.03416 (2021)"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Proves Sun's conjecture on writing n = x + y + z with positive integers x, y, z
      and x² + y² + z² a square. It does not treat xy + yz + zx. The package adapts its
      mod 3 descent to the 'if' direction for A382407.
  - title: "A Proof of Bala's Congruence Conjecture for A028342"
    authors:
      - "Ahaan Kallat"
    id: "https://arxiv.org/abs/2607.18313"
    type: "paper"
    location: "arXiv:2607.18313 (2026)"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Proves one of Bala's OEIS congruence conjectures. Cited as evidence that such
      conjectures are studied; it does not treat the sequences of this package.
  - title: "A Proof of Bala's Congruence Conjectures for A158690"
    authors:
      - "Ahaan Kallat"
    id: "https://arxiv.org/abs/2609.07238"
    type: "paper"
    location: "arXiv:2609.07238 (2026)"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Proves two of Bala's OEIS congruence conjectures. Cited as context; it does not
      treat the sequences of this package.

