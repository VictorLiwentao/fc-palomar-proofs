      models:
        - "claude-opus-5-5"
      framework: "Claude Code"
      tool_setup: >-
        Claude Code (Anthropic) found the witnesses, wrote the Lean formalization and
        prepared this package under the direction of Wentao Li, with independent agent
        review of the statements against their sources. Wentao Li is the human author
        and maintainer.
  spend_usd: "not available"
  notes: >-
    AI assistance was material. The conjectures are due to Peter Bala, Felix Huber and
    Yifan Xie. The witnesses for A333564, A034171 and A298799 are new as far as the
    searches found; those for A382407 and A399793 are in the entries' data. Wentao Li is
    the human author of this package.

fidelity:
  divergences: >-
    Each conjecture is stated from its entry and negated. A333564: the modulus p^(3k)
    and primes p ≥ 3 are read from the revision history, and r ranges over natural
    numbers r ≥ 1, a special case of Bala's integer r, so its failure refutes his
    clause. A034171: Bala's offset 1 is used, as his comment states. A298799: the
    entry's offset 0 is used, since Bala's comment there names no other offset. Both
    sequences are rational-valued with integer values, and a congruence mod p² is
    written as divisibility of the difference by p² in ℤ; A298799 is defined by A(0) = 1
    and A^9(1 − 27x) = 1, shown to have a unique solution. A382407: stated for k ≥ 1.
    A399793: a(n) is the supremum of the sizes of bad subsets. The statements were
    written for this package. They are proposed for Formal Conjectures, one file per
    entry (FormalConjectures/OEIS/333564.lean, 34171.lean, 298799.lean, 382407.lean and
    399793.lean); none of these files exists upstream yet.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    Checks by AI agents only: a strict build with no warnings, an axiom check of the
    selected theorems, a check that the Challenge declarations appear verbatim in
    Solution, and a review of the statement against its source by a separate agent. No
    independent human review is claimed.

alignment:
  namespace: "OeisDisproofs"
  statements:
    - source: >-
        A333564 (Bala): for integer r and positive integer s, a(r,s;n) satisfies a(np^k)
        ≡ a(np^(k−1)) (mod p^(3k)) for primes p ≥ 3 and n, k ≥ 1. Refuted at (r,s,p,n,k)
        = (2,1,3,1,1), stated for r ≥ 1.
      lean: "OeisDisproofs.not_conj333564"
      module: "FCPalomar.OeisDisproofs.Solution"
      status: "proved"
    - source: >-
        A034171 (Bala, offset 1): a(pn) ≡ a(n) (mod p²) for primes p ≡ 1 (mod 3) and n ≥
        1 outside {mp + k : 0 ≤ m ≤ (p−1)/3, 1 ≤ k ≤ (p−1)/3}. Refuted at p = 7, n = 50.
      lean: "OeisDisproofs.not_conj034171"
      module: "FCPalomar.OeisDisproofs.Solution"
      status: "proved"
    - source: >-
        A298799 is the expansion of (1 − 27x)^(−1/9): the unique power series over ℚ
        with constant term 1 and A^9(1 − 27x) = 1.
      lean: "OeisDisproofs.existsUnique_isGF298799"
      module: "FCPalomar.OeisDisproofs.Solution"
      status: "proved"
    - source: >-
        A298799 (Bala, the entry's offset 0): a(pn) ≡ a(n) (mod p²) for primes p ≡ 1
        (mod 9) and n ≥ 1 outside {mp + k : 0 ≤ m ≤ (p−1)/9, 1 ≤ k ≤ (p−1)/9}. Refuted
        at p = 19, n = 362.
      lean: "OeisDisproofs.not_conj298799"
      module: "FCPalomar.OeisDisproofs.Solution"
      status: "proved"
    - source: >-
        A382407 (Huber): for k ≥ 1, a(k) = 0 if and only if k ∈ {2, 4, 8, 13} ∪ {3^j} ∪
        {5·3^j}. Refuted at k = 10.
      lean: "OeisDisproofs.not_conj382407"
      module: "FCPalomar.OeisDisproofs.Solution"
      status: "proved"
    - source: >-
        Not in the source: a(k) = 0 for every k in {2, 4, 8, 10, 13} ∪ {3^j} ∪ {5·3^j},
        the 'if' direction of the amended set.
      lean: "OeisDisproofs.a382407_eq_zero_of_mem"
      module: "FCPalomar.OeisDisproofs.Solution"
      status: "proved"
    - source: >-
        Not in the source as a theorem: a(n) > ℓ(n) for 13 ≤ n ≤ 17, where ℓ(n) is the
        entry's lower bound.
      lean: "OeisDisproofs.ell399793_lt_a399793"
      module: "FCPalomar.OeisDisproofs.Solution"
      status: "proved"
    - source: >-
        A399793: a(n) = ℓ(n) for every n ≥ 13. Refuted at n = 13.
      lean: "OeisDisproofs.not_conj399793"
      module: "FCPalomar.OeisDisproofs.Solution"
      status: "proved"
