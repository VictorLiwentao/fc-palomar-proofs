fidelity:
  divergences: >-
    None. The statement is new: it was written for this package from the source and is
    proposed for Formal Conjectures as FormalConjectures/OEIS/364111.lean with the same
    declarations. The Challenge leaves out only the FormalConjecturesUtil import,
    attributes, test lemmas and unrelated declarations of that file.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    Checks by AI agents only: a strict build with no warnings, an axiom check of the
    selected theorems, a check that the Challenge declarations appear verbatim in
    Solution, and a review of the statement against its source by a separate agent. No
    independent human review is claimed.

alignment:
  namespace: "OeisA364111"
  statements:
    - source: >-
        More generally, let A >= 2, B and C be positive integers. Then the sequence
        Sum_{k = 0..n} binomial(n+k-1,k)^A * binomial(2*n-2*k,n-k)^B * binomial(2*k,k)^C
        also satisfies the supercongruences u(n p^r) ≡ u(n p^(r-1)) (mod p^(3r)) for all
        primes p >= 5 and positive integers n and r (conjecture, comments).
      lean: "OeisA364111.u_supercongruence"
      module: "FCPalomar.OeisA364111.Solution"
      status: "proved"
    - source: >-
        a(n) = Sum_{k = 0..n} binomial(n+k-1,k)^2 * binomial(2*n-2*k,n-k) *
        binomial(2*k,k) satisfies a(n p^r) ≡ a(n p^(r-1)) (mod p^(3r)) for all primes p
        >= 5 and positive integers n and r (conjecture, comments).
      lean: "OeisA364111.a_supercongruence"
      module: "FCPalomar.OeisA364111.Solution"
      status: "proved"
