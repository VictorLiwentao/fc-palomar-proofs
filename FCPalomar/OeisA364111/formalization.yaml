version: "v0.4"

project:
  name: "OEIS A364111: Bala's p^(3r) supercongruences"
  description: >-
    For integers A ≥ 2 and B, C ≥ 1 let u(N) = Σ_{k=0}^{N} C(N+k−1, k)^A C(2N−2k, N−k)^B
    C(2k, k)^C. The package proves that u(np^r) ≡ u(np^{r−1}) (mod p^{3r}) for every
    prime p ≥ 5 and all n, r ≥ 1, as conjectured by Peter Bala (OEIS A364111, 2023), and
    the case (A, B, C) = (2, 1, 1), which is A364111 itself. The proof uses Coster's
    method, as Osburn and Sahu did for the generalized Domb numbers.
  authors:
    - "Wentao Li"
  responsible_maintainers:
    - "Wentao Li"
  license: "Apache-2.0"

sources:
  - title: "OEIS A364111"
    authors:
      - "Peter Bala"
    id: "https://oeis.org/A364111"
    type: "web discussion"
    location: "entry of July 7, 2023, comments"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Defines a(n) and conjectures the p^(3r) supercongruences for it and for the
      general (A, B, C) family. Searches in November 2026 (the OEIS entry and its
      revision history, arXiv, Zenodo, GitHub issues, pull requests and code, and public
      Lean and OEIS-proof result repositories) found no earlier written proof. The proof
      in this package is credited to Wentao Li.
  - title: "A supercongruence for generalized Domb numbers"
    authors:
      - "Robert Osburn"
      - "Brundaban Sahu"
    id: "https://arxiv.org/abs/1201.6195"
    type: "paper"
    location: "Funct. Approx. Comment. Math. 48 (2013), 29–36"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Proves the same supercongruences for the generalized Domb numbers, which have C(N,
      k)^A in place of C(N+k−1, k)^A, by Coster's method. The proof here adapts their
      argument to Bala's sums.
  - title: "Supercongruences"
    authors:
      - "M. J. Coster"
    type: "book"
    location: "PhD thesis, Universiteit Leiden, 1988"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      The source of the product expansion and the harmonic-sum congruences that the
      proof uses.

