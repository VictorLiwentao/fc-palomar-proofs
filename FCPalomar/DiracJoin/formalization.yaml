version: "v0.4"

project:
  name: "Dirac's joins of odd cycles: Erdős Problems 917 (Dirac, Erdős 3 | k) and 1032 (Dirac 6-critical)"
  description: >-
    The join of q disjoint odd cycles C_m is 3q-critical. This gives Dirac's lower bound
    f_6(4n+2) >= 4n^2+8n+3 (Erdős 917), Erdős's observation f_k(n) >= ½(1 − 1/(k/3))n^2
    + n for 3 | k (Erdős 917), and Dirac's 6-critical graphs with minimum degree > n/2
    (Erdős 1032).
  authors:
    - "Wentao Li"
  responsible_maintainers:
    - "Wentao Li"
  license: "Apache-2.0"

sources:
  - title: "A property of 4-chromatic graphs and some remarks on critical graphs"
    authors:
      - "G. A. Dirac"
    id: "doi:10.1112/jlms/s1-27.1.85"
    type: "paper"
    location: "J. London Math. Soc. 27 (1952) 85-92"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Joins of two odd cycles are 6-critical.
  - title: "Problems and results in chromatic graph theory"
    authors:
      - "Paul Erdős"
    id: "Proof Techniques in Graph Theory (1969) 27-35"
    type: "paper"
    location: "p. 28"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      The general join of k/3 odd cycles.

related_formalizations:
  - title: "Formal Conjectures: FormalConjectures/ErdosProblems/917.lean"
    authors:
      - "The Formal Conjectures Authors"
    id: "https://github.com/google-deepmind/formal-conjectures/blob/691719db2653905d5fa0775408370fb058e4c59f/FormalConjectures/ErdosProblems/917.lean"
    relationship: "builds-on"
    note: >-
      The Challenge copies the statement and the definitions it uses verbatim from this
      file at commit 691719db. The upstream declaration is `sorry` at that commit.

