    authors:
      - "The Formal Conjectures Authors"
    id: "https://github.com/google-deepmind/formal-conjectures/blob/691719db2653905d5fa0775408370fb058e4c59f/FormalConjectures/ErdosProblems/917.lean"
    relationship: "builds-on"
    note: >-
      The Challenge copies IsKCritical, f, conjecturedValue and the statements of
      erdos_917.variants.dirac and erdos_917.variants.erdos_three_dvd verbatim from this
      file at commit 691719db. The upstream declarations are `sorry` at that commit.
  - title: "Formal Conjectures: FormalConjectures/ErdosProblems/1032.lean"
    authors:
      - "The Formal Conjectures Authors"
    id: "https://github.com/google-deepmind/formal-conjectures/blob/691719db2653905d5fa0775408370fb058e4c59f/FormalConjectures/ErdosProblems/1032.lean"
    relationship: "builds-on"
    note: >-
      The Challenge copies erdos_1032.variants.dirac_six and Erdos1032.IsKCritical
      verbatim from this file at commit 691719db, without their docstrings. The upstream
      declaration is `sorry` at that commit.
  - title: "Formal Conjectures: FormalConjecturesForMathlib/Combinatorics/SimpleGraph/Coloring/Vertex.lean"
    authors:
      - "The Formal Conjectures Authors"
    id: "https://github.com/google-deepmind/formal-conjectures/blob/691719db2653905d5fa0775408370fb058e4c59f/FormalConjecturesForMathlib/Combinatorics/SimpleGraph/Coloring/Vertex.lean"
    relationship: "builds-on"
    note: >-
      The Challenge copies IsCriticalEdges, IsCriticalEdge, Subgraph.IsCriticalVerts,
      Subgraph.IsCriticalVertex, IsCritical and the lemmas
      lt_chromaticNumber_iff_not_colorable and le_chromaticNumber_iff_not_colorable
      verbatim from this file at commit 691719db.
  - title: "TheJustinSunPrize/awards PR #358 (baobingzhang, JSP-000761)"
    authors:
      - "baobingzhang"
    id: "https://github.com/TheJustinSunPrize/awards/pull/358"
    relationship: "independent"
    note: >-
      An earlier Lean 4.34 proof of Dirac's join and the f(3r)(r(2n+1)) bound, with
      criticality defined by edges only; the Formal Conjectures IsKCritical also
      requires vertex-criticality, and erdos_1032.variants.dirac_six is not stated
      there. Its source repository is no longer public. This package was developed
      independently.

