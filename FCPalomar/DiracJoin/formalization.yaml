automation:
  methods:
    - method: "agent"
      models:
        - "claude-opus-5-5"
      framework: "Claude Code"
      tool_setup: >-
        Claude Code (Anthropic) wrote the Lean proof and this package under the
        direction of Wentao Li, with independent agent review of the statement against
        its source. Wentao Li is the human author and maintainer.
  spend_usd: "not available"
  notes: >-
    AI assistance was material. The mathematics is credited to the original authors
    listed under sources.

fidelity:
  divergences: >-
    None. The Challenge copies the Formal Conjectures statements and definitions
    verbatim. It omits the FormalConjecturesUtil import, attributes, the upstream
    reference lists, unrelated declarations, and the docstrings of Erdos1032.IsKCritical
    and erdos_1032.variants.dirac_six. It keeps two copied API lemmas
    (lt_chromaticNumber_iff_not_colorable, le_chromaticNumber_iff_not_colorable) with
    their proofs.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    Checks by AI agents only: a strict build with no warnings, an axiom check of the
    selected theorems, a check that the Challenge declarations appear verbatim in
    Solution, and a review of the statement against its source by a separate agent. No
    independent human review is claimed.

alignment:
  namespace: "Erdos917"
  statements:
    - source: >-
        For n >= 1, f_6(4n+2) >= 4n^2+8n+3 (two copies of C_{2n+1}, fully joined).
      lean: "Erdos917.erdos_917.variants.dirac"
      module: "FCPalomar.DiracJoin.Solution"
      status: "proved"
    - source: >-
        If k >= 3, 3 | k, m is odd and m >= 3, then f_k(mk/3) >= ½(1 − 1/(k/3))(mk/3)^2
        + mk/3 (join of k/3 copies of C_m).
      lean: "Erdos917.erdos_917.variants.erdos_three_dvd"
      module: "FCPalomar.DiracJoin.Solution"
      status: "proved"
    - source: >-
        For infinitely many n there is a 6-critical graph on n vertices with minimum
        degree > n/2 (join of two copies of C_{n/2}, n/2 odd).
      lean: "Erdos1032.erdos_1032.variants.dirac_six"
      module: "FCPalomar.DiracJoin.Solution"
      status: "proved"
