        A is determined by A_k and |A| if a prime p > k divides |A|, and if k = 4 and
        |A| > 12.
      lean: "Erdos494.erdos_494.variants.card_divisible_by_prime_gt_k"
      module: "FCPalomar.Erdos494.Solution"
      status: "proved"
    - source: >-
