version: "v0.4"

project:
  name: "Erdős Problem 494: Selfridge–Straus, A is determined by its k-sums when |A| has a prime factor p > k, and when k = 4, |A| > 12"
  description: >-
    For a finite set A of complex numbers, the multiset of k-element subset sums
    together with |A| determines A when |A| is divisible by a prime p > k, and when k =
    4 and |A| > 12 (Selfridge–Straus 1958).
  authors:
    - "Wentao Li"
  responsible_maintainers:
    - "Wentao Li"
  license: "Apache-2.0"

sources:
  - title: "On the determination of numbers by their sums of a fixed order"
    authors:
      - "J. L. Selfridge"
      - "E. G. Straus"
    id: "doi:10.2140/pjm.1958.8.847"
    type: "paper"
    location: "Pacific J. Math. 8 (1958) 847-856"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      The leading-coefficient argument via exponential power sums and Newton's
      identities; Lucas' theorem for p > k, and an arithmetic analysis of the k = 4
      coefficient.

related_formalizations:
  - title: "Formal Conjectures: FormalConjectures/ErdosProblems/494.lean"
    authors:
      - "The Formal Conjectures Authors"
    id: "https://github.com/google-deepmind/formal-conjectures/blob/691719db2653905d5fa0775408370fb058e4c59f/FormalConjectures/ErdosProblems/494.lean"
    relationship: "builds-on"
    note: >-
      The Challenge copies the statement and the definitions it uses verbatim from this
      file at commit 691719db. The upstream declaration is `sorry` at that commit.
  - title: "linrock/math-proofs: erdos-494"
    authors:
      - "Linmiao Xu"
    id: "https://github.com/linrock/math-proofs/tree/main/erdos-494"
    relationship: "adapts"
    note: >-
      The lemmas e494_newton, e494_esymm_eq and e494_eq_of_esymm are adapted from this
      Apache-2.0 package; the copyright line is kept in Solution.lean.

classification:
  arxiv:
    - "math.NT"
    - "math.CO"
  msc2020:
    - "11B75"
    - "05A15"

