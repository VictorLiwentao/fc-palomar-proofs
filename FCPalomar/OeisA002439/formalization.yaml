version: "v0.4"

project:
  name: "OEIS A002439: Bala's conjectures for sin 2x / (2 cos 3x)"
  description: >-
    Let a(n) = (2n+1)! [x^(2n+1)] sin 2x / (2 cos 3x) (OEIS A002439, Glaisher's T
    numbers: 1, 23, 1681, 257543, …; Glaisher, 1899). Up to a sign and a factor 1/2,
    a(n) is the value at −2n − 1 of the Dirichlet L-function of the real character χ₁₂
    modulo 12, so these are congruences for values of Dirichlet L-functions. In 2021
    Peter Bala conjectured six families of congruences for a(n) and stated the formula
    a(n) ≡ 23^n (mod 1152). The package proves his power congruences 3)–5): a(mn) ≡
    a(m)^n modulo 2^(2v₂(m)+7) and modulo 3^(2v₃(m)+2); a(2mn) ≡ a(n)^(2m) and
    a((2m+1)n) ≡ a(n)^(2m+1) modulo 2^(v₂(m)+7); a(3mn) ≡ a(n)^(3m) and a((3m+1)n) ≡
    a(n)^(3m+1) modulo 3^(v₃(m)+2), and even modulo 3^(v₃(m)+3); and a((3m+2)n) ≡
    a(n)^(3m+2) modulo 9. It proves the formula a(n) ≡ 23^n (mod 1152). It refutes
    conjecture 6) and determines exactly when it holds: for a prime p ≥ 5, h = (p − 1)/2
    and m, n ≥ 1, a(hnm) ≡ a(hn)^m (mod p^(v_p(m−1)+1)) holds if and only if v_p(m − 1)
    ≤ (p − 1)n. For example, at p = 5, n = 1 and m = 3126 = 1 + 5^5, a(6252) ≡ (1 +
    5^5)·a(2) (mod 5^6), so a(6252) − a(2)^3126 has 5-adic valuation exactly 5 instead
    of 6; this is proved by hand, without computing a(6252). Behind this is the
    congruence a(n + h·p^(e−1)) ≡ (−1)^h (1 − χ₁₂(p)·p^(2n+1)) a(n) (mod p^e) for every
    prime p ≥ 5, e ≥ 1 and every n, which the package proves from an elementary
    alternating-sum formula. It is the classical Kummer congruence for these L-values,
    from the theory of p-adic measures attached to Dirichlet characters that Blanco
    Gómez's Remark 5 names, and 1 − χ₁₂(p)p^(2n+1) is its Euler factor. When 2n + 1 ≥ e
    it reduces to the antiperiod a(n + h·p^(e−1)) ≡ (−1)^h a(n) (mod p^e), a case of
    Blanco Gómez's Theorem 1 on the values b^r E_r(a/b) of the Euler polynomials (Zenodo
    23407292), and the "if" direction for 6) is a short corollary of it. At p = 3 the
    package proves a(n + 3^(e−1)) ≡ −a(n) (mod 3^e) for every n. No earlier treatment of
    the power congruences 3)–5), of the formula modulo 1152, or of the failure of 6) and
    its exact range was found. The power congruences carry the main new argument; the
    exact range of 6) is a short consequence of the classical congruence above. Bala's
    congruence conjectures for exponential generating functions are recent targets in
    the study of congruences for Euler-type numbers and for values of Dirichlet
    L-functions: Kallat proved Bala's conjectures for A158690 (arXiv:2609.07238).
    Conjectures 1) and 2) for A002439 follow from Kallat's Theorem 2.6 and Bala's
    hypergeometric e.g.f., which comes from Zagier's strange identity; they are not part
    of this package.
  authors:
    - "Wentao Li"
  responsible_maintainers:
    - "Wentao Li"
  license: "Apache-2.0"

sources:
  - title: "OEIS A002439"
    authors:
      - "N. J. A. Sloane"
      - "Peter Bala"
    id: "https://oeis.org/A002439"
    type: "web discussion"
    location: "entry by N. J. A. Sloane; conjectures 1)–6) in Peter Bala's comment of December 18, 2021; the formula a(n) ≡ 23^n (mod 2^7·3^2) in his comment of December 25, 2021"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Bala's conjectures 3)–5) are power congruences modulo powers of 2 and 3, and 6) is
      a power congruence modulo powers of a prime p ≥ 5. The formula modulo 1152 is not
      marked as proved. Searches in November 2026 (the OEIS entry, arXiv, Zenodo, GitHub
      issues, pull requests and code, and public Lean and OEIS-proof result
      repositories) found no earlier proof or refutation of 3)–6) or of the formula. The
      proofs, the refutation of 6) and its corrected form are credited to Wentao Li; the
      odd-prime congruences used for 6) are of classical Kummer type, and for p ≥ 5 and
      2n + 1 ≥ e they are a case of Blanco Gómez's Theorem 1. Conjectures 1) and 2) are
      not part of this package (see Kallat).
  - title: "Kummer congruences for the values b^r E_r(a/b) of the Euler polynomials at rational points, and the towers a(np^k) ≡ ±a(np^(k-1)) (mod p^k) for the tangent, Euler, zigzag and Springer numbers"
    authors:
      - "Roberto Blanco Gómez"
    id: "https://zenodo.org/records/23407292"
    type: "paper"
    location: "Theorem 1 at a/b = 1/6; first posted as Zenodo 23404924 (October 15, 2026)"
    relationship: "independently-proves"
    author_endorsement: "not-contacted"
    note: >-
      Its Theorem 1: for an odd prime p ∤ b, the numbers s_r = b^r E_r(a/b) satisfy s_r
      ≡ s_r' (mod p^k) whenever r ≡ r' (mod (p − 1)p^(k−1)) and r, r' ≥ k. With the
      entry's formula a(n) = −(−4)^n 3^(2n+1) E_(2n+1)(1/6), that is a(n) = (−1)^(n+1)
      s_(2n+1)/2 for b = 6, and r = 2n + 1, k = e, it gives antiperiod_odd_prime_pow for
      every prime p ≥ 5, including the bound 2n + 1 ≥ e, and so the case 2n + 1 ≥ e of
      antiperiod_euler. The case p = 3 is not covered, since 3 divides b = 6. The "if"
      direction of conjecture6_iff (conjecture6_of_le) is a short corollary. Its Remark
      5 notes that Theorem 1 is a special case of the theory of p-adic measures attached
      to Dirichlet characters, and its Section 5 notes that the bound r, r' ≥ k cannot
      be dropped in general; for A002439 the Euler factor in antiperiod_euler is what
      happens below the bound, and it gives the failure of 6). It does not mention
      A002439 and does not treat conjectures 3)–6) or the formula modulo 1152.
  - title: "A Proof of Bala's Congruence Conjectures for A158690"
    authors:
      - "Ahaan Kallat"
    id: "https://arxiv.org/abs/2609.07238"
    type: "paper"
    location: "Theorem 2.6 (arXiv v1, September 7, 2026)"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Its Theorem 2.6 shows, for G ∈ ℤ[[y]] and the coefficients b(n) of G(e^t − 1),
      that (1) λ(k) is an eventual period of b(n) modulo every k ≥ 2, and (2) b(np^r +
      i) ≡ b(np^(r−1) + i) (mod p^r) for every i ≥ 0, prime p and n, r ≥ 1. Bala's OEIS
      formula Σ a(n) t^n/n! = exp(−t) Σ_n Π_(k=1..n) (1 − exp(−24kt)) (from Zagier's
      strange identity) puts A002439 in this class: with y = e^t − 1, exp(−t) = (1 +
      y)^(−1) and 1 − exp(−24kt) = 1 − (1 + y)^(−24k) lie in ℤ[[y]]. So (1) gives Bala's
      conjecture 1), since λ(k) divides φ(k), and (2) gives his conjecture 2). They are
      not part of this package. The paper does not mention A002439 and does not treat
      the power congruences 3)–6).
  - title: "Vassiliev invariants and a strange identity related to the Dedekind eta-function"
    authors:
      - "Don Zagier"
    id: "https://doi.org/10.1016/S0040-9383(00)00005-7"
    type: "paper"
    location: "Topology 40 (2001), no. 5, 945–960"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      The strange identity behind Bala's hypergeometric e.g.f. for A002439; used only in
      the note on conjectures 1) and 2), which are not part of this package.
  - title: "On a Set of Coefficients analogous to the Eulerian Numbers"
    authors:
      - "J. W. L. Glaisher"
    id: "https://doi.org/10.1112/plms/s1-31.1.216"
    type: "paper"
    location: "Proc. London Math. Soc. 31 (1899), 216–235"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      The origin of the sequence (Glaisher's T numbers). It does not treat Bala's
      conjectures.

