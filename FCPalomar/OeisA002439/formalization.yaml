automation:
  methods:
    - method: "agent"
      models:
        - "claude-opus-5-5"
      framework: "Claude Code"
      tool_setup: >-
        Claude Code (Anthropic) developed the proof, wrote the Lean formalization and
        prepared this package under the direction of Wentao Li, with independent agent
        review of the proof and of the statement against its source. Wentao Li is the
        human author and maintainer.
  spend_usd: "not available"
  notes: >-
    AI assistance was material, including in developing the proof. The conjectures are
    due to Peter Bala (OEIS A002439). Over ℂ, x ↦ ix turns the e.g.f. into G = sinh x /
    (2 cosh 2x − 1) up to signs. For an odd modulus P, e^(6Px) = 1 over ℤ/P, which gives
    the exact formula 4G_M ≡ Σ_(x<P) (−1)^x ((5 + 6x)^M − (1 + 6x)^M) (mod P). Euler's
    theorem then gives the antiperiod (known for p ≥ 5 from Blanco Gómez) and the
    corrected conjecture 6). At P = p^e with p ≥ 5, only the bases divisible by p
    survive in G_(M+φ(p^e)) − G_M, and they reduce to the formula at P = p^(e−1); this
    gives the Euler factor 1 − χ₁₂(p)p^M and with it the exact range of 6). The
    refutation runs the same argument at p = 5, e = 6 and M = 5, so a(6252) is never
    computed. At p = 3 no base is divisible by 3, so the antiperiod holds for every n.
    For conjectures 3)–5), let b(n) = a(n)/23^n. The Newton coefficients f_k of a
    satisfy 2^(3k) | 2f_k (from a representation 2G_M = Σ Q_i (2i + 1)^M) and 3^k | f_k
    (from the odd-modulus formula), and f_2 = 1152; this gives the formula modulo 1152.
    The power map z ↦ z^(p^K) in ℤ_p (p = 2, 3), Newton's formula and the divisibility
    of l!(C(xy, l) − y·C(x, l)) by x²y(y − 1) give a(xy) ≡ a(x)^y modulo 2^(K+6) or
    3^(K+2) when p^K divides x²y(y − 1), with square-root steps at 2 and cube-root steps
    at 3. No p-adic logarithm is used. The Solution's module docstring gives the full
    account. Wentao Li is the human author of this package's proof.

fidelity:
  divergences: >-
    Conjectures 3)–6) do not state the range of m and n; the package takes m, n ≥ 1, and
    m ≥ 0 for 5)(iii), whose modulus does not depend on m (m = 0 gives a(2n) ≡ a(n)^2
    mod 9). v_p(m) is written m.factorization p, so v_p(0) = 0 and the case m = 1 of 6)
    is the identity; the 5-adic valuation of an integer is padicValInt 5. Conjecture 6)
    is read literally, for every prime p ≥ 5 and all m, n ≥ 1; not_conjecture6 negates
    exactly that. a(n) is defined through power series over ℚ with sin 2x as rescale 2
    (sin ℚ) and cos 3x as rescale 3 (cos ℚ); the Solution checks a(0..3) = 1, 23, 1681,
    257543 against the OEIS data. chi12 is defined on all natural numbers by the residue
    modulo 12; it is used only at primes p ≥ 5, where it is the character χ₁₂.
    Integrality, the witness of the refutation, the exact range of 6), the odd-prime
    congruences and the strengthening of 5) are added. The statements were written for
    this package from the OEIS entry and are proposed for Formal Conjectures as
    FormalConjectures/OEIS/2439.lean, which does not exist upstream yet. Conjectures 1)
    and 2) are not part of the package.

