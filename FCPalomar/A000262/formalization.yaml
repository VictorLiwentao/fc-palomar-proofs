    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "OeisA262.bala_theorem1"
      file: "FCPalomar/A000262/Solution.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      comparator_config: "FCPalomar/A000262/comparator.json"
