version: "v0.4"

project:
  name: "OEIS A000262 and A082579: Bala's Theorem 1 (periodicity modulo every k)"
  description: >-
    If Σ a(n) x^n/n! = F(x) exp(x G(x)) with F, G integer power series and G(0) = 1,
    then a(n+k) ≡ a(n) (mod k) for all n, k (Bala 2017, Theorem 1). Hence A000262
    (exp(x/(1−x))) and A082579 (exp(x/(1−x)^2)) satisfy k | a(n+k) − a(n) for k >= 2.
  authors:
    - "Wentao Li"
  responsible_maintainers:
    - "Wentao Li"
  license: "Apache-2.0"

sources:
  - title: "Integer sequences that become periodic on reduction modulo k for all k"
    authors:
      - "Peter Bala"
    id: "https://oeis.org/A047974/a047974_1.pdf"
    type: "other"
    location: "Theorem 1 and Lemma 1 (Dec 03 2017)"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      The Lean proof follows Bala's recurrence argument.

related_formalizations:
  - title: "ahaankallat/congruence-phenomena-higher-order-lean: LagrangeFamily.lagrange_type_shift"
    authors:
      - "Ahaan Kallat"
    id: "https://github.com/ahaankallat/congruence-phenomena-higher-order-lean/tree/8ca3c4250c58f47eadabd82bcd5650f3d0632d7b"
    relationship: "independent"
    note: >-
      Lean proofs (Apache-2.0, October 2026; arXiv:2610.15849) of the A000262 and
      A082579 congruences by a different route, via lagrange_type_shift with F = 1 and
      CongruenceTheory.Aw_shift_mod in ahaankallat/congruence-phenomena-lean. This
      package proves Bala's Theorem 1 for every integer power series F, which those
      repositories do not cover.

classification:
  arxiv:
    - "math.NT"
    - "math.CO"
  msc2020:
    - "11B50"
    - "05A15"

