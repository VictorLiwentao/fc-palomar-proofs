version: "v0.4"

project:
  name: "Erdős Problem 1111: Wagon's bound"
  description: >-
    Every finite graph with no clique of size t and chromatic number at least C(t,2)+1
    has two anticomplete vertex sets that each induce a graph of chromatic number at
    least 2 (Wagon 1980, as noted by El-Zahar and Erdős). In Erdős Problem 1111, d(t,c)
    is the least d such that every finite graph with clique number less than t and
    chromatic number at least d has two anticomplete vertex sets A, B with χ(G[A]) ≥ c
    and χ(G[B]) ≥ c (El-Zahar and Erdős 1985). So the result says d(t,2) ≤ C(t,2)+1. Two
    anticomplete sets that each induce a graph of chromatic number at least 2 are the
    same as an induced 2K₂.
  authors:
    - "Wentao Li"
  responsible_maintainers:
    - "Wentao Li"
  license: "Apache-2.0"

sources:
  - title: "A bound on the chromatic number of graphs without certain induced subgraphs"
    authors:
      - "Stan Wagon"
    id: "doi:10.1016/0095-8956(80)90093-3"
    type: "paper"
    location: "J. Combin. Theory Ser. B 29 (1980) 345-346"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Wagon's colouring by pairs of missed vertices of a maximum clique, for 2K2-free
      graphs.
  - title: "On the existence of two non-neighboring subgraphs in a graph"
    authors:
      - "M. El-Zahar"
      - "P. Erdős"
    id: "doi:10.1007/BF02579243"
    type: "paper"
    location: "Combinatorica 5 (1985) 295-300"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Poses the question of Erdős Problem 1111 (the function d(t,c)).
      erdosproblems.com/1111 reports that they note Wagon's theorem gives d(t,2) <=
      C(t,2)+1.
  - title: "Erdős Problem 1111"
    authors:
      - "Thomas Bloom"
    id: "https://www.erdosproblems.com/1111"
    type: "web discussion"
    location: "Problem 1111"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Records the consequence d(t,2) <= C(t,2)+1.

