version: "v0.4"

project:
  name: "OEIS A158110: exp(Σ q^(n^m) x^n/n) has integer coefficients (Hanna's conjecture, Fried 2025)"
  description: >-
    For all natural numbers q and m, exp(Σ_{n>=1} q^(n^m) x^n/n) is a power series with
    integer coefficients. Conjectured by Paul D. Hanna (2009) and proved by Sela Fried
    (2025).
  authors:
    - "Wentao Li"
  responsible_maintainers:
    - "Wentao Li"
  license: "Apache-2.0"

sources:
  - title: "OEIS A158110"
    authors:
      - "Paul D. Hanna"
    id: "https://oeis.org/A158110"
    type: "web discussion"
    location: "Conjecture comment, 2009"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      States the integrality conjecture for all nonnegative q and m.
  - title: "Proof of a conjecture stated in A158110"
    authors:
      - "Sela Fried"
    id: "https://oeis.org/A158110/a158110.pdf"
    type: "paper"
    location: "2025; also arXiv:2607.24832"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      The Lean proof keeps Fried's structure (Möbius/Euler-transform integrality
      criterion and prime-power congruences) but proves the prime-power congruence by
      one uniform argument instead of his case split.

related_formalizations: []

classification:
  arxiv:
    - "math.NT"
    - "math.CO"
  msc2020:
    - "11B83"
    - "05A15"
    - "13F25"

status:
