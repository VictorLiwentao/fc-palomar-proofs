      models:
        - "claude-opus-5-5"
      framework: "Claude Code"
      tool_setup: >-
        Claude Code (Anthropic) developed the proof, wrote the Lean formalization and
        prepared this package under the direction of Wentao Li, with independent agent
        review of the proof and of the statement against its source. Wentao Li is the
        human author and maintainer.
  spend_usd: "not available"
  notes: >-
    AI assistance was material, including in developing the proof. The conjecture is due
    to Peter Bala (OEIS A012780). The 2-adic step is a form of Y. Nishibuchi's criterion
    and the odd-prime step is the p-local form of the method of A. Kallat and R. Blanco
    Gómez. Wentao Li is the human author of this package's proof.

fidelity:
  divergences: >-
    bala_conjecture states 'eventually periodic with the period dividing φ(k)' as: there
    is N with a(n + φ(k)) ≡ a(n) (mod k) for all n ≥ N. Then φ(k) is an eventual period,
    and the least eventual period divides every eventual period, so the two readings
    agree. a(n) is defined through power series over ℚ: arcsin is its Maclaurin series,
    tan is sin · cos⁻¹, and arcsin(tan x) is the substitution arcsin.subst tan. The
    Solution checks a(0..4) = 1, 3, 45, 1743, 133305 against the OEIS data. Integrality,
    the explicit pre-periods and the mod-8 result are added. The statements were written
    for this package from the OEIS entry and are proposed for Formal Conjectures as
    FormalConjectures/OEIS/12780.lean, which does not exist upstream yet.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    Checks by AI agents only: a strict build with no warnings, an axiom check of the
    selected theorems, a check that the Challenge declarations appear verbatim in
    Solution, and a review of the statement against its source by a separate agent. No
    independent human review is claimed.

alignment:
  namespace: "OeisA012780"
  statements:
    - source: >-
        Conjecture: the sequence {a(n)} reduced modulo a positive integer k is
        eventually periodic with the period dividing phi(k) (Peter Bala, Feb 15 2026).
        The Lean statement also gives integrality: every a(n) is an integer, as the OEIS
        data show.
      lean: "OeisA012780.bala_conjecture"
      module: "FCPalomar.OeisA012780.Solution"
      status: "proved"
    - source: >-
        Not in the source. The conjecture with pre-period: a(n + φ(k)) ≡ a(n) (mod k)
        whenever 2n is at least the exponent of every odd prime in k.
      lean: "OeisA012780.bala_explicit"
      module: "FCPalomar.OeisA012780.Solution"
      status: "proved"
    - source: >-
        Not in the source. a(n + 2^(e−1)) ≡ a(n) (mod 2^e) for every e ≥ 1 and every n.
      lean: "OeisA012780.period_two_pow"
      module: "FCPalomar.OeisA012780.Solution"
      status: "proved"
    - source: >-
        Not in the source. a(n + φ(p^e)) ≡ a(n) (mod p^e) for every odd prime p, e ≥ 1
        and 2n ≥ e.
      lean: "OeisA012780.period_odd_prime_pow"
      module: "FCPalomar.OeisA012780.Solution"
      status: "proved"
    - source: >-
        Not in the source. a(n + 2) ≢ a(n) (mod 8) for every n: the shift λ(8) = 2 is
        not an eventual period, so φ(k) cannot be replaced by λ(k).
      lean: "OeisA012780.not_period_two_mod_eight"
      module: "FCPalomar.OeisA012780.Solution"
      status: "proved"
