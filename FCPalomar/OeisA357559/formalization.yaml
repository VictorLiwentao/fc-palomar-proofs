automation:
  methods:
    - method: "agent"
      models:
        - "claude-opus-5-5"
      framework: "Claude Code"
      tool_setup: >-
        Claude Code (Anthropic) developed the proof, wrote the Lean formalization and
        prepared this package under the direction of Wentao Li, with independent agent
        review of the statement against its source. Wentao Li is the human author and
        maintainer.
  spend_usd: "not available"
  notes: >-
    AI assistance was material, including in developing the proof. The conjectures are
    due to Peter Bala. An unpublished informal proof (November 2026) bounded the p-adic
    valuations of the terms, with Kummer's theorem for S_3. The Lean proof keeps its
    finite-difference and Vandermonde steps and replaces the valuation case analysis by
    polynomial identities over ℤ. Wentao Li is the human author of this package's proof.

fidelity:
  divergences: >-
    The theorems are stated for every n ≥ 0; at n = 0 both sides are 0. S_two_dvd,
    S_two_dvd_of_odd and S_three_dvd, and the extra-factor-2 forms, go beyond the
    source. The statements were written for this package. They are proposed for Formal
    Conjectures as FormalConjectures/OEIS/357559.lean, which does not exist upstream
    yet.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    Checks by AI agents only: a strict build with no warnings, an axiom check of the
    selected theorems, a check that the Challenge declarations appear verbatim in
    Solution, and a review of the statement against its source by a separate agent. No
    independent human review is claimed.

alignment:
  namespace: "OeisA357559"
  statements:
    - source: >-
        Not in the source. n^2*(n+1)^2 divides 2*S_2(n) for every n; Conjecture 1 is the
        case 2n.
      lean: "OeisA357559.S_two_dvd"
      module: "FCPalomar.OeisA357559.Solution"
      status: "proved"
    - source: >-
        Not in the source. n^2*(n+1)^2 divides S_2(n) for every odd n.
      lean: "OeisA357559.S_two_dvd_of_odd"
      module: "FCPalomar.OeisA357559.Solution"
      status: "proved"
    - source: >-
        Not in the source. n^2*(n+1)^3 divides 6*S_3(n) for every n; the formula-section
        conjecture is the case 2n.
      lean: "OeisA357559.S_three_dvd"
      module: "FCPalomar.OeisA357559.Solution"
      status: "proved"
    - source: >-
        Conjecture 1: S_2(2n) is divisible by n^2*(2n+1)^2 (A357559, comments).
      lean: "OeisA357559.conjecture_one"
      module: "FCPalomar.OeisA357559.Solution"
      status: "proved"
    - source: >-
        Not in the source. Conjecture 1 with an extra factor 2: 2*n^2*(2n+1)^2 divides
        S_2(2n).
      lean: "OeisA357559.conjecture_one_two"
      module: "FCPalomar.OeisA357559.Solution"
      status: "proved"
    - source: >-
        Conjecture: 3*a(2*n) == 0 (mod n^2*(2*n+1)^3) (A357559, formula section; a =
        S_3).
      lean: "OeisA357559.formula_conjecture"
      module: "FCPalomar.OeisA357559.Solution"
      status: "proved"
    - source: >-
        Not in the source. The formula-section conjecture with an extra factor 2:
        2*n^2*(2n+1)^3 divides 3*S_3(2n).
      lean: "OeisA357559.formula_conjecture_two"
      module: "FCPalomar.OeisA357559.Solution"
      status: "proved"
