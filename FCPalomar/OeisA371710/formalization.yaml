    relationship: "adapts"
    note: >-
      The Hurwitz-series library in the Solution (ring structure, derivative, divided
      powers and coefficient maps), the fixed-point operator and the bridge to power
      series are adapted from this package by the same author. The Challenge does not
      use them.

