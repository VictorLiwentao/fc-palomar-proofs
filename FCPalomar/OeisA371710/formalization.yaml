version: "v0.4"

project:
  name: "OEIS A371710: Hanna's mod-3 pattern"
  description: >-
    The e.g.f. A(x) = Σ a(n)xⁿ/n! of OEIS A371710 satisfies Σ_{n≥0} (A(x)^n − x)^n/n! =
    1. The package proves that exactly one A ∈ ℚ[[x]] does, that A(0) = 0 and every a(n)
    is an integer, and Paul D. Hanna's 2024 conjecture that a(6n + k) ≡ [2, 0, 2, 1, 2,
    2](k) (mod 3) for n > 0 and k = 0, …, 5. It also proves the stronger pattern a(m) ≡
    2 for even m ≥ 2 and a(m) ≡ 1 − m for odd m ≥ 3, modulo 3.
  authors:
    - "Wentao Li"
  responsible_maintainers:
    - "Wentao Li"
  license: "Apache-2.0"

sources:
  - title: "OEIS A371710"
    authors:
      - "Paul D. Hanna"
    id: "https://oeis.org/A371710"
    type: "web discussion"
    location: "entry of April 2024, comments"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Defines A(x) by Σ (A(x)^n − x)^n/n! = 1 and conjectures a(6n + k) ≡ [2, 0, 2, 1,
      2, 2](k) (mod 3) for n > 0. Searches in November 2026 (the OEIS entry, arXiv,
      Zenodo, OpenWitness, GitHub issues, pull requests and code, and public Lean and
      OEIS-proof result repositories) found no earlier proof. The proof in this package
      is credited to Wentao Li.
  - title: "the-omega-institute/trureturing issue #24628 (OEIS A386648 mod 6)"
    authors:
      - "The Omega Institute trureturing contributors"
    id: "https://github.com/the-omega-institute/trureturing/issues/24628"
    type: "web discussion"
    location: "preregistration for the sibling A386648"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Uses the same divided-power reduction for a sibling Hanna series; it does not
      treat A371710.

