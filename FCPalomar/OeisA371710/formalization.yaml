automation:
  methods:
    - method: "agent"
      models:
        - "claude-opus-5-5"
      framework: "Claude Code"
      tool_setup: >-
        Claude Code (Anthropic) developed the proof, wrote the Lean formalization and
        prepared this package under the direction of Wentao Li, with independent agent
        review of the statement against its source. Wentao Li is the human author and
        maintainer.
  spend_usd: "not available"
  notes: >-
    AI assistance was material, including in developing the proof. The conjecture is due
    to Paul D. Hanna (OEIS A371710). The divided-power reduction is classical and is
    used by trureturing issue #24628 on a sibling entry. Wentao Li is the human author
    of this package's proof.

fidelity:
  divergences: >-
    a371710_mod_three states Hanna's conjecture as written. The infinite sum is taken
    coefficientwise: for every m the coefficient of x^m of the partial sums is
    eventually that of 1; the n-th term has order at least n once A(0) = 0, which the
    package derives rather than assumes. Integrality and the stronger pattern are added.
    The statements were written for this package from the OEIS entry and are proposed
    for Formal Conjectures as FormalConjectures/OEIS/371710.lean, which does not exist
    upstream yet.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    Checks by AI agents only: a strict build with no warnings, an axiom check of the
    selected theorems, a check that the Challenge declarations appear verbatim in
    Solution, and a review of the statement against its source by a separate agent. No
    independent human review is claimed.

alignment:
  namespace: "OeisA371710"
  statements:
    - source: >-
        A371710: expansion of e.g.f. A(x) satisfying Sum_{n>=0} (A(x)^n - x)^n / n! = 1
        (name line). The Lean statement says exactly one power series over ℚ does, with
        the sum taken coefficientwise.
      lean: "OeisA371710.a371710_existsUnique"
      module: "FCPalomar.OeisA371710.Solution"
      status: "proved"
    - source: >-
        Offset 1: A(0) = 0. The Lean statement derives it from the equation.
      lean: "OeisA371710.a371710_constantCoeff"
      module: "FCPalomar.OeisA371710.Solution"
      status: "proved"
    - source: >-
        Implicit in the OEIS data (an integer sequence): every a(n) = n! [x^n] A(x) is
        an integer.
      lean: "OeisA371710.a371710_integral"
      module: "FCPalomar.OeisA371710.Solution"
      status: "proved"
    - source: >-
        Conjecture: for n > 0, a(6*n + k) == [2,0,2,1,2,2] (mod 3) at k = [0,1,2,3,4,5],
        respectively (comments).
      lean: "OeisA371710.a371710_mod_three"
      module: "FCPalomar.OeisA371710.Solution"
      status: "proved"
    - source: >-
        Not in the source. The stronger pattern a(m) ≡ 2 (mod 3) for even m ≥ 2 and a(m)
        ≡ 1 − m (mod 3) for odd m ≥ 3, which implies Hanna's.
      lean: "OeisA371710.a371710_mod_three_strong"
      module: "FCPalomar.OeisA371710.Solution"
      status: "proved"
