        Not in the sources in this generality. For a, b ≥ 1, m = a + b and p ≥ 5 prime
        with p ∤ abm, u_{r,s}(np^k) ≡ u_{r,s}(np^(k−1)) (mod p^(3k)) for u_{r,s}(N) =
        [x^(rN)] f(x)^(sN), all r ≥ 1, s ∈ ℤ, n, k ≥ 1.
      lean: "OeisA372211.u_tower"
      module: "FCPalomar.OeisA372211.Solution"
      status: "proved"
    - source: >-
        More generally, for positive integers a and b, the sequence [x^n] ((1 -
        x^m)^m/((1 - x^a)^a*(1 - x^b)^b))^n, where m = a + b, may satisfy the same
        supercongruences for all sufficiently large primes p depending on m (A372211,
        comments; the power n is supplied, see the divergences).
