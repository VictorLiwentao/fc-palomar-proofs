automation:
  methods:
    - method: "agent"
      models:
        - "claude-opus-5-5"
      framework: "Claude Code"
      tool_setup: >-
        Claude Code (Anthropic) developed the proof, wrote the Lean formalization and
        prepared this package under the direction of Wentao Li, with independent agent
        review of the statement against its source. Wentao Li is the human author and
        maintainer.
  spend_usd: "not available"
  notes: >-
    AI assistance was material, including in developing the proof. The conjectures are
    due to Peter Bala. The p^(2k) towers are known for every cyclotomic ratio (rbajaj5,
    October 15, 2026; R. Blanco Gómez, October 17, 2026). The reduction of the p^(3k)
    towers to a quadratic estimate, by the Dwork–Cartier expansion and integration by
    parts, follows rbajaj5's proof for (a, b) = (1, 2) (A351858). New as far as we
    found: the quadratic estimate v_p([x^T] M_p²) ≥ v_p(T) for p | T and every (a, b)
    with p ∤ abm, where M_p = Σ_{p∤n} c(n)xⁿ/n is the p-free part of log f, proved with
    sums of inverse squares modulo p^e and the oddness of their partial sums; and its
    extension to the variant f⁻, which also uses a distribution relation. Wentao Li is
    the human author of this package's proof.

fidelity:
  divergences: >-
    Bala's general clauses write [x^n] of the series without the power n; the package
    reads them as [x^n] f(x)^n, as the main entries and the A000984 remark require, and
    the literal reading fails for every prime when a = b = 1, and states 'sufficiently
    large primes depending on m' as the existence of a bound P₀ depending only on m.
    A372211 is stated for p ≥ 7 (Bala's u_{1,1} range p ≥ 5 is not claimed at p = 5);
    A372213 is stated for p ≥ 5, p ≠ 7, which contains Bala's range p ≥ 11. Negative
    powers of f are written with invOfUnit. The hypotheses r ≥ 1 and n ≥ 1 are kept from
    the source although the proof does not need them. The statements were written for
    this package. They are proposed for Formal Conjectures as
    FormalConjectures/OEIS/372211.lean, which does not exist upstream yet.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    Checks by AI agents only: a strict build with no warnings, an axiom check of the
    selected theorems, a check that the Challenge declarations appear verbatim in
    Solution, and a review of the statement against its source by a separate agent. No
    independent human review is claimed.

