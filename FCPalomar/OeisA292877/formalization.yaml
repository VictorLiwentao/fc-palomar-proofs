automation:
  methods:
    - method: "agent"
      models:
        - "claude-opus-5-5"
      framework: "Claude Code"
      tool_setup: >-
        Claude Code (Anthropic) developed the proof, wrote the Lean formalization and
        prepared this package under the direction of Wentao Li, with independent agent
        review of the statement against its source. Wentao Li is the human author and
        maintainer.
  spend_usd: "not available"
  notes: >-
    AI assistance was material, including in developing the proof. The conjectures are
    due to Paul D. Hanna. Earlier informal proofs exist for two entries: A371673
    (OpenWitness, October 25, 2026) and A230218 (trureturing issue #27126, November 6,
    2026). A303563 follows from the A230218 case through 1/A303563(x) = A230218(−x). The
    other five entries and the general theorems are new as far as the searches found.
    Wentao Li is the human author of this package's proof.

fidelity:
  divergences: >-
    Each defining condition is stated literally as in the entry's name line, with
    1/A(x)^k written as (A^k)⁻¹. For A292877, A303562, A303563, A171791 and A230218 the
    conditions do not fix a(0) and a(1); the package adds a(0) = a(1) = 1 from the data
    and the PARI programs (A171791's name states it). For A263075, A263190 and A371673
    the conditions force a(0) = a(1) = 1. Integrality of the coefficients is added; the
    entries take it for granted. A263190's conjectures (1) and (2) are not covered. The
    general theorems are not in the sources. The statements were written for this
    package from the OEIS entries and are proposed for Formal Conjectures as
    FormalConjectures/OEIS/292877.lean, which does not exist upstream yet.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    Checks by AI agents only: a strict build with no warnings, an axiom check of the
    selected theorems, a check that the Challenge declarations appear verbatim in
    Solution, and a review of the statement against its source by a separate agent. No
    independent human review is claimed.

alignment:
  namespace: "OeisA292877"
  statements:
    - source: >-
        Not in the sources. For every integer m there is exactly one T ∈ ℤ[[x]] with
        T(0) = 1 and T = 1 + x·T^m, the Fuss–Catalan series T_m.
      lean: "OeisA292877.fussCatalan_existsUnique"
      module: "FCPalomar.OeisA292877.Solution"
      status: "proved"
    - source: >-
        Not in the sources. For every integer m exactly one A ∈ ℚ[[x]] satisfies a(0) =
        a(1) = 1 and [x^N] A(x)^(−(N^2 + (m−1)N + 1)) = 0 for N ≥ 2. With N = n − 1,
        A303563, A292877 and A303562 are the cases m = 2, 3, 4.
      lean: "OeisA292877.familyI_existsUnique"
      module: "FCPalomar.OeisA292877.Solution"
      status: "proved"
    - source: >-
        Not in the sources. For every integer m and every integer sequence R_N, exactly
        one A ∈ ℚ[[x]] satisfies a(0) = a(1) = 1 and [x^N] A(x)^(N^2 − mN + 1) = R_N for
        N ≥ 2. A230218 is the case m = −1, R = 0; A171791, A263075, A263190 and A371673
        are cases with m = −2.
      lean: "OeisA292877.familyII_existsUnique"
      module: "FCPalomar.OeisA292877.Solution"
      status: "proved"
    - source: >-
        Not in the sources. For every integer m the solution of family (I) has integer
        coefficients, and a(n) ≡ [x^n] T_m (mod 2) for every n.
      lean: "OeisA292877.familyI_integral_mod_two"
      module: "FCPalomar.OeisA292877.Solution"
      status: "proved"
    - source: >-
        Not in the sources. For every integer m, if 2(N^2 − mN + 1) divides R_N for N ≥
        2, the solution of family (II) has integer coefficients, and a(n) ≡ [x^n] T_m
        (mod 2) for every n.
      lean: "OeisA292877.familyII_integral_mod_two"
      module: "FCPalomar.OeisA292877.Solution"
      status: "proved"
    - source: >-
        G.f. A(x) satisfies: [x^(n-1)] 1/A(x)^(n^2) = 0 for n>2 (A292877, name). The
        conditions leave a(0) and a(1) free; a(0) = a(1) = 1 is taken from the data and
        the PARI program.
      lean: "OeisA292877.a292877_existsUnique"
      module: "FCPalomar.OeisA292877.Solution"
      status: "proved"
    - source: >-
        Not stated in A292877: the entry lists integer terms without a proof that all
        terms are integers.
      lean: "OeisA292877.a292877_integral"
      module: "FCPalomar.OeisA292877.Solution"
      status: "proved"
    - source: >-
        Conjectures: (1) a(2^n) is odd for n>=0 (A292877, comments, September 26, 2017).
      lean: "OeisA292877.a292877_conj1"
      module: "FCPalomar.OeisA292877.Solution"
      status: "proved"
