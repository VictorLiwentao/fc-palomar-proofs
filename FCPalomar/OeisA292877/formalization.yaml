version: "v0.4"

project:
  name: "Hanna's parity conjectures for eight power-series entries (OEIS A292877 family)"
  description: >-
    Each of eight OEIS entries by Paul D. Hanna defines a power series A(x) by
    coefficient conditions on its powers, such as [x^(n−1)] 1/A(x)^(n²) = 0 for n > 2
    (A292877) or [x^n] A(x)^(n²+n+1) = 0 for n > 1 (A230218). For each entry the package
    proves that the conditions determine A uniquely (with a(0) = a(1) = 1 for the five
    entries whose conditions leave a(0) and a(1) free), that its coefficients are
    integers, and Hanna's conjectures on which coefficients are odd: the Fibbinary
    numbers for A292877 (with its two other conjectures), (4^k − 1)/3 for A303562, 2^k −
    1 for A303563, the powers of 2 (for n > 0) for A230218, and 2f + 1 with f Fibbinary
    (for n > 0) for A171791, A263075, A263190 and A371673. For every integer m, general
    theorems treat two families with a(0) = a(1) = 1: (I) [x^N] A^(−(N²+(m−1)N+1)) = 0
    and (II) [x^N] A^(N²−mN+1) = R_N, for N ≥ 2. Each has exactly one solution. Its
    coefficients are integers congruent modulo 2 to those of the Fuss–Catalan series T_m
    = 1 + xT_m^m, in family (II) when 2(N² − mN + 1) divides R_N. The eight entries are
    cases with m = 2, 3, 4, −1 and −2.
  authors:
    - "Wentao Li"
  responsible_maintainers:
    - "Wentao Li"
  license: "Apache-2.0"

sources:
  - title: "OEIS A292877"
    authors:
      - "Paul D. Hanna"
    id: "https://oeis.org/A292877"
    type: "web discussion"
    location: "entry of September 25, 2017, comments"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      States the three conjectures: a(2^n) is odd; a(n) is odd iff n is Fibbinary; the
      count of odd terms in [2^n, 2^(n+1)) is Fibonacci(n+1). Searches in November 2026
      (the OEIS entries, arXiv, Zenodo, OpenWitness, GitHub issues, pull requests and
      code, and public Lean and OEIS-proof result repositories) found no earlier proof
      except for A371673 and A230218 (see below). The proof in this package is credited
      to Wentao Li.
  - title: "OEIS A303562"
    authors:
      - "Paul D. Hanna"
    id: "https://oeis.org/A303562"
    type: "web discussion"
    location: "entry of April 27, 2018, comments"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Conjectures that a(n) is odd iff n = (4^k − 1)/3 for some k ≥ 0.
  - title: "OEIS A303563"
    authors:
      - "Paul D. Hanna"
    id: "https://oeis.org/A303563"
    type: "web discussion"
    location: "entry of April 27, 2018, comments"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Conjectures that a(n) is odd iff n = 2^k − 1 for some k ≥ 0.
  - title: "OEIS A171791"
    authors:
      - "Paul D. Hanna"
    id: "https://oeis.org/A171791"
    type: "web discussion"
    location: "entry of January 24, 2010, comments"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Observes that for k > 0, a(k) is odd iff k = 2f + 1 with f Fibbinary, checked to
      1028 terms (S. A. Irvine).
  - title: "OEIS A263075"
    authors:
      - "Paul D. Hanna"
    id: "https://oeis.org/A263075"
    type: "web discussion"
    location: "entry of October 8, 2015, comments"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Observes the same odd-term pattern, 2f + 1 with f Fibbinary.
  - title: "OEIS A263190"
    authors:
      - "Paul D. Hanna"
    id: "https://oeis.org/A263190"
    type: "web discussion"
    location: "entry of October 12, 2015, comments, conjecture (3)"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Conjecture (3), the odd-term pattern 2f + 1 with f Fibbinary. Conjectures (1), the
      limit a(n)/(n!)² → 1/e, and (2), no negative terms, are not covered.
  - title: "OEIS A371673"
    authors:
      - "Paul D. Hanna"
    id: "https://oeis.org/A371673"
    type: "web discussion"
    location: "entry of April 2, 2024, comments"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Conjectures that a(n) is odd for n > 0 iff n = 2f + 1 with f Fibbinary.
  - title: "OEIS A230218"
    authors:
      - "Paul D. Hanna"
    id: "https://oeis.org/A230218"
    type: "web discussion"
    location: "entry of October 11, 2013, formula section"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Conjectures that for n > 0, a(n) is odd iff n is a power of 2 (formula section,
      October 11, 2013). The body of trureturing issue #27126 (November 6, 2026) gives
      an earlier informal proof of this conjecture, with integrality (see the next
      source). The proof in this package was found independently.
  - title: "Open problem (preregistration): prove Paul D. Hanna's OEIS A230218 first FORMULA conjecture (dyadic odd support; no arXiv source)"
    authors:
      - "The Omega Institute trureturing contributors"
    id: "https://github.com/the-omega-institute/trureturing/issues/27126"
    type: "web discussion"
    location: "issue body, sections Statement and settlement and Proof outline, November 6, 2026"
    relationship: "independently-proves"
    author_endorsement: "not-contacted"
    note: >-
      An AI-produced preregistration (it names a Claude Code orchestrator and codex
      research seats) with a complete informal proof of the A230218 parity conjecture
      and of integral existence and uniqueness: a normalized integral row, a Lagrange
      comparison with 1 + T where T = x − T², evenness of C(n², n), and uniqueness of
      the reduced rows mod 2. It is not machine-checked, and no Lean proof had been
      posted by November 14, 2026. It treats only A230218. With the identity
      1/A303563(x) = A230218(−x), shown in A303563's entry, it also gives the A303563
      conjecture in a few lines. The proof in this package was found independently.
  - title: "Fourteen open OEIS parity conjectures proved where the mod-2 reduction is degenerate (comment 120892)"
    authors:
      - "hilbert-clavius"
    id: "https://www.openwitness.net/p/10125"
    type: "web discussion"
    location: "OpenWitness post 10125, follow-up comment 120892, October 25, 2026"
    relationship: "independently-proves"
    author_endorsement: "not-contacted"
    note: >-
      An AI-agent follow-up comment that proves the A371673 parity conjecture by a
      2-adic lifting lemma, assuming integer coefficients (a hand proof, not machine-
      checked); a gap raised in comment 120906 was closed in comment 120908. It does not
      treat the other seven entries. The proof in this package was found independently.

