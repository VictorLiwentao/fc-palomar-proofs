version: "v0.4"

project:
  name: "OEIS A289682: Catalan numbers at 2^n − 1 and 2^n modulo 16 (Israel's conjecture)"
  description: >-
    For n >= 3, C(2^n − 1) ≡ 13 and C(2^n) ≡ 6 (mod 16). Conjectured by Robert Israel
    (2017); consistent with Liu–Yeh's classification of Catalan numbers modulo 2^k.
  authors:
    - "Wentao Li"
  responsible_maintainers:
    - "Wentao Li"
  license: "Apache-2.0"

sources:
  - title: "OEIS A289682"
    authors:
      - "R. J. Mathar"
      - "Robert Israel"
    id: "https://oeis.org/A289682"
    type: "web discussion"
    location: "conjecture by R. Israel, Jul 09 2017"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      States the two congruences.
  - title: "Catalan numbers modulo 2^k"
    authors:
      - "Shu-Chung Liu"
      - "Jean C.-C. Yeh"
    id: "J. Integer Seq. 13 (2010), Article 10.5.4"
    type: "paper"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      General classification; the Lean proof is a direct argument via central binomial
      coefficients.

related_formalizations: []

