version: "v0.4"

project:
  name: "Erdős Problem 626: Erdős's upper bound g_k(n) <= 2 log n / log(k−2) + 1"
  description: >-
    For k >= 4 and all sufficiently large n, g_k(n) <= 2 log n / log(k−2) + 1, where
    g_k(n) is the largest m such that some graph on n vertices with chromatic number k
    has no cycle of length <= m. This is Erdős's upper bound (Mathematika 1962, Theorem
    1) in the form his printed proof gives. Erdős's g_k(n) is the largest girth, one
    more than the g_k(n) used here, so the formal bound is one weaker than Theorem 1 as
    printed. With Erdős's lower bound of order log n, it shows that g_k(n) has order log
    n. Whether g_k(n)/log n converges is the open Erdős Problem 626.
  authors:
    - "Wentao Li"
  responsible_maintainers:
    - "Wentao Li"
  license: "Apache-2.0"

sources:
  - title: "On circuits and subgraphs of chromatic graphs"
    authors:
      - "Paul Erdős"
    id: "doi:10.1112/S0025579300003260"
    type: "paper"
    location: "Mathematika 9 (1962) 170-175, Theorem 1 (proof p. 172)"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Erdős's g_k(n) is the girth itself; the Formal Conjectures g is the girth minus 1
      with Erdős's +1 kept, so the formal statement is 1 weaker than Theorem 1 as
      printed and equals what the printed proof gives.
  - title: "Erdős Problem 626"
    authors:
      - "Thomas Bloom"
    id: "https://www.erdosproblems.com/626"
    type: "web discussion"
    location: "Problem 626"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      States the bound (attributed there to [Er59b]).

