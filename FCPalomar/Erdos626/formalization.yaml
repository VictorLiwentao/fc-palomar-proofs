fidelity:
  divergences: >-
    Relative to Formal Conjectures: none. The Challenge copies the statement and g
    verbatim, without the FormalConjecturesUtil import, the attributes, the module
    docstring or unrelated declarations. Relative to Erdős (1962): Erdős's g_k(n) is the
    largest girth, while g here is the largest girth minus 1 and Erdős's +1 is kept. So
    the statement is one weaker than Theorem 1 as printed and equals what the printed
    proof gives. It is also stated only for sufficiently large n. The copied theorem
    docstring cites [Er59b], as erdosproblems.com does. The bound is in [Er62b], and
    Er59b proves only the existence direction.

