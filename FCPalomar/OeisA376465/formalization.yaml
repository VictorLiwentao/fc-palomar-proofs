fidelity:
  divergences: >-
    OeisA376465.tower states Bala's first congruence for A376465 as written.
    OeisA376465.not_shifted_tower is the negation of his second congruence: the package
    refutes that clause. The definitions follow the OEIS name line and Maple code. At n
    = 0 the factor A108625(−1, 0) is read as T(0, 0) = 1 (natural subtraction). This
    agrees with the extension T(−n, k) = T(n−1, k) on A108625 and with a(0) = 1 in the
    OEIS data. tower never uses a(0); the universal statement negated in
    not_shifted_tower uses it only at n = r = 1. The statements were written for this
    package from the OEIS entry and are proposed for Formal Conjectures as
    FormalConjectures/OEIS/376465.lean, which does not exist upstream yet.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    Checks by AI agents only: a strict build with no warnings, an axiom check of the
    selected theorems, a check that the Challenge declarations appear verbatim in
    Solution, and a review of the statement against its source by a separate agent. No
    independent human review is claimed.

alignment:
  namespace: "OeisA376465"
  statements:
    - source: >-
        1) a(n*p^r) == a(n*p^(r-1)) (mod p^(3*r)) for all primes p >= 5 and all positive
        integers n and r (conjecture, comments).
      lean: "OeisA376465.tower"
      module: "FCPalomar.OeisA376465.Solution"
      status: "proved"
    - source: >-
        2) a(n*p^r - 1) == a(n*p^(r-1) - 1) (mod p^(3*r)) for all primes p >= 5 and all
        positive integers n and r (conjecture, comments). The Lean statement is its
        negation.
      lean: "OeisA376465.not_shifted_tower"
      module: "FCPalomar.OeisA376465.Solution"
      status: "proved"
